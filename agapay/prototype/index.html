  });
  P.action("id.download", (v) => {
    const [id, kind] = v.split("|");
    const s = P.statement(id);
    P.audit(
      `Downloaded Settlement Statement (${kind})`,
      `${P.branchName(s.branch)}, ${s.period}`,
    );
    P.toast(
      "Download ready",
      `Settlement Statement ${s.period}${isHO() ? "" : ", your Branch only"} as ${kind}.`,
    );
  });

  /* ---------- ID-08 Users ---------- */
  function usersIn() {
    const i = inst(),
      r = reach();
    return P.db.institutionUsers.filter(
      (u) =>
        u.inst === i.id &&
        (isHO()
          ? u.role === "Head Office"
            ? true
            : r.includes(u.branch)
          : u.branch === me().branch && u.role !== "Head Office"),
    );
  }
  const isDash = (u) => u.role === "Head Office" || u.role === "manager";
  const self = (u) => u.key === me().key;
  const canManage = (u) =>
    !viewOnly() &&
    !self(u) &&
    (isHO() || u.role === "counter staff" || u.role === "manager");
  const tempCode = () => String(100000 + Math.floor(Math.random() * 900000));
  P.screen("ID-08", {
    title: "Users",
    render: () => {
      if (viewOnly())
        return `${viewBanner()}${stateMsg("lock", "You do not have access to this screen.", "The Institution is view-only.")}<p>${link("Go to Overview", "ID-01")}</p>`;
      const rows = usersIn().map(
        (u) =>
          `<tr><th scope="row"><a href="#" data-a="id.openUser" data-v="${esc(u.key)}">${esc(u.name)}</a></th><td>${esc(u.role)}</td><td>${esc(u.branch ? P.branch(u.branch).name : "All Branches")}</td><td>${u.temp ? badge("warning", "new") : ""} ${status(u.status)}</td></tr>`,
      );
      return `<div class="stack">${head("Users", sub(), btn("Add user", "id.addUser", { kind: "primary", icon: "plus" }))}${panelHtml("", P.table("Institution Users", ["Name", "Role", "Branch", "Status"], rows), { raw: true, footer: P.pager(rows.length) })}<p class="text-muted">Counter staff sign in on the Counter Terminal with a passcode. They have no Institution Dashboard access.</p></div>`;
    },
  });
  const FU = () => P.S.form.id08 || (P.S.form.id08 = {});
  P.action("id.addUser", () => {
    P.S.form.id08 = {
      name: "",
      role: "counter staff",
      branch: isHO() ? P.S.ui.branch || inst().branches[0].id : me().branch,
    };
    P.openPanel("id-user-new", {});
  });
  P.action("id.openUser", (v) => P.openPanel("id-user", { key: v }));
  P.panel("id-user-new", (p) => {
    if (p.saved) {
      const u = P.db.institutionUsers.find((x) => x.key === p.saved);
      return {
        title: u.name,
        body: `<div class="stack">${alert("User added", `Give ${esc(u.name)} this temporary ${isDash(u) ? "password" : "passcode"}. It is shown once. ${isDash(u) ? "The first sign-in sets a new password and the authenticator app." : "The first sign-in on the Counter Terminal sets their own passcode."}`, "circle-check")}${detail(
          [
            [
              "Temporary " + (isDash(u) ? "password" : "passcode"),
              `<b class="tabular" style="font-size:20px;letter-spacing:.1em">${esc(isDash(u) ? u.tempPassword : u.passcode)}</b>`,
            ],
            ["Role", esc(u.role)],
            [
              "Branch",
              esc(u.branch ? P.branch(u.branch).name : "All Branches"),
            ],
          ],
        )}</div>`,
        footer: btn("Done", "closePanel", { kind: "primary" }),
      };
    }
    const f = FU(),
      err = P.S.ui.err.idUser;
    const roles = (
      isHO()
        ? ["counter staff", "manager", "Head Office"]
        : ["counter staff", "manager"]
    ).map((r) => [r, r]);
    const why = !String(f.name || "").trim() ? "Enter the full name." : "";
    const branchField =
      f.role === "Head Office"
        ? '<p class="text-muted">A Head Office user belongs to no Branch and sees every Branch.</p>'
        : isHO()
          ? field(
              "Branch",
              select(
                "form.id08.branch",
                inst().branches.map((b) => [b.id, b.name]),
              ),
            )
          : detail([["Branch", esc(P.branch(me().branch).name)]]);
    return {
      title: "Add user",
      body: `<div class="stack">${field("Full name (required)", input("form.id08.name", { err: err && why }), "", err && why)}<div class="field" role="radiogroup" aria-label="Role"><span class="field__label">Role (one only)</span>${P.radios("form.id08.role", roles)}</div>${branchField}</div>`,
      footer: `${P.reasonOff(why)}${btn("Cancel", "closePanel")}${btn("Add user", "id.saveUser", { kind: "primary", off: !!why })}`,
    };
  });
  P.action("id.saveUser", () => {
    const f = FU();
    if (!String(f.name || "").trim()) return;
    const i = inst();
    const role = isHO()
      ? f.role
      : f.role === "Head Office"
        ? "counter staff"
        : f.role;
    const key = "iu-" + Date.now().toString(36);
    const u = {
      key,
      name: f.name.trim(),
      role,
      inst: i.id,
      branch: role === "Head Office" ? null : isHO() ? f.branch : me().branch,
      status: "active",
      passcode: tempCode(),
      temp: true,
    };
    if (isDash(u)) {
      u.mustChange = true;
      u.tempPassword =
        "AGP-" +
        Math.random().toString(36).slice(2, 6).toUpperCase() +
        "-" +
        (1000 + Math.floor(Math.random() * 9000));
    }
    P.db.institutionUsers.push(u);
    P.audit(
      "Added Institution User",
      `${u.name}, ${u.role}, ${u.branch ? P.branchName(u.branch) : i.name + ", Head Office"}`,
    );
    P.mark("idUserAdded");
    P.openPanel("id-user-new", { saved: key });
    P.toast(
      "User added",
      `${u.name} shows on the Counter Terminal sign-in list.`,
    );
  });
  P.panel("id-user", ({ key, secret }) => {
    const u = P.db.institutionUsers.find((x) => x.key === key);
    if (!u)
      return {
        title: "User",
        body: stateMsg("lock", "This record cannot be opened.", ""),
      };
    const can = canManage(u);
    const acts = can
      ? [
          u.status === "disabled"
            ? btn("Enable", "id.userAct", { v: key + "|enable" })
            : btn("Disable", "id.userAct", {
                v: key + "|disable",
                kind: "destructive",
              }),
          u.status === "locked"
            ? btn("Unlock", "id.userAct", {
                v: key + "|unlock",
                kind: "primary",
              })
            : "",
          isDash(u)
            ? btn("Reset second factor", "id.userAct", { v: key + "|tfa" })
            : "",
        ].join("")
      : `<span class="button-reason">${self(u) ? "You cannot change your own account here." : "Only Head Office manages this account."}</span>`;
    return {
      title: u.name,
      body: `<div class="stack">${secret ? alert("New temporary passcode", `Give ${esc(u.name)} this passcode. It is shown once: <b class="tabular">${esc(secret)}</b>`, "circle-check") : ""}${detail([["Role", esc(u.role)], ["Branch", esc(u.branch ? P.branch(u.branch).name : "All Branches")], ["Status", status(u.status)], ["Signs in on", isDash(u) ? "Institution Dashboard and Counter Terminal" : "Counter Terminal only"], isDash(u) ? ["Second factor", esc(u.tfaReset ? "reset, set up at next sign-in" : "authenticator app set up")] : null])}<div class="row">${acts}</div></div>`,
      footer: btn("Close", "closePanel"),
    };
  });
  P.action("id.userAct", (v) => {
    const [key, act] = v.split("|"),
      u = P.db.institutionUsers.find((x) => x.key === key);
    if (!u || !canManage(u)) return;
    const run = {
      disable: () => {
        u.status = "disabled";
        P.audit("Disabled Institution User", u.name);
        P.toast("User disabled", `${u.name} can no longer sign in.`);
        P.openPanel("id-user", { key });
      },
      enable: () => {
        u.status = "active";
        P.audit("Enabled Institution User", u.name);
        P.toast("User enabled", u.name);
        P.openPanel("id-user", { key });
      },
      unlock: () => {
        const s = tempCode();
        u.status = "active";
        u.fails = 0;
        u.passcode = s;
        u.temp = true;
        P.audit(
          "Unlocked Institution User and issued a temporary passcode",
          u.name,
        );
        P.toast("User unlocked", u.name);
        P.openPanel("id-user", { key, secret: s });
      },
      tfa: () => {
        u.tfaReset = true;
        P.audit("Reset second factor", u.name);
        P.toast(
          "Second factor reset",
          `${u.name} sets up the authenticator app at next sign-in.`,
        );
        P.openPanel("id-user", { key });
      },
    }[act];
    const titles = {
      disable: [
        `Disable ${u.name}?`,
        `${u.name} can no longer sign in on the Institution Dashboard or the Counter Terminal.`,
        "Disable user",
        "destructive",
      ],
      enable: [
        `Enable ${u.name}?`,
        `${u.name} can sign in again.`,
        "Enable user",
      ],
      unlock: [
        `Unlock ${u.name}?`,
        "A new temporary passcode is shown once. The next sign-in sets their own.",
        "Unlock user",
      ],
      tfa: [
        `Reset the second factor of ${u.name}?`,
        "They set up the authenticator app again at next sign-in. The reset is logged.",
        "Reset second factor",
      ],
    }[act];
    P.confirm({
      title: titles[0],
      body: `<p>${esc(titles[1])}</p>`,
      ok: titles[2],
      kind: titles[3] || "primary",
      action: run,
    });
  });

  /* Manager sees their Branch name as fixed text in place of the selector: shown in each screen's subtitle (sub()). */
})();

</script>
    <script>
/* Agapay prototype: Counter Terminal (CT-00 to CT-15).
   One registered screen 'CT' switches across the steps. State lives in P.S.ct[serial].
   Markup copies key-01-counter-terminal-sale.html and key-00-components.html. */
(() => {
  "use strict";
  const P = window.P;
  const { esc, fmt, ic, photo } = P;

  /* ---------- state ---------- */
  const tb = (label, a, o = {}) =>
    P.btn(label, a, Object.assign({ terminal: true }, o));
  const offBtn = (label, a, reason, o = {}) =>
    (reason ? P.reasonOff(reason) : "") +
    tb(label, a, Object.assign({ off: !!reason }, o));
  function T(serial) {
    const all = P.S.ct;
    if (!all[serial])
      all[serial] = {
        serial,
        user: null,
        step: "signin",
        pick: null,
        buf: "",
        err: "",
        newPass: null,
        fails: {},
        bene: null,
        sale: null,
        notice: "",
        dialog: null,
        slip: null,
        paperOut: false,
        offline: false,
        dropNext: false,
        battery: 82,
        checking: null,
        refusal: 0,
        txNo: null,
        findNo: "",
        findErr: "",
        voidSt: null,
        auth: null,
        lastTx: null,
        receiptPending: false,
        voidSlipPending: false,
        tapLine: "",
      };
    return all[serial];
  }
  const curSerial = () => {
    const p = P.persona();
    return p && p.app === "ct" ? p.terminal : null;
  };
  const cur = () => {
    const s = curSerial();
    return s ? T(s) : null;
  };
  const bp = (t) => `ct.${t.serial}`; /* bind path prefix */
  function go(t, step) {
    t.step = step;
    t.buf = "";
    t.err = "";
    t.dialog = null;
  }

  /* ---------- context ---------- */
  function ctx(serial) {
    const term = P.db.terminals.find((x) => x.serial === serial);
    const br = term && term.branch ? P.branch(term.branch) : null;
    return { term, br, inst: br ? br.inst : null };
  }
  const daysUntil = (d) =>
    Math.round((new Date(d) - new Date(P.TODAY)) / 864e5);
  /* Refusal 3 conditions: null when this Counter Terminal can record sales */
  function blocked(c) {
    if (!c.term || c.term.status !== "assigned" || !c.br) return "terminal";
    if (["suspended", "revoked"].includes(c.inst.status)) return "institution";
    if (c.br.status && ["suspended", "revoked"].includes(c.br.status))
      return "branch";
    if (c.br.accTo && daysUntil(c.br.accTo) < 0) return "expired";
    return null;
  }
  const user = (t) =>
    t.user ? P.db.institutionUsers.find((u) => u.key === t.user) : null;
  const short = (u) => {
    const m = u.name.match(/^(Mr\.|Mrs\.|Ms\.|Dr\.)\s+(?:\S+\s+)*?(\S+)$/);
    return m ? `${m[1]} ${m[2]}` : u.name.split(" ")[0];
  };
  const canAuthorize = (u) =>
    u && (u.role === "manager" || u.role === "Head Office");
  function staffList(c) {
    if (!c.br) return [];
    return P.db.institutionUsers.filter(
      (u) =>
        u.inst === c.inst.id &&
        (u.branch === c.br.id || u.role === "Head Office") &&
        u.status !== "disabled",
    );
  }
  const helpLine = () =>
    (P.db.settings && P.db.settings.helpLine) || "{Program help line}";
  const REFUSAL = {
    1: ["This is not a genuine Card.", ""],
    2: [
      "The Card cannot be used.",
      "The Beneficiary should contact the Province's Agapay office.",
    ],
    3: ["This Branch or Counter Terminal cannot record sales.", ""],
  };
  function refusalFor(b, c) {
    if (blocked(c)) return 3;
    const card = b && P.card(b);
    if (!b || b.status !== "active" || !card || card.status !== "issued")
      return 2;
    return 0;
  }
  const needsDiscount = (b) => ["senior citizen", "PWD"].includes(b.category);
  const isPharmacy = (c) => c.inst && c.inst.type === "pharmacy";
  const branchShort = (id) => {
    const b = P.branch(id);
    return b ? `${b.inst.name}, ${b.name.replace(/ Branch$/, "")}` : "";
  };
  const maskedPid = (pid) => `**** **** ${String(pid).slice(-4)}`;
  const isToday = (tx) => String(tx.when).startsWith(P.TODAY + ",");

  /* ---------- sale math ---------- */
  function totals(t) {
    const s = t.sale,
      b = P.bene(t.bene);
    const total = s.lines.reduce((a, l) => a + l[1] * l[2], 0);
    const discount =
      !needsDiscount(b) || s.noDisc
        ? 0
        : Math.min(Math.max(P.num(s.discount), 0), total);
    const due = total - discount;
    const avail = P.available(b);
    const credits = Math.min(due, Math.max(avail, 0));
    return {
      total,
      discount,
      due,
      credits,
      cash: due - credits,
      after: avail - credits,
      current: avail - credits + P.pending(b),
    };
  }
  function saleNo(branch) {
    const res = P.S.ct._reserved || (P.S.ct._reserved = {});
    const n = Math.max(+P.nextTxNo(branch), (res[branch] || 0) + 1);
    return String(n).padStart(4, "0");
  }
  function previousTx(beneKey, beforeNo) {
    return P.db.tx
      .filter(
        (x) =>
          x.bene === beneKey &&
          x.no !== beforeNo &&
          ["completed", "held"].includes(x.status),
      )
      .sort(
        (a, b) =>
          new Date(b.when.replace(",", "")) - new Date(a.when.replace(",", "")),
      )
      .slice(0, 3)
      .map((x) => [x.when.split(",")[0], x.credits, branchShort(x.branch)]);
  }
  function people(b) {
    return [{ k: "bene", n: b.name, r: "Beneficiary" }].concat(
      b.reps.map((r, i) => ({
        k: "rep" + i,
        n: r.name,
        r: "Authorized Representative",
      })),
    );
  }

  function recordSale(t, c, sale, beneKey) {
    const b = P.bene(beneKey),
      u = user(t);
    const saved = t.sale;
    t.sale = sale;
    t.bene = beneKey;
    const tt = totals(t);
    t.sale = saved;
    const pr = people(b).find((x) => x.k === sale.presenter) || people(b)[0];
    const st = P.db.statements.find(
      (s) =>
        s.branch === c.br.id &&
        s.stage === "draft" &&
        s.period === "1 to 15 Nov 2026",
    );
    const prev = previousTx(beneKey, sale.no);
    const tx = {
      no: sale.no,
      bene: beneKey,
      branch: c.br.id,
      when: P.stamp(),
      lines: sale.lines.map((l) => l.slice()),
      total: tt.total,
      discount: tt.discount,
      credits: tt.credits,
      cash: tt.cash,
      presenter:
        pr.r === "Beneficiary"
          ? "Beneficiary"
          : `${pr.n}, Authorized Representative`,
      staff: u ? short(u) : "",
      staffKey: u ? u.key : null,
      terminal: t.serial,
      status: "completed",
      stmt: st ? st.id : null,
      hold: null,
      voidReason: "",
      reversal: null,
      rx: isPharmacy(c)
        ? { name: sale.rx.name, license: sale.rx.license, date: sale.rx.date }
        : null,
      noDiscountReason: sale.noDisc
        ? sale.noDiscReason === "Other"
          ? `Other: ${sale.noDiscOther}`
          : sale.noDiscReason
        : "",
      after: tt.after,
      currentAfter: tt.current,
      pendingAt: P.pending(b),
      prev,
      prints: 0,
    };
    P.db.tx.push(tx);
    P.audit(
      "Sale recorded",
      `Transaction ${tx.no}, ${P.branchName(c.br.id)}, ${fmt(tx.credits)} Credits, ${b.name}${tx.presenter !== "Beneficiary" ? `, presented by ${pr.n}` : ""}, by ${tx.staff}`,
    );
    P.mark("ctSaleComplete");
    if (tx.presenter !== "Beneficiary") P.mark("ctSaleByRep");
    if (c.inst.type !== "pharmacy") P.mark("ctHospitalSale");
    t.lastTx = tx.no;
    t.bene = beneKey;
    t.sale = null;
    t.receiptPending = !print(t, { kind: "receipt", no: tx.no });
    if (!t.receiptPending) tx.prints = 1;
    go(t, "complete");
    return tx;
  }

  /* ---------- printing ---------- */
  function print(t, slip) {
    if (t.paperOut) return false;
    t.slip = slip;
    return true;
  }
  function slipHeader(branchId, type, copy) {
    const br = P.branch(branchId);
    const addr = br ? br.addr.split(",").slice(0, 2).join(",") : "";
    const kind = `<span class="printed-slip__rule"></span>${copy ? '<span class="printed-slip__title">COPY</span>' : ""}<span class="printed-slip__title">${type}</span>${copy ? '<span class="printed-slip__title">COPY</span>' : ""}<span class="printed-slip__rule"></span>`;
    return `<div class="printed-slip__block"><span class="printed-slip__title">AGAPAY</span><span class="printed-slip__center">${esc(br ? br.inst.name : "")}</span><span class="printed-slip__center">${esc(br ? br.name : "")}</span><span class="printed-slip__center">${esc(addr)}</span></div><div class="printed-slip__block">${kind}</div>`;
  }
  const slipBene = (b) =>
    `<div class="printed-slip__block"><div>${esc(b.name)}</div><div class="printed-slip__row"><span>Program ID number</span><span>${maskedPid(b.pid)}</span></div></div>`;
  const slipBalances = (av, curr, pend) =>
    `<div class="printed-slip__block"><span class="printed-slip__rule"></span><div class="printed-slip__strong">Available Balance</div><span class="printed-slip__balance">${fmt(av)}</span><div class="printed-slip__row printed-slip__strong"><span>Current Balance</span><span>${fmt(curr)}</span></div>${pend > 0 ? `<div class="printed-slip__row"><span>Pending (awaiting approval)</span><span>${fmt(pend)}</span></div>` : ""}<span class="printed-slip__rule"></span></div>`;
  const slipFooter = (receipt) =>
    `<div class="printed-slip__block"><span class="printed-slip__rule"></span>${receipt ? '<span class="printed-slip__center">This is not an official receipt.</span>' : ""}<span class="printed-slip__center">${esc(helpLine())}</span></div>`;
  const slipStaff = (name, auth) =>
    `<div class="printed-slip__block"><div class="printed-slip__row"><span>Staff</span><span>${esc(name)}</span></div>${auth ? `<div class="printed-slip__row"><span>Authorized by</span><span>${esc(auth)}</span></div>` : ""}</div>`;
  const splitWhen = (w) => {
    const i = String(w).indexOf(", ");
    return i < 0 ? [w, ""] : [w.slice(0, i), w.slice(i + 2)];
  };

  function receiptHtml(tx, copy) {
    const b = P.bene(tx.bene);
    const [d, tm] = splitWhen(tx.when);
    const av = tx.after != null ? tx.after : P.available(b);
    const pend = tx.pendingAt != null ? tx.pendingAt : P.pending(b);
    const prev = tx.prev || previousTx(tx.bene, tx.no);
    const presented =
      tx.presenter && tx.presenter !== "Beneficiary"
        ? `<div class="printed-slip__block"><div>Presented by ${esc(tx.presenter)}</div></div>`
        : "";
    const lines = tx.lines
      .map(
        ([n, q, p]) =>
          `<div>${esc(n)}</div><div class="printed-slip__row"><span>${q === 1 && !isPh(tx) ? "Amount" : `${q} x ${fmt(p)}`}</span><span>${fmt(q * p)}</span></div>`,
      )
      .join("");
    return `<div class="printed-slip">${slipHeader(tx.branch, "RECEIPT", copy)}
<div class="printed-slip__block"><div class="printed-slip__row"><span>${esc(d)}</span><span>${esc(tm)}</span></div><div class="printed-slip__row"><span>Transaction number</span><span>${esc(tx.no)}</span></div></div>
${slipBene(b)}${presented}
<div class="printed-slip__block"><span class="printed-slip__rule"></span>${lines}<span class="printed-slip__rule"></span></div>
<div class="printed-slip__block"><div class="printed-slip__row printed-slip__strong"><span>Total</span><span>₱${fmt(tx.total)}</span></div><div class="printed-slip__row"><span>Discount</span><span>₱${fmt(tx.discount)}</span></div><div class="printed-slip__row printed-slip__strong"><span>Credits deducted</span><span>${fmt(tx.credits)}</span></div><div class="printed-slip__row"><span>Cash paid</span><span>₱${fmt(tx.cash)}</span></div></div>
${slipBalances(av, tx.currentAfter != null ? tx.currentAfter : av + pend, pend)}
${prev.length ? `<div class="printed-slip__block"><div>Previous Transactions</div>${prev.map((p) => `<div class="printed-slip__row"><span>${esc(p[0])}</span><span>${fmt(p[1])}</span></div><div>${esc(p[2])}</div>`).join("")}</div>` : ""}
${slipStaff(tx.staff)}${slipFooter(true)}</div>`;
  }
  const isPh = (tx) => {
    const b = P.branch(tx.branch);
    return b && b.inst.type === "pharmacy";
  };
  function balanceSlipHtml(slip) {
    const b = P.bene(slip.bene);
    const [d, tm] = splitWhen(slip.when);
    return `<div class="printed-slip">${slipHeader(slip.branch, "BALANCE")}<div class="printed-slip__block"><div class="printed-slip__row"><span>${esc(d)}</span><span>${esc(tm)}</span></div></div>${slipBene(b)}${slipBalances(slip.av, slip.av + slip.pend, slip.pend)}${slipStaff(slip.staff)}${slipFooter(false)}</div>`;
  }
  function voidSlipHtml(slip, copy) {
    const tx = P.txByNo(slip.no) || {};
    const b = P.bene(tx.bene);
    const [d, tm] = splitWhen(tx.voidWhen || P.stamp());
    return `<div class="printed-slip">${slipHeader(tx.branch, "VOID", copy)}<div class="printed-slip__block"><div class="printed-slip__row"><span>${esc(d)}</span><span>${esc(tm)}</span></div><div class="printed-slip__row"><span>Transaction number</span><span>${esc(tx.no)}</span></div><div class="printed-slip__row"><span>Sale date</span><span>${esc(splitWhen(tx.when)[0])}</span></div></div>${slipBene(b)}<div class="printed-slip__block"><div class="printed-slip__row printed-slip__strong"><span>Credits returned</span><span>${fmt(tx.credits)}</span></div></div>${slipBalances(tx.voidAfter, tx.voidAfter + (tx.voidPend || 0), tx.voidPend || 0)}${slipStaff(tx.voidBy, tx.voidAuth)}${slipFooter(false)}</div>`;
  }

  /* ---------- markup pieces ---------- */
  function titleBar(t, c) {
    const u = user(t);
    return `<header class="title-bar title-bar--terminal"><span class="title-bar__wordmark">Agapay</span><span class="title-bar__surface">${esc(c.br ? P.branchName(c.br.id) : "Not assigned to a Branch")}</span><span class="title-bar__status"><span class="title-bar__status-item">${ic(t.offline ? "wifi-off" : "wifi")}${t.offline ? "No connection" : "Connected"}</span><span class="title-bar__status-item">${ic("battery-medium")}${t.battery}%</span><span class="title-bar__status-item">${ic("printer")}${t.paperOut ? "No paper" : "Printer ready"}</span></span>${u ? `<span class="title-bar__account">${esc(short(u))} · ${esc(u.role)}</span>` : ""}</header>`;
  }
  const banner = (role, icon, text) =>
    `<div class="system-banner system-banner--${role} system-banner--terminal" role="status">${ic(icon)}<span class="system-banner__text">${esc(text)}</span></div>`;
  function banners(t, home) {
    let h = "";
    if (t.offline)
      h += banner(
        "destructive",
        "wifi-off",
        "No connection. No sales can be recorded.",
      );
    if (home && P.db.banner) h += banner("info", "info", P.db.banner);
    if (home && t.paperOut)
      h += banner(
        "warning",
        "triangle-alert",
        "Printer has no paper. Sales can be recorded but no Receipt will print.",
      );
    if (home && t.battery <= 15)
      h += banner(
        "warning",
        "triangle-alert",
        "Battery low. Charge the Counter Terminal.",
      );
    return h;
  }
  function stepScreen(t, c, o) {
    const tap = t.tapLine
      ? `<p class="text-destructive" role="status">${esc(t.tapLine)}</p>`
      : "";
    return `<div class="step-screen agapay">${titleBar(t, c)}${banners(t, o.home)}<div class="step-screen__content" data-scroll="ct-${t.serial}-${t.step}">${o.kicker ? `<p class="step-screen__kicker">${esc(o.kicker)}</p>` : ""}${o.title ? `<h3 class="step-screen__title">${esc(o.title)}</h3>` : ""}${tap}${o.content || ""}${o.actions ? `<div class="step-screen__actions">${o.actions}</div>` : ""}</div>${o.footer ? `<div class="step-screen__footer">${o.footer}</div>` : ""}</div>`;
  }
  function dots(n) {
    return Array.from(
      { length: 6 },
      (_, i) =>
        `<span class="pin-pad__dot${i < n ? " is-filled" : ""}"></span>`,
    ).join("");
  }
  function keys() {
    const k = (d) =>
      `<button class="pin-pad__key" type="button" data-a="ct.key" data-v="${d}">${d}</button>`;
    return `<div class="pin-pad__keys">${["1", "2", "3", "4", "5", "6", "7", "8", "9"].map(k).join("")}<span></span>${k("0")}<button class="pin-pad__key pin-pad__key--delete" type="button" data-a="ct.del">Delete</button></div>`;
  }
  const pinPad = (prompt, n, err) =>
    `<div class="pin-pad"><h3 class="pin-pad__prompt${err ? " is-error" : ""}">${esc(prompt)}</h3><div class="pin-pad__entry"><span class="pin-pad__dots">${dots(n)}</span><span>${n} of 6</span></div>${keys()}</div>`;
  const outcome = (variant, icon, title, msg, notes = []) =>
    `<div class="outcome-screen outcome-screen--${variant}"><span class="outcome-screen__mark">${ic(icon)}</span><h3 class="outcome-screen__title">${esc(title)}</h3>${msg ? `<div class="outcome-screen__message">${esc(msg)}</div>` : ""}${notes.map((n) => `<p class="outcome-screen__note">${n}</p>`).join("")}</div>`;
  const stateMsg = (icon, title, body) =>
    `<div class="state-message state-message--terminal"><span class="icon icon--xl icon--${icon} state-message__icon"></span><h3 class="state-message__title">${esc(title)}</h3>${body ? `<p class="state-message__body">${esc(body)}</p>` : ""}</div>`;
  const choice = (a, rows, sel, label) =>
    `<div class="choice-list choice-list--terminal" role="radiogroup" aria-label="${esc(label)}">${rows.map(([v, l, sub]) => `<button class="choice-list__row${String(v) === String(sel) ? " is-selected" : ""}" type="button" role="radio" aria-checked="${String(v) === String(sel)}" data-a="${a}" data-v="${esc(v)}"><span class="choice-list__text">${esc(l)}${sub ? `<span class="choice-list__sub">${esc(sub)}</span>` : ""}</span></button>`).join("")}</div>`;
  const tfield = (label, bind, o = {}) =>
    `<label class="field field--terminal"><span class="field__label">${esc(label)}</span>${P.input(bind, Object.assign({ terminal: true }, o))}${o.hint ? `<span class="field__hint">${esc(o.hint)}</span>` : ""}</label>`;
  function identity(b, statusHtml) {
    const reps = b.reps.length
      ? `<div class="identity-panel__reps">${b.reps.map((r) => `<span class="identity-panel__rep">${photo(r.name + ", Authorized Representative")}${esc(r.name)}<span class="text-muted">Authorized Representative</span></span>`).join("")}</div>`
      : "";
    return `<div class="identity-panel identity-panel--terminal"><span class="identity-panel__photo">${photo(b.name)}</span><div class="identity-panel__body"><h4 class="identity-panel__name">${esc(b.name)}</h4><p class="identity-panel__meta">Program ID number <span class="identity-panel__value tabular">${esc(b.pid)}</span></p><p class="identity-panel__meta">${esc(b.category)} · Age ${b.age}</p>${statusHtml}</div>${reps}</div>`;
  }
  const termBadge = (role, text) =>
    `<span class="status-badge status-badge--${role} status-badge--terminal"><span class="visually-hidden">Status: </span>${esc(text)}</span>`;
  function dialogHtml(t) {
    const d = t.dialog;
    if (!d) return "";
    return `<div class="dialog-overlay"><div class="dialog dialog--terminal" role="alertdialog" aria-modal="true" aria-label="${esc(d.title)}"><h3 class="dialog__title">${esc(d.title)}</h3><p class="dialog__body">${esc(d.body)}</p><div class="dialog__actions">${tb(d.ok, "ct.dialogOk", { kind: d.kind || "primary" })}${tb(d.cancel || "Cancel", "ct.dialogCancel")}</div></div></div>`;
  }

  /* ---------- screens ---------- */
  function scSignIn(t, c) {
    const why = blocked(c);
    if (why) {
      return stepScreen(t, c, {
        home: true,
        content:
          stateMsg(
            "ban",
            REFUSAL[3][0],
            why === "terminal"
              ? "This Counter Terminal is not assigned to a Branch, or it is switched off. No one can sign in."
              : "No one can sign in. Ask the Province's Agapay office.",
          ) + `<p class="outcome-screen__note">${esc(helpLine())}</p>`,
      });
    }
    if (t.offline)
      return stepScreen(t, c, {
        content:
          banner(
            "destructive",
            "wifi-off",
            "No connection. You cannot sign in.",
          ) +
          stateMsg(
            "wifi-off",
            "No connection. You cannot sign in.",
            "The user list and the keys return with the connection.",
          ),
      });
    const list = staffList(c);
    const u = t.pick && list.find((x) => x.key === t.pick);
    if (!u) {
      return stepScreen(t, c, {
        home: true,
        title: "Sign in",
        content: `<p class="type-terminal-body">Pick your name.</p>${choice(
          "ct.pickUser",
          list.map((x) => [
            x.key,
            short(x),
            x.role + (x.status === "locked" ? ", locked" : ""),
          ]),
          t.pick,
          "Who is signing in",
        )}<p class="text-muted">Not listed? Ask your manager or Head Office.</p>`,
      });
    }
    if (u.status === "locked") {
      return stepScreen(t, c, {
        title: short(u),
        content: stateMsg(
          "lock",
          "This account is locked after 5 failed sign-ins.",
          u.role === "Head Office"
            ? "Ask another Head Office user or the Province's administrator to unlock it."
            : "Ask your manager or Head Office to unlock it.",
        ),
        footer: tb("Back", "ct.pickUser", { v: "" }),
      });
    }
    if (!u.passcode) {
      return stepScreen(t, c, {
        title: short(u),
        content: stateMsg(
          "lock",
          "No passcode yet.",
          "Sign in to the Institution Dashboard first, or ask another Head Office user to issue a temporary passcode on Users.",
        ),
        footer: tb("Back", "ct.pickUser", { v: "" }),
      });
    }
    if (t.newPass) {
      const second = t.newPass.stage === 2;
      return `<div class="hand-over-frame agapay"><div class="hand-over-frame__context"><span>${esc(short(u))}, set your own passcode</span><span class="text-muted">6 digits. Do not use a pattern like 111111 or 123456.</span></div>${pinPad(t.err || (second ? "Enter the same passcode again" : "Choose a 6-digit passcode"), t.buf.length, !!t.err)}<div class="hand-over-frame__actions">${tb("Cancel", "ct.pickUser", { v: "" })}${tb("Save passcode", "ct.signInGo", { kind: "primary", off: t.buf.length < 6 })}</div></div>`;
    }
    return `<div class="hand-over-frame agapay"><div class="hand-over-frame__context"><span>${esc(c.br ? P.branchName(c.br.id) : "")}</span><span class="type-terminal-name">${esc(short(u))}</span><span class="text-muted">${esc(u.role)}. Your passcode is 6 digits.</span></div>${pinPad(t.err || "Enter your passcode", t.buf.length, !!t.err)}<div class="hand-over-frame__actions">${tb("Back", "ct.pickUser", { v: "" })}${tb("Sign in", "ct.signInGo", { kind: "primary", off: t.buf.length < 6 })}</div></div>`;
  }

  function scReady(t, c) {
    const why = blocked(c);
    let content;
    if (why)
      content = stateMsg(
        "ban",
        REFUSAL[3][0],
        "No Card can be read on this Counter Terminal.",
      );
    else if (t.offline)
      content = `<div class="tap-prompt tap-prompt--terminal is-off" role="status">${ic("nfc")}<h3 class="tap-prompt__title">Tap a Card</h3><p class="tap-prompt__body">No connection. No sales can be recorded.</p></div>`;
    else
      content = `<div class="tap-prompt tap-prompt--terminal" role="status"><span class="icon icon--nfc tap-prompt__icon"></span><h3 class="tap-prompt__title">Tap a Card</h3><p class="tap-prompt__body">Hold the Card on the back of this Counter Terminal.</p></div>`;
    const notice = t.notice ? P.alert(t.notice, "", "info") : "";
    return stepScreen(t, c, {
      home: true,
      content: notice + content,
      actions:
        tb("Transactions", "ct.txList") + tb("Switch user", "ct.switchUser"),
    });
  }
  function scReading(t, c) {
    return stepScreen(t, c, {
      content: `<div class="tap-prompt tap-prompt--terminal" role="status"><span class="icon icon--loader-circle tap-prompt__icon"></span><h3 class="tap-prompt__title">Reading Card. Hold it still.</h3><p class="tap-prompt__body"><span class="loading">${ic("loader-circle")}Checking the Card</span></p></div>`,
    });
  }
  function scIdentity(t, c) {
    const b = P.bene(t.bene);
    const zero = P.available(b) <= 0;
    const status = zero
      ? termBadge("destructive", "No Credits available.")
      : termBadge("success", "Card can be used");
    const content =
      (t.notice ? P.alert(t.notice, "", "info") : "") +
      identity(b, status) +
      P.balanceBoxes(b, true);
    const slipLine = t.paperOut
      ? '<p class="text-destructive">Printer has no paper. Load paper, then press Print balance slip.</p>'
      : "";
    if (zero)
      return stepScreen(t, c, {
        title: "Check the photo",
        content: content + slipLine,
        actions: tb("Print balance slip", "ct.balanceSlip"),
        footer: tb("Done", "ct.done", { kind: "primary" }),
      });
    return stepScreen(t, c, {
      title: "Check the photo",
      content: content + slipLine,
      actions:
        tb("Print balance slip", "ct.balanceSlip") + tb("Done", "ct.done"),
      footer: offBtn(
        "Start sale",
        "ct.startSale",
        t.offline ? "No connection. Wait for it to return." : "",
        { kind: "primary" },
      ),
    });
  }
  const kick = (t) => (t.sale ? `Sale number ${t.sale.no}` : "");
  function scLines(t, c) {
    const s = t.sale,
      tt = totals(t),
      ph = isPharmacy(c);
    const rows = s.lines
      .map(
        ([n, q, p], i) =>
          `<button class="line-entry__row" type="button" data-a="ct.editLine" data-v="${i}"><span class="line-entry__name">${esc(n)}${ph ? `<span class="line-entry__detail">${q} × ₱${fmt(p)}</span>` : ""}</span><span class="line-entry__amount">₱${fmt(q * p)}</span></button>`,
      )
      .join("");
    return stepScreen(t, c, {
      kicker: kick(t),
      title: "Sale lines",
      content: `<div class="line-entry">${rows}<button class="line-entry__row line-entry__row--add" type="button" data-a="ct.addLine">${ic("plus")}${ph ? "Add item" : "Add service line"}</button><div class="line-entry__row line-entry__row--total"><span class="line-entry__name">Total</span><span class="line-entry__amount">₱${fmt(tt.total)}</span></div></div>${s.lines.length ? "" : `<p class="text-muted">${ph ? "Add each medicine on the prescription." : "Add each part of the bill under its service category."}</p>`}`,
      actions: tb("Cancel sale", "ct.cancelSale"),
      footer: offBtn(
        "Continue",
        "ct.linesNext",
        !s.lines.length
          ? "Add at least one line."
          : t.offline
            ? "No connection. Wait for it to return."
            : "",
        { kind: "primary" },
      ),
    });
  }
  function scLine(t, c) {
    const e = t.sale.edit,
      ph = isPharmacy(c),
      base = `${bp(t)}.sale.edit`;
    let content, ok;
    if (ph) {
      const q = String(e.name || "")
        .trim()
        .toLowerCase();
      const typed = Array.from(
        new Set(
          P.db.tx
            .filter((x) => x.branch === c.br.id)
            .flatMap((x) => x.lines.map((l) => l[0])),
        ),
      );
      const pool = Array.from(new Set(typed.concat(P.ITEMS.map((i) => i[0]))));
      const sugg = q
        ? pool.some((n) => n.toLowerCase() === q)
          ? []
          : pool.filter((n) => n.toLowerCase().includes(q)).slice(0, 5)
        : pool.slice(0, 4);
      const sl = sugg.length
        ? `<div class="suggestion-list suggestion-list--terminal" role="listbox" aria-label="${sugg.length} suggestions">${sugg.map((n) => `<button class="suggestion-list__row" type="button" role="option" data-a="ct.pickItem" data-v="${esc(n)}">${esc(n)}</button>`).join("")}</div>`
        : "";
      ok =
        String(e.name || "").trim() && P.num(e.qty) > 0 && P.num(e.price) > 0;
      content = `${tfield("Item name", base + ".name")}${sl}<div class="grid2" style="grid-template-columns:1fr 1fr">${tfield("Quantity", base + ".qty", { mode: "numeric" })}${tfield("Unit price (₱)", base + ".price", { mode: "decimal" })}</div><p class="type-terminal-body amount-line">Line amount: ₱${fmt(P.num(e.qty) * P.num(e.price))}</p>`;
    } else {
      ok = e.name && P.num(e.price) > 0;
      content = `<div class="reason-field reason-field--terminal" role="group" aria-label="Service category"><span class="reason-field__label">Service category</span>${choice(
        "ct.pickCategory",
        P.SERVICE_CATEGORIES.map((s) => [s, s]),
        e.name,
        "Service category",
      )}</div>${tfield("Amount (₱)", base + ".price", { mode: "decimal" })}`;
    }
    return stepScreen(t, c, {
      kicker: kick(t),
      title: e.i == null ? "Add line" : "Edit line",
      content,
      actions:
        e.i == null
          ? tb("Back", "ct.lineBack")
          : tb("Remove line", "ct.removeLine", { kind: "destructive" }) +
            tb("Back", "ct.lineBack"),
      footer: offBtn(
        "Save line",
        "ct.saveLine",
        ok
          ? ""
          : ph
            ? "Enter the item, a quantity, and a unit price."
            : "Pick a service category and enter an amount.",
        { kind: "primary" },
      ),
    });
  }
  function scRx(t, c) {
    const rx = t.sale.rx,
      base = `${bp(t)}.sale.rx`;
    const q = String(rx.name || "")
      .trim()
      .toLowerCase();
    const names = Array.from(
      new Set(
        P.db.tx
          .filter((x) => x.branch === c.br.id && x.rx && x.rx.name)
          .map((x) => x.rx.name),
      ),
    );
    const sugg =
      q && !names.some((n) => n.toLowerCase() === q)
        ? names.filter((n) => n.toLowerCase().includes(q))
        : [];
    const sl = sugg.length
      ? `<div class="suggestion-list suggestion-list--terminal" role="listbox" aria-label="${sugg.length} suggestions">${sugg.map((n) => `<button class="suggestion-list__row" type="button" role="option" data-a="ct.pickRx" data-v="${esc(n)}">${esc(n)}</button>`).join("")}</div>`
      : "";
    const ok =
      String(rx.name || "").trim() &&
      String(rx.license || "").trim() &&
      rx.day &&
      rx.month &&
      rx.year;
    const date = `<div class="field field--terminal" role="group" aria-label="Prescription date"><span class="field__label">Prescription date (day, month, year)</span><div class="date-field date-field--terminal"><label class="date-field__part">Day${P.input(base + ".day", { terminal: true, mode: "numeric" })}</label><label class="date-field__part">Month${P.input(base + ".month", { terminal: true, mode: "numeric" })}</label><label class="date-field__part">Year${P.input(base + ".year", { terminal: true, mode: "numeric" })}</label>${tb("Today", "ct.rxToday")}</div></div>`;
    return stepScreen(t, c, {
      kicker: kick(t),
      title: "Prescription reference",
      content: `${tfield("Prescriber name", base + ".name")}${sl}${tfield("Prescriber license number", base + ".license", { mode: "numeric" })}${date}`,
      actions:
        tb("Back", "ct.step", { v: "lines" }) +
        tb("Cancel sale", "ct.cancelSale"),
      footer: offBtn(
        "Continue",
        "ct.rxNext",
        ok ? "" : "Enter the prescriber name, license number, and date.",
        { kind: "primary" },
      ),
    });
  }
  function discountProblem(t) {
    const s = t.sale,
      tt = totals(t);
    if (s.noDisc) {
      if (!s.noDiscReason) return "Pick the reason no discount applies.";
      if (
        s.noDiscReason === "Other" &&
        String(s.noDiscOther || "").trim().length < 10
      )
        return "Type the reason, at least 10 characters.";
      return "";
    }
    if (String(s.discount).trim() === "")
      return "Enter the discount amount given.";
    if (P.num(s.discount) > tt.total)
      return "The discount cannot be more than the total.";
    return "";
  }
  function scDiscount(t, c) {
    const s = t.sale,
      b = P.bene(t.bene),
      tt = totals(t),
      base = bp(t) + ".sale";
    const label =
      b.category === "PWD" ? "PWD discount" : "Senior citizen discount";
    let body = `<p class="type-terminal-body">${esc(b.name)} is a ${esc(b.category)}. Total: ₱${fmt(tt.total)}. The usual discount is 20%: ₱${fmt(tt.total * 0.2)}.</p>${choice(
      "ct.discMode",
      [
        ["given", "Discount given"],
        ["none", "No discount"],
      ],
      s.noDisc ? "none" : "given",
      "Discount",
    )}`;
    if (!s.noDisc)
      body += tfield("Discount amount given (₱)", base + ".discount", {
        mode: "decimal",
      });
    else {
      body += `<div class="reason-field reason-field--terminal" role="group" aria-label="Reason no discount applies"><span class="reason-field__label">Reason no discount applies (required)</span>${choice(
        "ct.noDiscReason",
        P.db.reasons.noDiscount.map((r) => [r, r]),
        s.noDiscReason,
        "Reason no discount applies",
      )}</div>`;
      if (s.noDiscReason === "Other")
        body += tfield("Type the reason", base + ".noDiscOther");
    }
    return stepScreen(t, c, {
      kicker: kick(t),
      title: label,
      content: body,
      actions:
        tb("Back", "ct.step", { v: isPharmacy(c) ? "rx" : "lines" }) +
        tb("Cancel sale", "ct.cancelSale"),
      footer: offBtn("Continue", "ct.toSummary", discountProblem(t), {
        kind: "primary",
      }),
    });
  }
  function scSummary(t, c) {
    const tt = totals(t),
      b = P.bene(t.bene);
    const row = (l, v, deduct) =>
      `<div class="sale-summary__row${deduct ? " sale-summary__row--deduct" : ""}"><span>${l}</span><span class="sale-summary__amount">${v}</span></div>`;
    const note =
      tt.cash > 0
        ? `<p class="sale-summary__note">Credits cover part of this sale. Cash to collect: ₱${fmt(tt.cash)}.</p>`
        : "";
    const back = needsDiscount(b) ? "discount" : isPharmacy(c) ? "rx" : "lines";
    return stepScreen(t, c, {
      kicker: kick(t),
      title: "Sale summary",
      content: `<div class="sale-summary">${row("Total", "₱" + fmt(tt.total))}${row("Discount", "₱" + fmt(tt.discount))}${row("Credits to deduct", fmt(tt.credits), true)}${row("Cash to collect", "₱" + fmt(tt.cash))}${row("Available Balance after the sale", fmt(tt.after) + " Credits")}${row("Current Balance", fmt(tt.current) + " Credits")}</div>${note}`,
      actions:
        tb("Back", "ct.step", { v: back }) + tb("Cancel sale", "ct.cancelSale"),
      footer: offBtn(
        "Continue",
        "ct.step",
        t.offline
          ? "No connection. Wait for it to return."
          : tt.credits <= 0
            ? "No Credits available."
            : "",
        { kind: "primary", v: "presenter" },
      ),
    });
  }
  function scPresenter(t, c) {
    const b = P.bene(t.bene),
      tt = totals(t),
      ps = people(b);
    const sel = ps.find((p) => p.k === t.sale.presenter) || ps[0];

      actions:
        tb("Photo does not match", "ct.photoNoMatch") +

  }
  const triesText = (n) => (n === 1 ? "1 try left" : `${n} tries left`);
  function scPin(t, c) {
    const tt = totals(t),
      b = P.bene(t.bene);
    const prompt = b.pinTries < 5 ? triesText(b.pinTries) : "Enter your PIN";
    return `<div class="hand-over-frame agapay"><div class="hand-over-frame__context"><span>${esc(P.branchName(c.br.id))}</span><span>Credits to deduct</span><span class="hand-over-frame__amount">${fmt(tt.credits)}</span>${tt.cash > 0 ? `<span>Cash to pay: ₱${fmt(tt.cash)}</span>` : ""}</div>${pinPad(prompt, t.buf.length, b.pinTries < 5)}<div class="hand-over-frame__actions">${tb("Cancel", "ct.pinCancel")}${tb("Confirm", "ct.pinConfirm", { kind: "primary", off: t.buf.length < 6 })}</div></div>`;
  }
  function scWrongPin(t) {
    const b = P.bene(t.bene),
      n = b.pinTries;
    const one = n === 1;
    return `<div class="hand-over-frame agapay"><span class="hand-over-frame__wordmark">Agapay</span><div class="hand-over-frame__message"><h3 class="hand-over-frame__prompt">That PIN is not right.</h3><p>${one ? "1 try left. One more wrong PIN locks the Card." : `${n} tries left.`}</p></div><div class="hand-over-frame__actions">${tb("Try again", "ct.step", { v: "pin", kind: "primary" })}${one ? tb("Cancel", "ct.pinCancel") : ""}</div></div>`;
  }
  function scLocked() {
    return `<div class="hand-over-frame agapay"><span class="hand-over-frame__wordmark">Agapay</span><div class="hand-over-frame__message"><h3 class="hand-over-frame__prompt">The Card is now locked.</h3><p>No Credits were deducted. Visit the Province's Agapay office to set a new PIN. Please give the device back.</p></div><div class="hand-over-frame__actions">${tb("Done", "ct.lockedDone", { kind: "primary" })}</div></div>`;
  }
  function scConfirming() {
    return `<div class="hand-over-frame agapay"><span class="hand-over-frame__wordmark">Agapay</span><div class="hand-over-frame__message"><h3 class="hand-over-frame__prompt"><span class="loading">${ic("loader-circle")}Confirming. Please wait.</span></h3></div></div>`;
  }
  function scComplete(t, c) {
    const tx = P.db.tx.find((x) => x.no === t.lastTx && x.branch === c.br.id);
    if (!tx) {
      go(t, "ready");
      return scReady(t, c);
    }
    const b = P.bene(tx.bene);
    const note = t.receiptPending
      ? '<span class="text-destructive">Receipt not printed. Load paper, then press Print Receipt.</span>'
      : "Receipt printed.";
    return stepScreen(t, c, {
      kicker: `Sale number ${tx.no}`,
      content:
        outcome(
          "success",
          "check",
          "Sale complete",
          `${fmt(tx.credits)} Credits deducted. Cash to collect: ₱${fmt(tx.cash)}.`,
          [note],
        ) + P.balanceBoxes(b, true),
      footer:
        (t.receiptPending ? tb("Print Receipt", "ct.printReceipt") : "") +
        tb("Done", "ct.done", { kind: "primary" }),
    });
  }
  function scRefusal(t, c) {
    const [title, msg] = REFUSAL[t.refusal] || REFUSAL[2];
    const notes = ["No Credits were deducted."].concat(
      t.refusal === 1 ? [] : [esc(helpLine())],
    );
    return stepScreen(t, c, {
      content: outcome("refusal", "x", title, msg, notes),
      footer: tb("Done", "ct.done", { kind: "primary" }),
    });
  }
  function scChecking(t, c) {
    return stepScreen(t, c, {
      content: outcome(
        "unresolved",
        "circle-help",
        `Checking sale ${t.checking.sale.no}`,
        "Do not enter this sale again. The result will show here.",
        ["No new sale can start until this is checked."],
      ),
    });
  }
  function scNotCompleted(t, c) {
    return stepScreen(t, c, {
      content: outcome(
        "refusal",
        "x",
        `Sale ${t.notDone.sale.no} was not completed.`,
        "No Credits were deducted.",
      ),
      actions: tb("Done", "ct.done"),
      footer: tb("Enter sale again", "ct.enterAgain", { kind: "primary" }),
    });
  }
  function txListFor(t, c) {
    const u = user(t);
    return P.db.tx
      .filter(
        (x) =>
          x.branch === c.br.id &&
          isToday(x) &&
          (canAuthorize(u) ||
            x.staffKey === u.key ||
            (!x.staffKey && x.staff === short(u))),
