  <body>
    <div class="agapay" id="app"></div>
    <script>
/* Agapay clickable prototype: core.
   Shared state, sample data, helpers, navigation, shells, panels, dialogs, audit log, journeys guide.
   Screen modules (admin-*.js, institution.js, terminal.js) register screens, panels, and actions on window.P.
   The spines (DESIGN.md, EXPERIENCE.md) are the contract. All look comes from mock-base.css. */
(() => {
  "use strict";
  const P = (window.P = {});

  /* ---------- helpers ---------- */
  const esc = (s) =>
    String(s ?? "").replace(
      /[&<>"']/g,
      (c) =>
        ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;",
        })[c],
    );
  const fmt = (n) =>
    Number(n || 0).toLocaleString("en-US", {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2,
    });
  const peso = (n) => "₱" + fmt(n);
  const num = (v) => {
    const n = parseFloat(String(v ?? "").replace(/,/g, ""));

  const int = (n) => Number(n || 0).toLocaleString("en-US");
  const ic = (n) => `<span class="icon icon--${n}"></span>`;
  const badge = (role, text) =>
    `<span class="status-badge status-badge--${role}"><span class="visually-hidden">Status: </span>${esc(text)}</span>`;
  /* Status words to their colour role (EXPERIENCE.md State Patterns, Status roles) */
  const ROLE_OF = {
    active: "success",

    "partly paid": "warning",
    "due soon": "warning",

    locked: "warning",
    new: "warning",
    "awaiting PIN change": "warning",
    "pre-enrolled": "info",
    closed: "muted",
    draft: "muted",
    retired: "muted",
    unassigned: "muted",

  const status = (text, role) => badge(role || ROLE_OF[text] || "muted", text);

  function btn(label, a, o = {}) {
    const kind = o.kind || "secondary";

      "button",
      "button--" + kind,
      o.terminal ? "button--terminal" : "",
      o.off ? "is-unavailable" : "",

  const bindId = (b) => "in-" + b.replace(/[^a-zA-Z0-9]+/g, "-");

    `<input class="input${o.terminal ? " input--terminal" : ""}${o.err ? " is-error" : ""}" id="${bindId(bind)}" data-bind="${bind}" type="${o.type || "text"}" value="${esc(o.value ?? get(bind) ?? "")}"${o.mode ? ` inputmode="${o.mode}"` : ""}${o.placeholder ? ` placeholder="${esc(o.placeholder)}"` : ""}${o.auto ? ` autocomplete="${o.auto}"` : ' autocomplete="off"'}>`;

    `<textarea class="input" rows="${o.rows || 2}" id="${bindId(bind)}" data-bind="${bind}">${esc(get(bind) ?? "")}</textarea>`;

    const val = get(bind);
    return `<span class="select"><select class="input" id="${bindId(bind)}" data-bind="${bind}">${opts

        const [v, l] = Array.isArray(o) ? o : [o, o];

      })
      .join("")}</select></span>`;
  };
  const checkbox = (bind, label) =>
    `<label class="checkbox"><input type="checkbox" id="${bindId(bind)}" data-bind="${bind}"${get(bind) ? " checked" : ""}>${label}</label>`;
  const radios = (bind, opts) =>
    opts
      .map(
        ([v, l]) =>
          `<label class="radio"><input type="radio" name="${bindId(bind)}" data-bind="${bind}" value="${esc(v)}"${String(get(bind)) === String(v) ? " checked" : ""}>${esc(l)}</label>`,
      )
      .join("");
  /* Reason field: required comment with count. ok = at least `min` characters */
  const reasonField = (
    bind,
    label = "Reason (required)",
    min = 10,
    showErr,

    const v = get(bind) || "";

    return `<div class="reason-field" role="group" aria-label="${esc(label)}"><span class="reason-field__label">${esc(label)}</span><textarea class="input${err ? " is-error" : ""}" rows="2" id="${bindId(bind)}" data-bind="${bind}"${err ? ' aria-invalid="true"' : ""}>${esc(v)}</textarea><div class="reason-field__footer">${err ? `<span class="reason-field__error">Give a reason of at least ${min} characters.</span>` : ""}<span class="reason-field__count">${v.length} of 500 characters</span></div></div>`;
  };
  const photo = (label, extra = "") =>
    `<span class="photo ${extra}" role="img" aria-label="Photo of ${esc(label)}"></span>`;
  const masked = (pid) => "**** **** " + String(pid).slice(-4);

    r ? `<span class="button-reason">${esc(r)}</span>` : "";

  /* Layout pieces (dashboard) */
  const crumbs = (...parts) =>

  const head = (title, sub, actions = "") =>

  const panel = (title, body, o = {}) =>

    mk(

          .map(

          )
          .join("");

      body =
        p.app !== "ct"
          ? `<div class="p-box"><p class="p-label">${esc(p.label)} can open</p><ul class="p-list">${nav.map(([g, items]) => items.map(([sid, l]) => `<li><a href="#" data-a="go" data-v="${sid}">${esc(sid)} ${esc(l)}</a></li>`).join("")).join("")}</ul></div>`
          : "";
      side = `<div class="p-box"><p class="p-label">Explore by role</p><p class="p-story">Sign in as anyone and open any screen. Changes carry across every role and device.</p></div>`;
    }
    const extra = P.guideExtra ? P.guideExtra() : "";
    /* Left column: where you are and what to do next. Right column: context, hints, and simulate controls. */
    return `<aside class="p-guide" aria-label="Walkthrough guide">${modeTabs}${switcher}${body}</aside><aside class="p-guide p-guide--side" aria-label="Journey details">${side}${extra}</aside>`;
  }

  /* ---------- change highlight ----------
     After a click, every area whose content changed flashes for 1 second, so the viewer sees what the step did.
     Areas are compared by a stable key (their heading or label) and their text. Typing does not flash. */
  const AREAS = [
    [".p-stage .app-shell__content", ":scope > *"],
    [
      ".p-stage .mock-handheld__screen",
      ".step-screen__content > *, .step-screen__footer, .title-bar, .hand-over-frame > *",
    ],
    [
      ".p-stage",
      ":scope > .p-slip, :scope > div > .p-slip, .side-panel, .dialog, .overlay-lock, .toast, .system-banner, .sidebar__item",
    ],
    [".p-guide", ".p-step"],
  ];
  const PARTS =
    "tbody tr, .detail-list__item, .balance-figures__box, .stat-tile, .identity-panel, .alert, .decision-panel, .line-entry__row, .sale-summary__row, .printed-slip__block, .status-badge, .field";
  /* Snapshot of the page taken just before an action runs; the next render compares against it */
  let pendingBefore = null;
  const armFlash = () => {
    if (!pendingBefore && app()) pendingBefore = snapshot(app());
  };
  P.flash = armFlash;
  function areaKey(el, seen) {
    const head =
      el.getAttribute("aria-label") ||
      (el.querySelector("h1, h2, h3, h4, .panel__title, .p-step > span") || {})
        .textContent ||
      el.className.split(" ")[0] ||
      el.tagName;
    const k = head.trim().slice(0, 60);
    seen[k] = (seen[k] || 0) + 1;
    return k + "#" + seen[k];
  }
  const cls = (el) => el.className.replace(/\s*p-flash/g, "");
  function snapshot(root) {
    const snap = { $who: S.persona, $journey: S.journey };
    AREAS.forEach(([cSel, iSel], gi) => {
      root.querySelectorAll(cSel).forEach((c, ci) => {
        const seen = {};
        const group = (snap[gi + ":" + ci] = {
          container: c,
          key: c.dataset.scroll || "",
          items: {},
        });
        c.querySelectorAll(iSel).forEach((el) => {
          const parts = [...el.querySelectorAll(PARTS)].map(
            (x) => x.textContent + "|" + cls(x),
          );
          group.items[areaKey(el, seen)] = {
            el,
            sig: el.textContent + "|" + cls(el),
            parts,
          };
        });
      });
    });
    return snap;
  }
  function flashEl(el) {
    el.classList.remove("p-flash");
    void el.offsetWidth;
    el.classList.add("p-flash");
    setTimeout(() => el.classList.remove("p-flash"), 1000);
  }
  function highlightChanges(before, after) {
    const newPerson = before.$who !== after.$who,
      newJourney = before.$journey !== after.$journey;
    Object.keys(after).forEach((g) => {
      if (g[0] === "$") return;
      const a = after[g],
        b = before[g];
      /* A different person or journey redraws the sidebar or step list; that is not a change to point at */
      const keys = Object.keys(a.items).filter(
        (k) =>
          !(newPerson && a.items[k].el.classList.contains("sidebar__item")) &&
          !(newJourney && a.items[k].el.classList.contains("p-step")),
      );
      if (!keys.length) return;
      if (!b || (a.key && a.key !== b.key)) {
        if (g.startsWith("3:") || g.startsWith("2:"))
          return; /* guide and stage groups: flash only items */
        flashEl(a.container);
        return;
      }
      const changed = keys.filter(
        (k) => !b.items[k] || b.items[k].sig !== a.items[k].sig,
      );
      if (!changed.length) return;
      if (
        changed.length > Math.max(3, keys.length * 0.6) &&
        !g.startsWith("3:") &&
        !g.startsWith("2:")
      ) {
        flashEl(a.container);
        return;
      }
      changed.forEach((k) => {
        const now = a.items[k],
          was = b.items[k];
        if (was && now.parts.length && now.parts.length === was.parts.length) {
          const els = now.el.querySelectorAll(PARTS);
          const diff = now.parts
            .map((sig, i) => (sig !== was.parts[i] ? els[i] : null))
            .filter(Boolean);
          const leaves = diff.filter(
            (x) => !diff.some((y) => y !== x && x.contains(y)),
          );
          if (leaves.length && leaves.length <= 4) {
            leaves.forEach(flashEl);
            return;
          }
        }
        flashEl(now.el);
      });
    });
  }

  /* ---------- render ---------- */
  const app = () => document.getElementById("app");
  const scrolls = {};
  function render() {
    const root = app();
    const before = pendingBefore;
    pendingBefore = null;
    const ae = document.activeElement;
    const focusId = ae && ae.id && ae.id.startsWith("in-") ? ae.id : null;
    const sel =
      focusId &&
      ae.type !== "checkbox" &&
      ae.type !== "radio" &&
      "selectionStart" in ae
        ? [ae.selectionStart, ae.selectionEnd]
        : null;
    root.querySelectorAll("[data-scroll]").forEach((el) => {
      scrolls[el.dataset.scroll] = el.scrollTop;
    });
    const p = persona();
    (P.beforeRender || []).forEach((f) => f());
    const stage = p.app === "ct" ? ctShell(p) : dashShell(p);
    root.innerHTML = `<header class="p-top"><div class="p-brand"><b>Agapay prototype</b><span>Every workflow across the Admin Dashboard, the Institution Dashboard, and the Counter Terminal. Sample data only. Nothing is saved.</span></div><button class="p-reset" type="button" data-a="reset">Start over</button></header><div class="p-main">${guide()}<div class="p-stage">${stage}</div></div>`;
    root.querySelectorAll("[data-scroll]").forEach((el) => {
      if (scrolls[el.dataset.scroll]) el.scrollTop = scrolls[el.dataset.scroll];
    });
    if (before) highlightChanges(before, snapshot(root));
    if (focusId) {
      const el = document.getElementById(focusId);
      if (el) {
        el.focus();
        if (sel && el.setSelectionRange)
          try {
            el.setSelectionRange(sel[0], sel[1]);
          } catch (e) {
            /* not a text input */
          }
      }
    }
  }
  P.render = render;

  /* ---------- core actions ---------- */
  Object.assign(P.actions, {
    go: (v, el) => {
      const pr = el && el.dataset.p ? JSON.parse(el.dataset.p) : {};
      P.go(v, pr);
    },
    tab: (v, el) => {
      S.ui.tab[
        el.closest("[data-tabkey]")
          ? el.closest("[data-tabkey]").dataset.tabkey
          : P.cur()
      ] = v;
    },
    closePanel: () => P.closePanel(),
    closeDialog: () => {
      S.ui.dialog = null;
    },
    dialogOk: () => {
      const d = S.ui.dialog;
      if (!d || (d.off && d.off())) return;
      S.ui.dialog = null;
      if (d.action) {
        const fn =
          typeof d.action === "function" ? d.action : P.actions[d.action];
        fn && fn(d.v);
      }
    },
    closeToast: () => {
      S.ui.toast = null;
    },
    reset: () => {
      const j = S.journey,
        m = S.mode;
      P.reset();
      S.mode = m;
      S.journey = j;
    },
    mode: (v) => {
      S.mode = v;
    },
    journey: (v) => {
      S.journey = v || null;
      S.mode = "journeys";
      const j = P.journeys.find((x) => x.id === v);
      if (j && j.start) j.start();
    },
    jstep: (v) => {
      const j = P.journeys.find((x) => x.id === S.journey);
      const s = j && j.steps[+v];
      if (!s) return;
      if (s.go) s.go();
      else if (s.persona) P.switchTo(s.persona, s.screen, s.params);
    },
    persona: (v) => P.switchTo(v),
    signOut: () => {
      const p = persona();
      P.confirm({
        title: "Sign out?",
        body: `<p>${esc(p.label)} is signed out. Pick anyone in “Signed in as” to continue.</p>`,
        ok: "Sign out",
        action: () => {
          S.signedIn[p.key] = false;
          P.audit(
            "Signed out",
            p.app === "inst" ? "Institution Dashboard" : "Admin Dashboard",
          );
        },
      });
    },
    na: (v) => P.notBuilt(v || "This control"),
  });

  /* ---------- events ---------- */
  function onClick(e) {
    const el = e.target.closest("[data-a]");
    if (!el || el.tagName === "SELECT") return;
    if (el.tagName === "A") e.preventDefault();
    if (el.getAttribute("aria-disabled") === "true") {
      const k = el.dataset.a;
      S.ui.err[k] = true;
      render();
      return;
    }
    const fn = P.actions[el.dataset.a];
    if (!fn) {
      console.warn("No action", el.dataset.a);
      P.notBuilt(el.dataset.a);
      render();
      return;
    }
    armFlash();
    try {
      fn(el.dataset.v, el);
    } catch (err) {
      console.error(err);
      P.toast("Something went wrong", String(err.message));
    }
    render();
  }
  function onInput(e) {
    const el = e.target;
    if (!el.dataset.bind) return;
    if (el.type === "checkbox") set(el.dataset.bind, el.checked);
    else if (el.type === "radio") {
      if (el.checked) set(el.dataset.bind, el.value);
    } else set(el.dataset.bind, el.value);
    if (el.dataset.onchange && P.actions[el.dataset.onchange])
      P.actions[el.dataset.onchange](el.value, el);
    if (el.type === "checkbox" || el.type === "radio") armFlash();
    render();
  }
  function onChange(e) {
    const el = e.target;
    armFlash();
    if (el.dataset.aChange) {
      P.actions[el.dataset.aChange](el.value, el);
      render();
      return;
    }
    if (el.tagName === "SELECT" && el.dataset.bind) {
      set(el.dataset.bind, el.value);
      if (el.dataset.onchange && P.actions[el.dataset.onchange])
        P.actions[el.dataset.onchange](el.value, el);
      render();
    }
  }
  function onKey(e) {
    if (e.key === "Escape" && (S.ui.panel || S.ui.dialog)) {
      S.ui.panel = null;
      S.ui.dialog = null;
      render();
      return;
    }
    if (P.onKey && P.onKey(e)) {
      armFlash();
      render();
      return;
    }
    if (
      e.key === "Enter" &&
      e.target.dataset &&
      e.target.dataset.enter &&
      P.actions[e.target.dataset.enter]
    ) {
      e.preventDefault();
      P.actions[e.target.dataset.enter](e.target.value, e.target);
      render();
    }
  }

  P.start = () => {
    P.reset();
    const root = app();
    root.addEventListener("click", onClick);
    root.addEventListener("input", (e) => {
      if (
        e.target.tagName !== "SELECT" &&
        e.target.type !== "checkbox" &&
        e.target.type !== "radio"
      )
        onInput(e);
    });
    root.addEventListener("change", (e) => {
      if (e.target.type === "checkbox" || e.target.type === "radio") onInput(e);
      else onChange(e);
    });
    root.addEventListener("submit", (e) => e.preventDefault());
    document.addEventListener("keydown", onKey);
    const h = location.hash.slice(1);
    if (h && P.journeys.find((j) => j.id === h)) P.actions.journey(h);
    render();
  };

  Object.assign(P, {
    esc,
    fmt,
    peso,
    num,
    int,
    ic,
    badge,
    status,
    btn,
    field,
    input,
    textarea,
    select,
    checkbox,
    radios,
    reasonField,
    photo,
    masked,
    reasonOff,
    crumbs,
    head,
    table,
    pager,
    detail,
    stateMsg,
    alert,
    tabs,
    tiles,
    link,
    actionLink,
    filterBar,
    barChart,
    TODAY,
    now,
    stamp,
    MUNIS,
    MUNI_COUNTS,
    BRGYS,
    ITEMS,
    SERVICE_CATEGORIES,
    get,
    set,
    persona,
    hasRole,
    who,
    navFor,
    ROLE_OF,
  });
  Object.defineProperty(P, "S", {
    get: () => S,
    set: (v) => {
      S = v;
    },
    configurable: true,
  });
  Object.defineProperty(P, "db", { get: () => S.db, configurable: true });
})();

</script>
    <script>
/* Agapay clickable prototype: Admin Dashboard, Beneficiaries and Cards, plus dashboard sign-in.
   Screens: AD-00, ID-00, AD-01 to AD-14. Panels: AD-08, AD-11, ben.rep, ben.edit, ben.print, ben.cardPreview, ben.batch.
   Full screen: AD-12 PIN hand-over (S.ui.fullscreen).
   Never caches P.S or P.db: Start over replaces them. */
(() => {
  "use strict";
  const P = window.P;
  const {
    esc,
    fmt,
    peso,
    int,
    ic,
    btn,
    field,
    input,
    select,
    checkbox,
    radios,
    reasonField,
    photo,
    reasonOff,
    crumbs,
    head,
    panel,
    table,
    detail,
    stateMsg,
    alert,
    tabs,
    tiles,
  } = P;

  /* ---------- local helpers ---------- */
  const U = () =>
    P.S.ui.ben ||
    (P.S.ui.ben = {
      issue: {},
      signin: {},
      pin: null,
      failNext: false,
      viewed: null,
      enrollStage: null,
      dupOf: null,
      saveErr: "",
    });
  const F = (path, init) => {
    if (P.get(path) == null)
      P.set(path, typeof init === "function" ? init() : init);
    return P.get(path);
  };
  const ALL_ADMIN = [
    "enrollment officer",
    "card officer",
    "credits officer",
    "approver",
    "finance officer",
    "administrator",
  ];
  const help = () => P.db.settings.helpLine || "{Program help line}";
  const hist = (b, what) =>
    b.history.push({ when: P.stamp(), what, by: P.who() });
  const first = (b) => b.name.split(" ")[0];
  const pidOf = (b) =>
    b.pid
      ? `<b class="tabular">${esc(b.pid)}</b>`
      : '<span class="text-muted">not given yet</span>';
  const rowName = (b, a, v) =>
    `<th scope="row"><a href="#" data-a="${a}" data-v="${esc(v)}">${esc(b.name)}</a><span class="data-table__row-detail"><span>Program ID number ${pidOf(b)}</span></span></th>`;
  const simBtn = (label, a, v) =>
    `<button class="p-btn sim-tap" type="button" data-a="${a}"${v != null ? ` data-v="${esc(v)}"` : ""}>${ic("nfc")}${esc(label)}</button>`;
  const noAccess = () =>
    stateMsg(
      "lock",
      "You do not have access to this screen.",
      "Open a screen from the sidebar.",
    );
  const allowed = (roles) => P.hasRole(...roles);

  /* Dates: "14 Feb 2027" */
  const MON = [
    "Jan",
    "Feb",
    "Mar",
    "Apr",
    "May",
    "Jun",
    "Jul",
    "Aug",
    "Sep",
    "Oct",
    "Nov",
    "Dec",
  ];
  const parseD = (s) => {
    const m = /^(\d{1,2}) (\w{3}) (\d{4})/.exec(s || "");
    return m ? new Date(+m[3], MON.indexOf(m[2]), +m[1]) : null;
  };
  const fmtD = (d) => `${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}`;
  const today = () => parseD(P.TODAY);
  const nextYear = () => {
    const d = today();
    d.setFullYear(d.getFullYear() + 1);
    return fmtD(d);
  };
  const ageFrom = (birth) => {
    const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(birth || "");
    if (!m) return 0;
    const t = today();
    let a = t.getFullYear() - +m[3];
    if (
      +m[2] - 1 > t.getMonth() ||
      (+m[2] - 1 === t.getMonth() && +m[1] > t.getDate())
    )
      a--;
    return a;
  };
  const recheckState = (b) => {
    if (!b.pid || b.status === "closed" || b.status === "pre-enrolled")
      return null;
    if (b.status === "suspended" && /Re-check overdue/.test(b.statusReason))
      return "overdue";
    const d = parseD(b.nextRecheck);
    if (!d) return null;
    const days = (d - today()) / 86400000;
    return days < 0 ? "overdue" : days <= 30 ? "due soon" : null;
  };

  /* Cards */
  const CARD_LABEL = {
    queued: "queued",
    printing: "printing",
    printed: "encoded, PIN not set",
    issued: "issued",
    blocked: "Blocked Card",
    locked: "Locked Card",
    damaged: "damaged",
    "awaiting PIN change": "awaiting PIN change",
  };
  const CARD_ROLE = {
    queued: "muted",
    printing: "info",
    printed: "info",
    issued: "success",
    blocked: "destructive",
    locked: "warning",
    damaged: "destructive",
    "awaiting PIN change": "warning",
  };
  const cardBadge = (c) =>
    c
      ? P.status(CARD_LABEL[c.status] || c.status, CARD_ROLE[c.status])
      : P.status("no Card", "muted");
  const beneBadge = (b) =>
    b.status === "pre-enrolled"
      ? P.status("Pre-enrolled", "info")
      : P.status(b.status);
  const cur = (b) => P.card(b);
  const newCard = (b, extra = {}) => {
    const c = Object.assign(
      {
        no: `AGP-${(b.pid || "0000").slice(-4)}-${b.cards.length + 1}`,
        status: "queued",
        queued: P.stamp(),
        issued: "",
        by: "",
      },
      extra,
    );
    b.cards.push(c);
    return c;
  };
  const replacements = (b) =>
    b.cards.filter((c) => c.replacement && !c.reprint);
  const isJourney = (b) => b && b.key === P.S.journeyBene;
  const markCard = (b, step) => {
    const c = cur(b);
    P.mark("card." + step);
    if (c && c.replacement) P.mark("uj6." + step);
    else if (isJourney(b)) P.mark("uj1." + step);
  };
  const stock = () => P.db.cardStock;
  const stockLeft = () => stock().reduce((a, s) => a + s.count - s.used, 0);
  const useStock = () => {
    const s = stock().find((x) => x.count > x.used);
    if (s) s.used++;
  };

  /* Photo capture (simulated): live camera only, with a head-gesture liveness check (FR-53) */
  const GESTURES = [
    "Turn your head to the left.",
    "Nod your head.",
    "Tilt your head to one side.",
  ];
  const gestureFor = (path) =>
    GESTURES[[...path].reduce((n, ch) => n + ch.charCodeAt(0), 0) % 3];
  const capState = () => U().cap || (U().cap = {});
  const photoCap = (path, name, err) => {
    const st = capState()[path];
    if (P.get(path))
      return `<div class="photo-capture"><div class="photo-capture__frame">${photo(name || "the Beneficiary")}</div><div class="photo-capture__actions">${P.status("live check passed", "success")}${btn("Retake", "ben.unset", { v: path, icon: "rotate-ccw" })}</div></div>`;
    if (st === "gesture")
      return `<div class="photo-capture"><div class="photo-capture__frame"><span class="photo-capture__guide"></span></div><div class="stack"><p><b>${esc(gestureFor(path))}</b></p><p class="text-muted">The camera has a straight-on frame. The movement shows it is a live person, not a printed photo or a screen.</p><div class="row">${simBtn("Simulate: the person makes the movement", "ben.capLive", path)}${simBtn("Simulate: a printed photo is held up", "ben.capFake", path)}</div><div class="row">${btn("Cancel", "ben.capCancel", { v: path })}</div></div></div>`;
    return `<div class="photo-capture"><div class="photo-capture__frame"><span class="photo-capture__guide"></span></div><div class="photo-capture__actions">${btn("Start camera", "ben.capStart", { v: path, icon: "camera", kind: "primary" })}</div></div>${st === "fail" ? alert("No live face found", "Look straight at the camera, then make the movement shown. A printed photo or a screen cannot be used.", "circle-alert", true) : ""}<p class="text-muted">Live camera only. The face is checked against every enrolled face.</p>${err ? '<span class="field__error">Take a live photo.</span>' : ""}`;
  };

  /* Face check against a person's own face record (FR-53). Mismatch or outage needs an approver. */
  const fcState = (k) => {
    const all = U().fc || (U().fc = {});
    return all[k] || (all[k] = { st: "idle" });
  };
  const fcPassed = (k) => ["match", "authorized"].includes(fcState(k).st);
  const fcWhy = (k) =>
    fcPassed(k) ? "" : "Pass the face check, or have an approver authorize.";
  function faceCheck(k, name, photos) {
    const s = fcState(k),
      fp = "form.fc." + k;
    F(fp, {
      approver: "Ramon, approver",
      pw: "",
      code: "",
      id: false,
      why: "",
    });
    const fig = (img, cap) =>
      `<figure class="stack" style="margin:0;gap:4px;width:120px;flex:none"><div class="photo-capture__frame" style="width:120px;max-width:120px">${img}</div><figcaption class="text-muted" style="font-size:13px">${cap}</figcaption></figure>`;
    const live =
      s.st === "match" || s.st === "nomatch" || s.st === "authorized"
        ? photo(name + ", live")
        : '<span class="photo-capture__guide"></span>';
    const row = `<div class="row" style="align-items:flex-start;gap:12px;flex-wrap:wrap">${photos.map(([cap]) => fig(photo(name), esc(cap))).join("")}${fig(live, "Live capture")}</div>`;
    let body = "";
    if (s.st === "idle")
      body = `<div class="row">${btn("Start face check", "ben.fcStart", { v: k, icon: "camera", kind: "primary" })}</div>`;
    else if (s.st === "gesture")
      body = `<p><b>${esc(gestureFor(k))}</b></p><div class="row">${simBtn("Simulate: face matches", "ben.fc", k + "|match")}${simBtn("Simulate: face does not match", "ben.fc", k + "|nomatch")}${simBtn("Simulate: face service is down", "ben.fc", k + "|down")}</div>`;
    else if (s.st === "match")
      body = alert(
        "Face matches.",
        `${esc(name)} matches the face on record.`,
        "circle-check",
      );
    else if (s.st === "authorized")
      body = alert(
        "Authorized by an approver",
        `${esc(s.by)}. Government ID checked. Reason: ${esc(s.why)}. A Flag was raised for review.`,
        "circle-check",
      );
    else {
      const msg =
        s.st === "down"
          ? alert(
              "Face check is not available right now.",
              "An approver must authorize to continue.",
              "circle-alert",
              true,
            )
          : alert(
              "Face does not match.",
              "Faces change with age and illness. Compare the photos, check a government ID, then ask an approver to authorize.",
              "circle-alert",
              true,
            );
      if (s.st !== "auth" && !s.asking)
        body = `${msg}<div class="row">${btn("Ask an approver", "ben.fcAsk", { v: k, kind: "primary" })}${btn("Try again", "ben.fcStart", { v: k })}</div>`;
      else {
        const f = P.get(fp);
        const ok =
          f.pw &&
          /^\d{6}$/.test(String(f.code).replace(/\s/g, "")) &&
          f.id &&
          f.why.trim().length >= 10;
        body = `${msg}<div class="panel"><div class="panel__body stack"><p><b>Approver authorizes</b> on this screen. The approver cannot be you.</p>${field("Approver", select(fp + ".approver", ["Ramon, approver"]))}${field("Approver’s password", input(fp + ".pw", { type: "password" }))}${field("Authenticator code", input(fp + ".code", { mode: "numeric", placeholder: "6 digits" }))}${checkbox(fp + ".id", "I checked a government ID")}${reasonField(fp + ".why", "Reason (required)", 10, false)}<div class="row">${reasonOff(ok ? "" : "Fill every field to authorize.")}${btn("Authorize", "ben.fcAuth", { v: k, kind: "primary", off: !ok })}</div></div></div>`;

    return `<div class="field"><span class="field__label">Face check (required)</span><div class="stack">${row}${body}</div></div>`;

  const faceFlag = (kind, detail, bene) =>
    P.db.flags.unshift({

      detail,
      tx: null,

      branch: null,

  const fileUp = (path, hint, err) => {
    const f = P.get(path);
    return f
      ? `<div class="file-upload"><div class="file-upload__file">${ic("file-text")}<span class="file-upload__name">${esc(f.name)}</span><span class="file-upload__meta">${esc(f.size)}</span>${btn("Remove", "ben.unset", { v: path })}</div></div>`

  };
  const steps = (names, at) =>
    `<div class="step-indicator"><ol class="step-indicator__steps">${names.map((n, i) => `<li><span class="step-indicator__step${i < at ? " is-done" : i === at ? " is-current" : ""}"${i === at ? ' aria-current="step"' : ""}><span class="step-indicator__box">${i < at ? ic("check") : i + 1}</span><span class="step-indicator__name">${esc(n)}</span>${i < at ? '<span class="visually-hidden">completed</span>' : ""}</span></li>`).join("")}</ol><span class="step-indicator__count">Step ${Math.min(at + 1, names.length)} of ${names.length}</span></div>`;
  const idPanel = (b, o = {}) =>
    `<div class="identity-panel"><span class="identity-panel__photo">${photo(b.name)}</span><div class="identity-panel__body"><${o.h || "h2"} class="identity-panel__name">${esc(b.name)}</${o.h || "h2"}><p class="identity-panel__meta">Program ID number ${pidOf(b)}</p><p class="identity-panel__meta">Beneficiary category <b>${esc(b.category)}</b> · Age <b>${b.age}</b></p><p class="identity-panel__meta">${esc(b.brgy)}, ${esc(b.muni)}</p>${o.extra || `<p>${beneBadge(b)}</p>`}</div></div>`;

  /* Card preview from a design (front and back) */
  const DETAILS = [
    ["photo", "Photo"],
    ["name", "Full name"],
    ["pid", "Program ID number"],
    ["category", "Beneficiary category"],
    ["birth", "Date of birth"],
    ["address", "Address"],
    ["issued", "Issue date"],
    ["signature", "Signature panel"],
  ];
  const defaultPlace = () => ({
    photo: { side: "Front", size: 0, bg: "panel" },
    name: { side: "Front", size: 10, bg: "panel" },
    pid: { side: "Front", size: 10, bg: "panel" },
    category: { side: "Front", size: 8, bg: "panel" },
    birth: { side: "Back", size: 7, bg: "panel" },
    address: { side: "Back", size: 7, bg: "panel" },
    issued: { side: "Back", size: 7, bg: "panel" },
    signature: { side: "Back", size: 7, bg: "panel" },
  });
  function cardPreview(b, place) {
    place = place || defaultPlace();
    const val = {
      name: b.name,
      pid: b.pid || "1042 0000 0000",
      category: b.category,

      issued: "Issued: " + P.TODAY,
      signature: "Signature",
    };
    const side = (s) => {
      const ph = place.photo.side === s ? photo(b.name) : "";
      const det = DETAILS.filter(([k]) => k !== "photo" && place[k].side === s)
        .map(
          ([k]) =>
            `<span class="card-preview__detail${k === "pid" ? " tabular" : ""}">${esc(val[k])}</span>`,
        )
        .join("");
      return `<div class="card-preview__item"><span class="card-preview__label">${s}</span><div class="card-preview__side">${ph}<div class="card-preview__details">${s === "Front" ? '<span class="card-preview__detail type-wordmark">Agapay</span>' : ""}${det}${s === "Back" ? `<span class="card-preview__detail">${esc(help())}</span>` : ""}</div></div></div>`;
    };
    return `<div class="card-preview">${side("Front")}${side("Back")}</div>`;
  }

  /* ---------- seed additions (one Card in the print queue, one Locked Card) ---------- */
  P.onReset = (P.onReset || []).concat(() => {
    const db = P.db;
    const mk = (key, name, pid, age, sex, muni, brgy, card, extra = {}) => {

          brgy,

          idType: "Senior Citizen ID",
          idNo: "SC-" + pid.slice(-4) + "-" + ((2026 - age) % 100),
          status: "active",
          statusReason: "",
          reps: [],
          cards: [card],
          pin: "111111",
          pinTries: 5,
          consent: "10 Nov 2026",
          enrolled: "10 Nov 2026",
          nextRecheck: "10 Nov 2027",

            {
              when: "10 Nov 2026, 3:40 PM",
              what: "Enrolled.",
              by: "Jun, enrollment officer",

      db.benes.push(b);
      db.ledger.push({

        status: "posted",
        by: "System",

    };
    mk(
      "b-luz",
      "Luz Santiago",
      "1042 6604 1187",
      70,
      "Female",
      "Santa Rosa",
      "Poblacion",
      {
        no: "AGP-1187-1",
        status: "queued",
        queued: "10 Nov 2026, 3:45 PM",
        issued: "",
        by: "",
      },
      { pin: null },
    );
    mk(
      "b-pedro",
      "Pedro Manalo",
      "1042 4418 2093",
      76,
      "Male",
      "Malinis",
      "Mabini",
      {
        no: "AGP-2093-1",
        status: "locked",
        issued: "14 Feb 2026",
        by: "Tess, card officer",
      },
      {
        pinTries: 0,
        enrolled: "14 Feb 2026",
        consent: "14 Feb 2026",
        nextRecheck: "14 Feb 2027",
        history: [
          {
            when: "14 Feb 2026, 10:30 AM",

            by: "Jun, enrollment officer",
          },
          {
            when: "9 Nov 2026, 4:02 PM",
            what: "Card locked after 5 wrong PINs at Santos Pharmacy, Poblacion Branch.",

  /* ---------- AD-00 / ID-00 Sign in ---------- */
  const userName = (p) =>
    (p.app === "inst"
      ? (P.db.institutionUsers.find((u) => u.key === p.key) || {}).name
      : (
          P.db.provinceUsers
            .concat(P.db.vendorOperators)
            .find((u) => u.key === p.key) || {}
        ).name) || p.name;
  function signIn() {
    const p = P.persona();
    const st =
      U().signin[p.key] ||
      (U().signin[p.key] = { step: "password", fails: 0, err: "" });
    const f = F("form.signin." + p.key, () => ({
      user: userName(p)
        .toLowerCase()
        .replace(/[^a-z]+/g, ".")
        .replace(/^\.|\.$/g, ""),
      pw: "",
      code: "",
    }));
    const surface =
      p.app === "inst" ? "Institution Dashboard" : "Admin Dashboard";
    const bp = "form.signin." + p.key;
    let body;
    if (st.step === "locked") {
      body = stateMsg(
        "lock",
        "This account is locked after 5 failed sign-ins.",
        `Ask ${p.app === "inst" ? "your Head Office" : "the administrator"} to unlock it.`,
        btn("Start over this sign-in", "ben.signinReset"),
      );
    } else if (st.step === "password") {
      const off =
        !f.user.trim() || !f.pw ? "Enter your user name and password." : "";
      body = `<div class="stack">${st.err ? alert(st.err, "", "circle-alert", true) : ""}${field("User name", input(bp + ".user", { auto: "username" }))}${field("Password", input(bp + ".pw", { type: "password", auto: "current-password" }), 'Any password works in this prototype. Type "wrong" to see a failed sign-in.')}<div class="button-row">${btn("Continue", "ben.signinPw", { kind: "primary", off: !!off })}${reasonOff(off)}</div></div>`;
    } else {
      const ok = /^\d{6}$/.test(f.code.replace(/\s/g, ""));
      body = `<div class="stack"><p>Open your authenticator app and enter the 6-digit code for Agapay.</p>${field("6-digit code", `<input class="input" id="in-signin-code" data-bind="${bp}.code" inputmode="numeric" autocomplete="one-time-code" value="${esc(f.code)}">`, "Any 6 digits work in this prototype.")}<div class="button-row">${btn("Sign in", "ben.signinCode", { kind: "primary", off: !ok })}${reasonOff(ok ? "" : "Enter the 6 digits.")}</div><p>${P.actionLink("Use a backup code", "ben.backup")} · ${P.actionLink("Back", "ben.signinReset")}</p></div>`;
    }
    return `<div class="stack" style="max-width:420px;width:100%;margin:40px auto;padding:0 16px"><p class="type-wordmark">Agapay</p><h1 class="screen-title">Sign in</h1><p class="text-muted">${esc(surface)} · ${esc(userName(p))}</p>${panel("", body)}<p class="text-muted">Help: ${esc(help())}</p></div>`;
  }
  P.screen("AD-00", { title: "Sign in", render: signIn });
  P.screen("ID-00", { title: "Sign in", render: signIn });

  /* ---------- AD-01 Beneficiaries ---------- */
  P.screen("AD-01", {
    title: "Beneficiaries",
    render() {
      if (!allowed(ALL_ADMIN)) return noAccess();
      const f = F("form.ben1", { q: "", cat: "", muni: "", st: "" });
      const q = f.q.trim().toLowerCase(),
        qd = q.replace(/\s/g, "");
      const list = P.db.benes.filter(
        (b) =>
          (!q ||
            b.name.toLowerCase().includes(q) ||
            (qd && b.pid.replace(/\s/g, "").includes(qd)) ||
            b.idNo.toLowerCase() === q) &&
          (!f.cat || b.category === f.cat) &&
          (!f.muni || b.muni === f.muni) &&
          (!f.st || b.status === f.st),
      );
      const enrollBtn = P.hasRole("enrollment officer")
        ? btn("Enroll", "ben.enroll", { kind: "primary", icon: "plus" })
        : "";
      const rows = list.map(
        (b) =>
          `<tr>${rowName(b, "ben.open", b.key)}<td>${esc(b.brgy)}, ${esc(b.muni)}</td><td>${esc(b.category)}</td><td>${cardBadge(cur(b))}</td><td>${beneBadge(b)}</td></tr>`,
      );
      const filters = `<div class="filter-bar">${field("Search by name, Program ID number, or government ID number", input("form.ben1.q", { type: "search", placeholder: "Name or number" }))}${field("Beneficiary category", select("form.ben1.cat", [["", "All categories"], ...P.db.settings.categories]))}${field("Municipality", select("form.ben1.muni", [["", "All municipalities"], ...P.MUNIS]))}${field("Status", select("form.ben1.st", [["", "All statuses"], "active", "suspended", "closed", ["pre-enrolled", "Pre-enrolled"]]))}${f.q || f.cat || f.muni || f.st ? `<div class="filter-bar__chips">${btn("Clear all", "ben.clear1", { kind: "link" })}</div>` : ""}</div>`;
      const results = !list.length
        ? panel(
            "",
            stateMsg(
              "search",
              q
                ? `No match for “${f.q.trim()}”.`
                : "No Beneficiaries match these filters.",
              q
                ? "Check the spelling, or enroll this person."
                : "Change or clear the filters.",
              q ? enrollBtn : btn("Clear all", "ben.clear1"),
            ),
          )
        : panel(
            q ? `Results for “${f.q.trim()}”` : "Beneficiaries",
            table(
              "Beneficiaries",
              ["Name", "Address", "Category", "Card", "Status"],
              rows,
            ),
            { raw: true, footer: P.pager(list.length) },
          );
      return `${head("Beneficiaries", `${int(18402)} Beneficiaries in the Program. This prototype holds ${list.length === P.db.benes.length ? int(list.length) : int(P.db.benes.length)} sample records.`, enrollBtn)}
      <section class="panel"><div class="panel__body"><div class="stack">${filters}<div class="row">${simBtn("Simulate: tap a Card on the desk reader", "ben.tapSearch")}</div></div></div></section>${results}`;
    },
  });

  /* ---------- AD-02 Beneficiary profile ---------- */
  const TABS = [
    "Details",
    "Credits",
    "Transactions",
    "Card",
    "Authorized Representatives",
    "History",
  ];
  const defaultTab = () =>
    P.hasRole("card officer")
      ? "Card"
      : P.hasRole("credits officer")
        ? "Credits"
        : "Details";
  P.screen("AD-02", {
    title: "Beneficiary profile",
    nav: "AD-01",
    render(pr) {
      if (!allowed(ALL_ADMIN)) return noAccess();
      const b = P.bene(pr.bene);
      if (!b)
        return `${crumbs(["Beneficiaries", "AD-01"], ["Not found"])}${stateMsg("circle-alert", "This record cannot be opened.", "It does not exist, or you may not see it.", btn("Back to Beneficiaries", "go", { v: "AD-01" }))}`;
      if (U().viewed !== b.key) {
        U().viewed = b.key;
        P.audit("Viewed Beneficiary profile", b.name);
      }
      const tab = TABS.includes(pr.tab) ? pr.tab : defaultTab();
      const acts = [];
      if (P.hasRole("enrollment officer") && b.status !== "pre-enrolled") {
        if (b.status !== "closed")
          acts.push(
            btn("Edit details", "ben.editOpen", { v: b.key, icon: "pencil" }),
          );
        if (b.status !== "closed")
          acts.push(
            btn("Record re-check", "ben.recheckOpen", {
              v: b.key,
              icon: "calendar",
            }),
          );
        if (b.status === "active")
          acts.push(
            btn("Suspend", "ben.status", { v: b.key, data: { op: "suspend" } }),
          );
        if (b.status === "suspended")
          acts.push(
            btn("Lift suspension", "ben.status", {
              v: b.key,
              data: { op: "lift" },
            }),
          );
        if (b.status !== "closed")
          acts.push(
            btn("Close record", "ben.status", {
              v: b.key,
              kind: "destructive",
              data: { op: "close" },
            }),
          );
      }
      if (b.status === "pre-enrolled" && P.hasRole("enrollment officer"))
        acts.push(
          btn("Complete at the desk", "ben.complete", {
            v: b.key,
            kind: "primary",
          }),
        );
      if (b.status === "closed" && P.hasRole("administrator"))
        acts.push(
          btn("Reopen record", "ben.status", {
            v: b.key,
            kind: "primary",
            data: { op: "reopen" },
          }),
        );
      if (P.hasRole("enrollment officer", "administrator") && b.pid)
        acts.push(
          btn("Print Transaction history", "ben.printOpen", {
            v: b.key,
            icon: "printer",
            data: { kind: "tx" },
          }),
          btn("Print personal details", "ben.printOpen", {
            v: b.key,
            icon: "printer",
            data: { kind: "details" },
          }),
        );
      const extra = `<p>${beneBadge(b)}${b.statusReason ? ` <span class="text-muted">${esc(b.statusReason)}</span>` : ""}</p>`;
      const header = `<section class="panel" aria-label="${esc(b.name)}"><div class="panel__body"><div class="stack">${idPanel(b, { extra })}${P.balanceBoxes(b)}${acts.length ? `<div class="button-row row">${acts.join("")}</div>` : ""}</div></div></section>`;
      const body = {
        Details: detailsTab,
        Credits: creditsTab,
        Transactions: txTab,
        Card: cardTab,
        "Authorized Representatives": repsTab,
        History: historyTab,
      }[tab](b);
      return `${crumbs(["Beneficiaries", "AD-01"], [b.name])}${head("Beneficiary profile", "Views of this record are logged.")}${header}<div>${tabs(TABS, tab, "ben.tab")}</div>${body}`;
    },
  });

  function detailsTab(b) {
    const rs = recheckState(b);
    return panel(
      "Details",
      detail([
        ["Full name", esc(b.name)],
        ["Date of birth", esc(b.birth)],
        ["Sex", esc(b.sex)],
        ["Beneficiary category", esc(b.category)],
        ["Government ID", `${esc(b.idType)}, ${esc(b.idNo)}`],
        ["Address", `${esc(b.brgy)}, ${esc(b.muni)}`],
        ["Mobile number", esc(b.phone || "none given")],
        [
          "Status",
          `${beneBadge(b)}${b.statusReason ? " " + esc(b.statusReason) : ""}`,
        ],
        [
          "Eligibility Re-check due",
          b.nextRecheck
            ? `${esc(b.nextRecheck)} ${rs ? P.status(rs) : ""}`
            : "not set",
        ],
        [
          "Consent",
          b.consent
            ? `Recorded ${esc(b.consent)}. Privacy notice, version 1`
            : "not recorded",
        ],
        ["Enrolled", esc(b.enrolled || "not yet")],
      ]),
    );
  }
  function creditsTab(b) {
    const L = P.db.ledger
      .filter((l) => l.bene === b.key)
      .map((l) => ({
        date: l.date,
        label: l.label,
        by: l.by,
        exp:
          l.expires || (/Yearly Allocation/.test(l.label) ? "31 Dec 2026" : ""),
        st: l.status,
        amt: l.amount,
      }));
    const T = P.db.tx
      .filter(
        (t) => t.bene === b.key && ["completed", "held"].includes(t.status),
      )
      .map((t) => ({
        date: t.when.split(",")[0],
        label: `Sale ${t.no}, ${P.branchName(t.branch)}`,
        by: t.staff,
        exp: "",
        st: "posted",
        amt: -t.credits,
      }));
    const rows = L.concat(T).map(
      (r) =>
        `<tr><th scope="row">${esc(r.date)}</th><td>${esc(r.label)}${r.st === "pending" ? " " + P.status("pending approval", "warning") : ""}</td><td>${esc(r.by)}</td><td>${esc(r.exp || "")}</td><td class="data-table__amount tabular">${r.amt < 0 ? "−" + fmt(-r.amt) : fmt(r.amt)}</td></tr>`,
    );
    const adj = P.hasRole("credits officer")
      ? b.status === "closed" || b.status === "pre-enrolled"
        ? `${reasonOff("A closed or Pre-enrolled record cannot take an Adjustment.")}${btn("Adjustment", "ben.adjust", { v: b.key, off: true })}`
        : btn("Adjustment", "ben.adjust", {
            v: b.key,
            kind: "primary",
            icon: "plus",
          })
      : "";
    return panel(
      "Credit ledger",
      table(
        "Credit ledger",
        ["Date", "Entry", "By", "Expires", "Credits$"],
        rows,
        "No ledger entries yet.",
      ),
      { raw: true, right: adj ? `<div class="row">${adj}</div>` : "" },
    );
  }
  function txTab(b) {
    const list = P.db.tx.filter((t) => t.bene === b.key);
    const rows = list.map(
      (t) =>
        `<tr><th scope="row" class="tabular"><a href="#" data-a="ben.txOpen" data-v="${esc(t.no)}">${esc(t.no)}</a></th><td>${esc(t.when)}</td><td>${esc(P.branchName(t.branch))}</td><td>${esc(t.presenter)}</td><td>${P.status(t.status)}</td><td class="data-table__amount tabular">${fmt(t.credits)}</td></tr>`,
    );
    return panel(
      "Transactions",
      list.length
        ? table(
            "Transactions",
            [
              "Transaction number",
              "Date and time",
              "Institution",
              "Presented by",
              "Status",
              "Credits deducted$",
            ],
            rows,
          )
        : `<div class="panel__body">${stateMsg("inbox", "No Transactions yet", "Sales at accredited Institutions appear here.")}</div>`,
      { raw: true },
    );
  }
  function historyTab(b) {
    return panel(
      "History",
      table(
        "Change history",
        ["When", "What happened", "By"],
        b.history
          .slice()
          .reverse()
          .map(
            (h) =>
              `<tr><th scope="row">${esc(h.when)}</th><td>${esc(h.what)}</td><td>${esc(h.by)}</td></tr>`,
          ),
      ),
      { raw: true },
    );
  }

  /* Card tab */
  function pinSection(b, label, intro) {
    const path = "form.pinchk." + b.key;
    const f = F(path, { id: false, who: "bene", auth: null });
    const repSel = b.reps.length
      ? `<div class="field" role="group" aria-label="Who sets the PIN"><span class="field__label">Who sets the PIN</span>${radios(path + ".who", [["bene", `${b.name}, the Beneficiary`], ...b.reps.map((r, i) => ["rep" + i, `${r.name}, Authorized Representative`])])}</div>`
      : "";
    const needAuth = f.who !== "bene";
    const reason = !f.id
      ? "Tick Identity checked first."
      : needAuth && !f.auth
        ? "Upload the signed authorization first."
        : "";

        {
          right: cardBadge(c),
          footer: isCO
            ? `<div class="button-row">${btn("Print Card again", "ben.reprint", { v: b.key, kind: "primary", icon: "printer" })}</div>`

      if (c.status === "awaiting PIN change")
        bodyHtml = `${alert("The Card cannot be used until the PIN is changed", "An Authorized Representative was removed. Change the PIN with the Beneficiary.", "triangle-alert")}${bodyHtml}`;
      if (isCO && b.status === "active")
        bodyHtml +=

      <p>${waive ? P.actionLink("Record the fee instead", "ben.waiveToggle") : P.actionLink("The Beneficiary cannot pay: request fee waiver", "ben.waiveToggle")}</p>`;
      footer = waive
        ? `${reasonOff(reason)}${btn("Cancel", "closePanel")}${btn("Request fee waiver", "ben.waive", { kind: "primary", v: b.key, off: !!reason })}`

      b.history.push({
        when: P.stamp(),
        what: "Replacement fee waived. Replacement Card added to the Card print queue.",
        by: P.who(),
      });
      P.audit("Waived replacement fee", b.name);
    },
    reject(item) {
      const b = P.bene(item.payload.bene);
      if (!b) return;
      b.feeDue = { status: "due" };

        when: P.stamp(),

    },
  });
  function makeBene(d) {
    const db = P.db;
    const pid = P.nextPid();
    const key =
      "b-" +
      d.name.toLowerCase().replace(/[^a-z]+/g, "-") +
      "-" +
      Date.now().toString(36);
    const b = {
      key,
      name: d.name.trim(),
      pid,
      age: ageFrom(d.birth),
      birth: d.birth,
      sex: d.sex,
      category: d.category,
      muni: d.muni,
      brgy: d.brgy,
      phone: d.phone,
      idType: d.idType,
      idNo: d.idNo.trim(),
      status: "active",
      statusReason: "",
      reps: [],
      cards: [],
      pin: null,
      pinTries: 5,
      consent: P.TODAY,
      enrolled: P.TODAY,
      nextRecheck: nextYear(),
      history: [],
    };
    hist(b, "Enrolled. Consent recorded with privacy notice, version 1.");
    db.benes.push(b);
    db.ledger.push({
      bene: key,
      date: P.TODAY,
      label: "Yearly Allocation 2026",
      amount: db.allocation[b.category] || 0,
      status: "posted",
      by: "System",
    });
    return b;
  }
  function completePre(b, d) {

      name: d.name.trim(),
      birth: d.birth,
      age: ageFrom(d.birth),
      sex: d.sex,
      category: d.category,
      muni: d.muni,
      brgy: d.brgy,
      phone: d.phone,
      idType: d.idType,
      idNo: d.idNo.trim(),
      pid: P.nextPid(),
      status: "active",
      consent: P.TODAY,
      enrolled: P.TODAY,
      nextRecheck: nextYear(),
    });
    hist(
      b,
      "Pre-enrolled record completed at the desk. Consent recorded with privacy notice, version 1.",

  /* ---------- AD-12 PIN hand-over (full screen) ---------- */
  const badPin = (pin, b) => {
    if (/^(\d)\1{5}$/.test(pin)) return true;
    const d = pin.split("").map(Number);
    if (
      d.every((x, i) => !i || x === d[i - 1] + 1) ||
      d.every((x, i) => !i || x === d[i - 1] - 1)
    )
      return true;
    const m = /^(\d{2})\/(\d{2})\/(\d{2})(\d{2})$/.exec(b.birth || "");
    if (
      m &&
      [
        m[1] + m[2] + m[4],
        m[2] + m[1] + m[4],
        m[4] + m[2] + m[1],
        m[1] + m[2] + m[3],
      ].includes(pin)
    )
      return true;
    return false;
  };
  function pinPad(prompt, isErr, rule) {
    const n = U().pin.buf.length;
    const dots = Array.from(
      { length: 6 },
      (_, i) =>
        `<span class="pin-pad__dot${i < n ? " is-filled" : ""}"></span>`,
    ).join("");
    const keys = ["1", "2", "3", "4", "5", "6", "7", "8", "9"]
      .map(
        (k) =>
          `<button class="pin-pad__key" type="button" data-a="ben.pinKey" data-v="${k}">${k}</button>`,
      )
      .join("");
    return `<div class="pin-pad"><h2 class="pin-pad__prompt${isErr ? " is-error" : ""}" role="status">${esc(prompt)}</h2>${rule ? `<p>${esc(rule)}</p>` : ""}<div class="pin-pad__entry"><span class="pin-pad__dots">${dots}</span><span>${n} of 6</span></div><div class="pin-pad__keys">${keys}<span></span><button class="pin-pad__key" type="button" data-a="ben.pinKey" data-v="0">0</button><button class="pin-pad__key pin-pad__key--delete" type="button" data-a="ben.pinDel">Delete</button></div></div>`;
  }
  const RULE =
    "Do not use your birth date. Do not use a pattern like 111111 or 123456.";
  function pinScreen() {
    const s = U().pin;
    if (!s) return "";
    const frame = (inner) =>
      `<div class="hand-over-frame hand-over-frame--centered agapay" style="max-height:100%;overflow-y:auto"><span class="hand-over-frame__wordmark">Agapay</span>${inner}</div>`;
    if (s.stage === "pin1" || s.stage === "pin2") {
      const prompt =
        s.err ||
        (s.stage === "pin1"
          ? "Choose a 6-digit PIN"
          : "Enter the same PIN again");
      const rule =
        s.stage === "pin1" && !/Choose a different PIN/.test(s.err) ? RULE : "";
      return frame(
        `${pinPad(prompt, !!s.err, rule)}<div class="hand-over-frame__actions">${btn("Cancel", "ben.pinCancel", { terminal: true })}${btn("Confirm", "ben.pinOk", { kind: "primary", terminal: true, off: s.buf.length < 6 })}</div>`,
      );
    }
    if (s.stage === "unlock") {
      const pw = P.get("form.unlock.pw") || "";
      return frame(
        `<div class="hand-over-frame__message"><h2 class="hand-over-frame__prompt">Officer: unlock</h2><p>Enter your own password to unlock this screen.</p>${field("Password", input("form.unlock.pw", { type: "password", auto: "current-password" }), "Any password works in this prototype.")}</div><div class="hand-over-frame__actions">${btn("Unlock", "ben.unlockGo", { kind: "primary", terminal: true, icon: "lock", off: !pw })}</div>`,
      );
    }
    const msg =
      s.stage === "done"
        ? "Your PIN is saved. Please give the device back to the officer."
        : "No PIN was saved. Please give the device back to the officer.";
    return frame(
      `<div class="hand-over-frame__message"><h2 class="hand-over-frame__prompt" role="status">${esc(msg)}</h2>${s.stage !== "done" ? `<p>Help: ${esc(help())}</p>` : ""}</div><div class="hand-over-frame__actions">${btn("Officer: unlock", "ben.unlock", { kind: "primary", terminal: true, icon: "lock" })}</div>`,
    );
  }
  function startPin(key, kind) {
    const b = P.bene(key);
    U().pin = { bene: key, kind, stage: "pin1", buf: "", first: "", err: "" };
    P.set("form.unlock", { pw: "" });
    P.S.ui.fullscreen = pinScreen;
    P.audit("Started PIN hand-over", b.name);
  }
  function finishPin() {
    const s = U().pin,
      b = P.bene(s.bene),
      c = cur(b);
    P.S.ui.fullscreen = null;
    U().pin = null;
    if (s.stage === "done" || s.saved) {
      const wasLocked = c.status === "locked";
      b.pin = s.first;
      b.pinTries = 5;
      if (s.kind === "issue") {
        c.status = "issued";
        c.issued = P.TODAY;
        c.by = P.who();
        hist(
          b,
          `${c.replacement ? "Replacement Card" : "Card"} ${c.no} issued. PIN set by the Beneficiary.`,
        );
        P.audit("Issued Card", b.name);
        markCard(b, "pinSet");
      } else {
        c.status = "issued";
        hist(
          b,
          wasLocked
            ? "PIN reset at the office. The Locked Card works again."
            : "PIN changed at the office.",
        );
        P.audit(wasLocked ? "Reset PIN" : "Changed PIN", b.name);
        P.mark("flow6.pinReset");
      }
      P.S.form.pinchk && (P.S.form.pinchk[b.key] = null);
      U().issue[b.key] = null;
      P.go("AD-02", { bene: b.key, tab: "Card" });
      P.toast("PIN set", `${b.name}. The Card is issued.`);
    } else {
      P.audit("PIN hand-over cancelled", b.name);
      P.toast(
        "No PIN was saved",
        `${b.name}. Start the hand-over again when ready.`,
      );
    }
  }
  const prevKey = P.onKey;
  P.onKey = (e) => {
    const s = P.S && P.S.ui.ben && P.S.ui.ben.pin;
    if (
      s &&
      P.S.ui.fullscreen &&
      (s.stage === "pin1" || s.stage === "pin2") &&
      !(e.target && e.target.tagName === "INPUT")
    ) {
      if (/^\d$/.test(e.key)) {
        P.actions["ben.pinKey"](e.key);
        return true;
      }
      if (e.key === "Backspace") {
        P.actions["ben.pinDel"]();
        return true;
      }
      if (e.key === "Enter") {
        P.actions["ben.pinOk"]();
        return true;
      }
    }
    return prevKey ? prevKey(e) : false;
  };

  A["ben.status"] = (v, el) => {
    const b = P.bene(v),
      op = el.dataset.op,
      fromRc = el.dataset.from === "recheck";
    P.S.form.st = {
      list: fromRc ? "no longer eligible" : "",
      text: "",
      death: "",
    };
    const f = () => P.S.form.st;
    const needList = op === "suspend" || op === "close";
    const T = {
      suspend: ["Suspend this record?", "Suspend record", "primary"],
      lift: ["Lift the suspension?", "Lift suspension", "primary"],
      close: ["Close this record?", "Close record", "destructive"],
      reopen: ["Reopen this record?", "Reopen record", "primary"],
    }[op];
    P.confirm({
      title: T[0],
      ok: T[1],
      kind: T[2],
      body: () => {
        const e = P.S.ui.err.dialogOk;
        const lead = {
          suspend: `<p>${esc(b.name)} cannot use the Card while suspended. No Credits are removed.</p>`,
          lift: `<p>${esc(b.name)} becomes active. The Card works again.</p>`,
          close: `<p>The Card stops working at once, and the remaining ${fmt(Math.max(P.available(b), 0))} Credits are written off. The record stays for audit.</p>`,
          reopen:
            "<p>The record becomes active. Written-off Credits are not restored.</p>",
        }[op];
        return `${lead}${needList ? field("Reason (required)", P.select("form.st.list", op === "suspend" ? SUSPEND : CLOSE), "", e && !f().list ? "Choose a reason." : "") : ""}${op === "close" && f().list === "deceased" ? field("Date of death (required)", input("form.st.death", { placeholder: "2 Nov 2026" }), "", e && !f().death.trim() ? "Enter the date of death." : "") : ""}${reasonField("form.st.text", needList ? "Details (required)" : "Reason (required)", 10, e)}`;
      },
      off: () =>
        (needList && !f().list) ||
        (op === "close" && f().list === "deceased" && !f().death.trim()) ||
        f().text.trim().length < 10,
      action: () => {
        const s = f();
        if (op === "suspend") {
          b.status = "suspended";
          b.statusReason = s.list;
          hist(b, `Suspended. Reason: ${s.list}. ${s.text.trim()}`);
          P.audit("Suspended Beneficiary", b.name);
          P.toast("Record suspended", `${b.name}. The Card cannot be used.`);
        }
        if (op === "lift") {
          b.status = "active";
          b.statusReason = "";
          hist(b, `Suspension lifted. ${s.text.trim()}`);
          P.audit("Lifted suspension", b.name);
          P.toast("Suspension lifted", `${b.name} is active.`);
        }
        if (op === "close") {
          const av = Math.max(P.available(b), 0);
          b.status = "closed";
          b.statusReason =
            s.list === "deceased"
              ? `Deceased, ${s.death.trim()}`
              : s.list.replace(/^./, (c) => c.toUpperCase());
          b.cards.forEach((c) => {
            if (!["blocked", "damaged"].includes(c.status)) {
              c.status = "blocked";
              c.reason = "record closed";
              c.blocked = P.TODAY;
            }
          });
          if (av > 0)
            P.db.ledger.push({
              bene: b.key,
              date: P.TODAY,
              label: "Credits written off on closing",
              amount: -av,
              status: "posted",
              by: P.who(),
            });
          hist(
            b,
            `Closed. Reason: ${b.statusReason}. ${s.text.trim()} ${fmt(av)} Credits written off.`,
          );
          P.audit("Closed Beneficiary record", b.name);
          P.closePanel();
          P.toast(
            "Record closed",
            `${b.name}. The Card no longer works. ${fmt(av)} Credits written off.`,
          );
        }
        if (op === "reopen") {
          b.status = "active";
          b.statusReason = "";
          hist(
            b,
            `Reopened. ${s.text.trim()} Written-off Credits are not restored.`,
          );
          P.audit("Reopened Beneficiary record", b.name);
          P.toast(
            "Record reopened",
            `${b.name} is active. A card officer can print a new Card.`,

      },
    });

      s.first = "";

    s.stage = "done";
