<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agapay Prototype</title>
    <meta name="robots" content="noindex, nofollow" />
    <!--
  Clickable prototype of every Agapay workflow, for client walkthroughs.
  The spines (DESIGN.md, EXPERIENCE.md) are the contract. Look comes from mock-base.css.
  Scripts: prototype/core.js (state, data, shell, guide), one module per area, journeys.js last.
  Build a single-file copy for sharing: python3 prototype/build.py <out.html>
-->
    <style>
/* ==========================================================================
   Agapay key-screen mocks: the one shared stylesheet (mock-base.css)

   Every key-*.html mock in this folder links this file and takes its whole
   look from it. DESIGN.md is the contract. Where a mock or this file differs
   from DESIGN.md or EXPERIENCE.md, the spines win.

   GENERATED FILE. Source: tools/mock-base.src.css plus the DESIGN.md
   frontmatter. Build: python3 tools/build_mock_base.py. Check:
   python3 tools/check_mock_base.py. Do not edit mock-base.css by hand.

   SECTION 1  Tokens. The only place a hex value or a raw size is written.
              1a is GENERATED BY SCRIPT from the DESIGN.md YAML frontmatter
              (colors, typography, rounded, spacing), one custom property per
              token, so nothing is typed by hand. To change the theme, edit
              the token values in the DESIGN.md frontmatter and run the build
              script. Nothing in Sections 2 and 3 changes.
              1b stock values inherited from Tailwind 4 and shadcn new-york,
              and the lucide icons. 1c mock chrome, including the screen
              rendition of a thermal slip.
   SECTION 2  Shared components. One block per DESIGN.md component, styled
              with var(--...) only. The typography declarations in each block
              were expanded by the same script from the token's own property
              list.
   SECTION 3  Frames and helpers for mocks only. Not part of the product.

   Class naming
     .{component}             base class, the DESIGN.md component name      .button  .status-badge  .title-bar
     .{component}--{variant}  colour role or layout variant                 .button--primary  .status-badge--warning
     .{component}--terminal   the -terminal size variant, on the same base  .button--terminal  .input--terminal
     .{component}__{part}     a part or slot                                .title-bar__wordmark  .balance-figures__box
     .is-{state}              state, beside the matching ARIA attribute     .is-selected  .is-error  .is-unavailable
                              .is-focus-visible draws the Focus ring in a static mock
     .agapay                  root of every product surface (font, colour, canvas)
     .mock-*                  Section 3 only
   Each block lists its DESIGN.md frontmatter keys as "@component key -> selector".

   Light mode only. System fonts only. No @import, no network, no JS.
   ========================================================================== */

  /* ---- 1c. Mock chrome only: Section 3 frames and the screen rendition of a thermal slip. Not part of the product. ---- */
  /* Frame sizes. EXPERIENCE.md, Responsive & Platform: desktop 1280, tablet landscape 1024, tablet portrait 768, handheld 360 by 640dp. */
  --mock-desktop-width: 1280px;
  --mock-desktop-height: 800px;
  --mock-tablet-landscape-width: 1024px;
  --mock-tablet-landscape-height: 768px;
  --mock-tablet-portrait-width: 768px;
  --mock-tablet-portrait-height: 1024px;
  --mock-handheld-width: 360px;
  --mock-handheld-height: 640px;
  --mock-handheld-height-tall: 720px;
  /* Mock chrome. Neutral on purpose: it must not change with the theme. */
  --mock-page: #eceef1;
  --mock-surface: #ffffff;
  --mock-ink: #1f2430;
  --mock-ink-soft: #4a5160;
  --mock-line: #b9bfc9;
  --mock-chrome: #dfe2e7;
  --mock-bezel: #14161b;
  --mock-desk: #7d8490;
  --mock-paper-shadow: 0 1px 4px rgb(0 0 0 / 0.3);
  --mock-text: 14px;
  --mock-text-small: 12px;
  --mock-text-title: 24px;
  --mock-leading: 1.5;
  --mock-weight-strong: 600;
  --mock-tracking: 0.06em;
  --mock-pad: 32px;
  --mock-gap: 24px;
  --mock-gap-small: 8px;
  --mock-line-width: 1px;
  --mock-note-rule: 4px;
  --mock-radius: 8px;
  --mock-bar-height: 36px;
  --mock-bezel-width: 12px;
  --mock-bezel-radius: 28px;
  --mock-screen-radius: 4px;
  --mock-slip-zoom: 2;
  --mock-measure: 80ch;
  /* Screen rendition of a thermal slip. The product prints in the printer font (typography.print-*): 12 by 24 dots at 203 dpi, 32 characters on 58mm. These values only draw that on a screen. */
  --mock-print-font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --mock-print-columns: 32;
  --mock-print-font-size: 2.5mm;
  --mock-print-line-height: 1.4;
  --mock-print-double: 2;
  --mock-print-feed: 4mm;
}

/*! SECTION 2: SHARED COMPONENTS */

/* ---- Base. Not a DESIGN.md component: the product root, resets, text helpers ---- */
@property --_edge { syntax: "*"; inherits: false; }
:where(.agapay), :where(.agapay) *, :where(.agapay) *::before, :where(.agapay) *::after { box-sizing: border-box; }
.agapay {
  font-family: var(--stock-font-sans);
  font-size: var(--stock-text-sm);
  font-weight: var(--stock-font-normal);
  line-height: var(--stock-leading-sm);
  color: var(--color-foreground);
  background: var(--color-background);
  text-align: start;
  -webkit-text-size-adjust: 100%;
}
:where(.agapay) :where(h1, h2, h3, h4, p, ul, ol, dl, dd, figure) { margin: 0; padding: 0; }
:where(.agapay) :where(h1, h2, h3, h4) { font-size: inherit; font-weight: inherit; line-height: inherit; }
:where(.agapay) :where(ul, ol) { list-style: none; }
:where(.agapay) :where(button, input, select, textarea) { margin: 0; font: inherit; letter-spacing: inherit; color: inherit; }
:where(.agapay) :where(svg) { display: block; max-width: 100%; }
/* Links inside text: primary, always underlined (DESIGN.md, Colors) */
:where(.agapay) :where(a), .link { color: var(--color-primary); text-decoration: underline; text-underline-offset: var(--stock-space-0-5); }
.visually-hidden { position: absolute; width: var(--spacing-border-width); height: var(--spacing-border-width); margin: calc(-1 * var(--spacing-border-width)); padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
.text-muted { color: var(--color-muted-foreground); }
.text-destructive { color: var(--color-destructive); }
.tabular { font-variant-numeric: tabular-nums; }
/* One helper per typography token: .type-{role} */
.type-wordmark { font-size: var(--typography-wordmark-font-size); font-weight: var(--typography-wordmark-font-weight); letter-spacing: var(--typography-wordmark-letter-spacing); }
.type-heading { font-size: var(--typography-heading-font-size); font-weight: var(--typography-heading-font-weight); line-height: var(--typography-heading-line-height); letter-spacing: var(--typography-heading-letter-spacing); }
.type-label { font-size: var(--typography-label-font-size); font-weight: var(--typography-label-font-weight); line-height: var(--typography-label-line-height); letter-spacing: var(--typography-label-letter-spacing); }
.type-figure { font-size: var(--typography-figure-font-size); font-weight: var(--typography-figure-font-weight); line-height: var(--typography-figure-line-height); letter-spacing: var(--typography-figure-letter-spacing); }
.type-button { font-size: var(--typography-button-font-size); font-weight: var(--typography-button-font-weight); line-height: var(--typography-button-line-height); }
.type-terminal-body { font-size: var(--typography-terminal-body-font-size); font-weight: var(--typography-terminal-body-font-weight); line-height: var(--typography-terminal-body-line-height); }
.type-terminal-meta { font-size: var(--typography-terminal-meta-font-size); font-weight: var(--typography-terminal-meta-font-weight); line-height: var(--typography-terminal-meta-line-height); }
.type-terminal-title { font-size: var(--typography-terminal-title-font-size); font-weight: var(--typography-terminal-title-font-weight); line-height: var(--typography-terminal-title-line-height); letter-spacing: var(--typography-terminal-title-letter-spacing); }
.type-terminal-name { font-size: var(--typography-terminal-name-font-size); font-weight: var(--typography-terminal-name-font-weight); line-height: var(--typography-terminal-name-line-height); letter-spacing: var(--typography-terminal-name-letter-spacing); }
.type-terminal-balance { font-size: var(--typography-terminal-balance-font-size); font-weight: var(--typography-terminal-balance-font-weight); line-height: var(--typography-terminal-balance-line-height); letter-spacing: var(--typography-terminal-balance-letter-spacing); }
.type-terminal-figure { font-size: var(--typography-terminal-figure-font-size); font-weight: var(--typography-terminal-figure-font-weight); line-height: var(--typography-terminal-figure-line-height); letter-spacing: var(--typography-terminal-figure-letter-spacing); }
.type-terminal-action { font-size: var(--typography-terminal-action-font-size); font-weight: var(--typography-terminal-action-font-weight); line-height: var(--typography-terminal-action-line-height); }
.type-outcome-title { font-size: var(--typography-outcome-title-font-size); font-weight: var(--typography-outcome-title-font-weight); line-height: var(--typography-outcome-title-line-height); letter-spacing: var(--typography-outcome-title-letter-spacing); }
.type-outcome-message { font-size: var(--typography-outcome-message-font-size); font-weight: var(--typography-outcome-message-font-weight); line-height: var(--typography-outcome-message-line-height); }
.type-pin-prompt { font-size: var(--typography-pin-prompt-font-size); font-weight: var(--typography-pin-prompt-font-weight); line-height: var(--typography-pin-prompt-line-height); }
.type-pin-body { font-size: var(--typography-pin-body-font-size); font-weight: var(--typography-pin-body-font-weight); line-height: var(--typography-pin-body-line-height); }
.type-pin-action { font-size: var(--typography-pin-action-font-size); font-weight: var(--typography-pin-action-font-weight); line-height: var(--typography-pin-action-line-height); }
.type-pin-amount { font-size: var(--typography-pin-amount-font-size); font-weight: var(--typography-pin-amount-font-weight); line-height: var(--typography-pin-amount-line-height); letter-spacing: var(--typography-pin-amount-letter-spacing); }
.type-pin-key { font-size: var(--typography-pin-key-font-size); font-weight: var(--typography-pin-key-font-weight); line-height: var(--typography-pin-key-line-height); }
.type-label { text-transform: uppercase; }
.screen-title { font-size: var(--typography-heading-font-size); font-weight: var(--typography-heading-font-weight); line-height: var(--typography-heading-line-height); letter-spacing: var(--typography-heading-letter-spacing); }

/* ---- Icons. lucide, per DESIGN.md Brand & Style. Colour is currentColor ---- */

.icon--lg { width: var(--stock-size-6); height: var(--stock-size-6); }
.icon--xl { width: var(--stock-size-8); height: var(--stock-size-8); }
.icon--check { --_icon: var(--icon-check); }
.icon--x { --_icon: var(--icon-x); }
.icon--circle-help { --_icon: var(--icon-circle-help); }
.icon--chevron-down { --_icon: var(--icon-chevron-down); }
.icon--chevron-right { --_icon: var(--icon-chevron-right); }
.icon--chevron-left { --_icon: var(--icon-chevron-left); }
.icon--search { --_icon: var(--icon-search); }
.icon--plus { --_icon: var(--icon-plus); }
.icon--minus { --_icon: var(--icon-minus); }
.icon--arrow-up { --_icon: var(--icon-arrow-up); }
.icon--arrow-down { --_icon: var(--icon-arrow-down); }
.icon--arrow-up-down { --_icon: var(--icon-arrow-up-down); }
.icon--menu { --_icon: var(--icon-menu); }
.icon--ellipsis { --_icon: var(--icon-ellipsis); }
.icon--user { --_icon: var(--icon-user); }
.icon--users { --_icon: var(--icon-users); }
.icon--info { --_icon: var(--icon-info); }
.icon--circle-alert { --_icon: var(--icon-circle-alert); }
.icon--triangle-alert { --_icon: var(--icon-triangle-alert); }
.icon--calendar { --_icon: var(--icon-calendar); }
.icon--upload { --_icon: var(--icon-upload); }
.icon--download { --_icon: var(--icon-download); }
.icon--camera { --_icon: var(--icon-camera); }
.icon--printer { --_icon: var(--icon-printer); }
.icon--wifi { --_icon: var(--icon-wifi); }
.icon--wifi-off { --_icon: var(--icon-wifi-off); }
.icon--battery-medium { --_icon: var(--icon-battery-medium); }
.icon--nfc { --_icon: var(--icon-nfc); }
.icon--delete { --_icon: var(--icon-delete); }
.icon--inbox { --_icon: var(--icon-inbox); }
.icon--loader-circle { --_icon: var(--icon-loader-circle); }
.icon--file-text { --_icon: var(--icon-file-text); }
.icon--credit-card { --_icon: var(--icon-credit-card); }
.icon--chart-column { --_icon: var(--icon-chart-column); }
.icon--circle-check { --_icon: var(--icon-circle-check); }

.icon--lock { --_icon: var(--icon-lock); }
