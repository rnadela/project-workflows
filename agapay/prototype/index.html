      .slice()
      .reverse();
  }
  function scTxList(t, c) {
    const u = user(t),
      list = txListFor(t, c);
    const rows = list
      .map(
        (x) =>
          `<a class="data-table__row" href="#" role="listitem" data-a="ct.openTx" data-v="${x.no}"><span class="data-table__main">${esc(splitWhen(x.when)[1])}</span><span class="data-table__details">Transaction number ${esc(x.no)}${x.status !== "completed" ? " " + termBadge(P.ROLE_OF[x.status] || "muted", x.status) : ""}</span><span class="data-table__amount">${fmt(x.credits)}<span class="visually-hidden"> Credits deducted</span></span></a>`,
      )
      .join("");
    const table = rows
      ? `<div class="data-table data-table--terminal" role="list" aria-label="${canAuthorize(u) ? "Transactions at this Branch today" : "Your Transactions today"}">${rows}</div><nav class="pagination pagination--terminal" aria-label="Pagination"><span class="pagination__summary">1 to ${list.length} of ${list.length}</span></nav>`
      : stateMsg("inbox", "No Transactions today yet.", "");
    const find = `<div class="row" style="align-items:flex-end">${tfield("Find by Transaction number", bp(t) + ".findNo", { mode: "numeric" })}${tb("Find", "ct.findTx")}</div>${t.findErr ? stateMsg("search", "No Transaction with that number at this Branch.", "Check the number on the Receipt.") : ""}`;
    return stepScreen(t, c, {
      title: canAuthorize(u)
        ? "Transactions at this Branch today"
        : "Your Transactions today",
      content: find + table,
      actions: tb("Back", "ct.home"),
    });
  }
  function canVoid(tx) {
    if (!isToday(tx) || tx.status !== "completed") return false;
    const st = tx.stmt && P.statement(tx.stmt);
    return !(st && ["approved", "partly paid", "paid"].includes(st.stage));
  }
  function scTxDetail(t, c) {
    const tx = P.db.tx.find((x) => x.no === t.txNo && x.branch === c.br.id),
      b = P.bene(tx.bene);
    const ph = isPh(tx);
    const lines = tx.lines
      .map(
        ([n, q, p]) =>
          `<div class="data-table__row" role="listitem"><span class="data-table__main">${esc(n)}</span><span class="data-table__details">${ph ? `${q} × ₱${fmt(p)}` : "Service line"}</span><span class="data-table__amount">₱${fmt(q * p)}</span></div>`,
      )
      .join("");
    const row = (l, v, d) =>
      `<div class="sale-summary__row${d ? " sale-summary__row--deduct" : ""}"><span>${l}</span><span class="sale-summary__amount">${v}</span></div>`;
    const status =
      tx.status !== "completed"
        ? termBadge(P.ROLE_OF[tx.status] || "muted", tx.status)
        : "";
    const printLabel = tx.prints ? "Print copy" : "Print Receipt";
    const voidable = canVoid(tx);
    const slipFail = t.printFail
      ? '<p class="text-destructive">Receipt not printed. Load paper, then press Print Receipt.</p>'
      : "";
    return stepScreen(t, c, {
      kicker: `Transaction ${tx.no}`,
      title: b.name,
      content: `${status}<p class="type-terminal-body">${esc(tx.when)}<br>Program ID number ${maskedPid(b.pid)}${tx.presenter !== "Beneficiary" ? `<br>Presented by ${esc(tx.presenter)}` : ""}<br>Staff: ${esc(tx.staff)}</p><div class="data-table data-table--terminal" role="list" aria-label="Sale lines">${lines}</div><div class="sale-summary">${row("Total", "₱" + fmt(tx.total))}${row("Discount", "₱" + fmt(tx.discount))}${row("Credits deducted", fmt(tx.credits), true)}${row("Cash paid", "₱" + fmt(tx.cash))}</div>${tx.status === "voided" && tx.voidBy ? `<p class="text-muted">Voided ${esc(tx.voidWhen)} by ${esc(tx.voidBy)}${tx.voidAuth ? `, authorized by ${esc(tx.voidAuth)}` : ""}.</p>` : ""}${voidable ? "" : '<p class="text-muted">This Transaction can no longer be voided.</p>'}${slipFail}`,
      actions:
        tb(printLabel, "ct.reprint") +
        (tx.status === "voided" && tx.voidBy
          ? tb("Print Void slip", "ct.printVoidSlip")
          : "") +
        (voidable
          ? tb("Void Transaction", "ct.startVoid", { kind: "destructive" })
          : "") +
        tb("Back", "ct.txList"),
    });
  }
  function voidProblem(t) {
    const v = t.voidSt;
    if (!v.reason) return "Pick the reason for the Void.";
    if (v.reason === "Other" && String(v.other || "").trim().length < 10)
      return "Type the reason, at least 10 characters.";
    return "";
  }
  function scVoid(t, c) {
    const tx = P.db.tx.find((x) => x.no === t.txNo && x.branch === c.br.id),
      v = t.voidSt;
    return stepScreen(t, c, {
      kicker: `Transaction ${tx.no}`,
      title: "Void Transaction",
      content: `<p class="type-terminal-body">${fmt(tx.credits)} Credits return to the Beneficiary.</p><div class="reason-field reason-field--terminal" role="group" aria-label="Reason for the Void"><span class="reason-field__label">Reason for the Void (required)</span>${choice(
        "ct.voidReason",
        P.db.reasons.void.map((r) => [r, r]),
        v.reason,
        "Reason for the Void",
      )}</div>${v.reason === "Other" ? tfield("Type the reason", bp(t) + ".voidSt.other") : ""}`,
      actions: tb("Cancel", "ct.openTx", { v: tx.no }),
      footer: offBtn("Continue", "ct.voidNext", voidProblem(t), {
        kind: "primary",
      }),
    });
  }
  function scAuth(t, c) {
    const a = t.auth,
      u = user(t);
    const list = staffList(c).filter((x) => canAuthorize(x) && x.key !== u.key);
    const what =
      a.kind === "void"
        ? "Authorize Void"
        : a.kind === "reprint"
          ? "Authorize reprint"
          : "Authorize viewing";
    const tx = P.db.tx.find((x) => x.no === a.no && x.branch === c.br.id);
    const meta =
      a.kind === "void"
        ? `Transaction ${a.no}. ${fmt(tx.credits)} Credits return to the Beneficiary.`
        : a.kind === "reprint"
          ? `Transaction ${a.no}. A copy of the Receipt prints.`
          : `Transaction ${a.no} was recorded by ${tx.staff}.`;
    let inner;
    const az = a.pick && list.find((x) => x.key === a.pick);
    if (!az)
      inner = `${choice(
        "ct.authPick",
        list.map((x) => [x.key, short(x), x.role]),
        a.pick,
        "Who is authorizing",
      )}${list.length ? "" : '<p class="text-muted">No manager or Head Office user is listed for this Branch.</p>'}`;
    else if (az.status === "locked")
      inner = `<p class="authorize-panel__error">This account is locked after 5 failed sign-ins. Ask ${az.role === "Head Office" ? "the Province's administrator" : "Head Office"} to unlock it.</p>`;
    else
      inner = `<p><b>${esc(short(az))}</b>, enter your passcode. Your name is recorded with ${esc(short(u))}'s.</p>${t.err ? `<p class="authorize-panel__error">${esc(t.err)}</p>` : ""}<div class="pin-pad__entry"><span class="pin-pad__dots">${dots(t.buf.length)}</span><span class="type-terminal-meta">${t.buf.length} of 6</span></div>${keys()}`;
    return stepScreen(t, c, {
      content: `<section class="authorize-panel" aria-label="${esc(what)} of Transaction ${esc(a.no)}"><h3 class="authorize-panel__title">${esc(what)}</h3><p class="authorize-panel__meta">${esc(meta)}</p>${inner}${tb("Cancel", "ct.authCancel")}</section>`,
    });
  }
  function scVoided(t, c) {
    const tx = P.db.tx.find((x) => x.no === t.txNo && x.branch === c.br.id);
    const note = t.voidSlipPending
      ? '<span class="text-destructive">Void slip not printed. Load paper, then press Print Void slip.</span>'
      : "Void slip printed.";
    return stepScreen(t, c, {
      kicker: `Transaction ${tx.no}`,
      content: outcome(
        "success",
        "check",
        "Transaction voided.",
        `${fmt(tx.credits)} Credits returned.`,
        [note],
      ),
      actions: t.voidSlipPending
        ? tb("Print Void slip", "ct.printVoidSlip")
        : "",
      footer: tb("Done", "ct.txList", { kind: "primary" }),
    });
  }

  const SCREENS = {
    signin: scSignIn,
    ready: scReady,
    reading: scReading,
    identity: scIdentity,
    lines: scLines,
    line: scLine,
    rx: scRx,
    discount: scDiscount,
    summary: scSummary,
    presenter: scPresenter,
    pin: scPin,
    wrongpin: scWrongPin,
    locked: scLocked,
    confirming: scConfirming,
    complete: scComplete,
    refusal: scRefusal,
    checking: scChecking,
    notCompleted: scNotCompleted,
    txlist: scTxList,
    txdetail: scTxDetail,
    void: scVoid,
    auth: scAuth,
    voided: scVoided,
  };
  const PAD_STEPS = ["pin"];

  P.screen("CT", {
    title: "Counter Terminal",
    render: ({ terminal }) => {
      const t = T(terminal),
        c = ctx(terminal);
      if (!t.user && t.step !== "signin") go(t, "signin");
      if (t.user && t.checking && !["checking", "complete"].includes(t.step))
        t.step = "checking";
      if (
        t.user &&
        blocked(c) &&
        !["ready", "refusal", "txlist", "txdetail"].includes(t.step)
      ) {
        t.sale = null;
        go(t, "ready");
      }
      const fn = SCREENS[t.step] || scReady;
      return fn(t, c) + dialogHtml(t);
    },
    side: ({ terminal }) => {
      const t = T(terminal);
      const s = t.slip;
      if (!s) return "";
      let label, html;
      if (s.kind === "receipt") {
        const tx =
          P.db.tx.find((x) => x.no === s.no && x.terminal === terminal) ||
          P.txByNo(s.no);
        label = s.copy ? "Receipt copy printed" : "Receipt printed";
        html = receiptHtml(tx, s.copy);
      } else if (s.kind === "balance") {
        label = "Balance slip printed";
        html = balanceSlipHtml(s);
      } else {
        label = s.copy ? "Void slip copy printed" : "Void slip printed";
        html = voidSlipHtml(s, s.copy);
      }
      return `<div class="p-slip"><p class="p-label">${esc(label)}</p><div class="mock-slip">${html}</div></div>`;
    },
  });

  /* ---------- actions ---------- */
  const A = {};
  const withT = (fn) => (v, el) => {
    const t = cur();
    if (!t) return;
    t.tapLine = "";
    fn(t, ctx(t.serial), v, el);
  };
  function signedInOK(t, c, u) {
    t.user = u.key;
    t.pick = null;
    t.newPass = null;
    t.notice = "";
    u.fails = 0;
    P.audit(
      "Signed in",
      `Counter Terminal ${t.serial}, ${short(u)}, ${u.role}`,
    );
    P.mark("ctSignedIn");
    go(t, t.checking ? "checking" : "ready");
  }
  const badPattern = (s) =>
    /^(\d)\1{5}$/.test(s) ||
    "0123456789".includes(s) ||
    "9876543210".includes(s);
  Object.assign(A, {
    pickUser: (t, c, v) => {
      t.pick = v || null;
      t.newPass = null;
      t.buf = "";
      t.err = "";
    },
    key: (t, c, v) => {
      if (t.buf.length >= 6) return;
      t.buf += v;
      t.err = t.step === "auth" ? t.err : "";
      if (t.step === "auth" && t.buf.length === 6) authCheck(t, c);
    },
    del: (t) => {
      t.buf = t.buf.slice(0, -1);
    },
    signInGo: (t, c) => {
      const u = staffList(c).find((x) => x.key === t.pick);
      if (!u || t.buf.length < 6) return;
      if (t.newPass) {
        if (t.newPass.stage === 1) {
          if (badPattern(t.buf)) {
            t.buf = "";
            t.err =
              "Choose a different passcode. Do not use a pattern like 111111 or 123456.";
            return;
          }
          t.newPass = { stage: 2, first: t.buf };
          t.buf = "";
          t.err = "";
          return;
        }
        if (t.buf !== t.newPass.first) {
          t.newPass = { stage: 1 };
          t.buf = "";
          t.err = "The two passcodes did not match. Start again.";
          return;
        }
        u.passcode = t.buf;
        u.temp = false;
        P.audit("Set own passcode", `${u.name}, Counter Terminal ${t.serial}`);
        signedInOK(t, c, u);
        return;
      }
      if (t.buf !== u.passcode) {
        u.fails = (u.fails || 0) + 1;
        t.buf = "";
        t.err = "Wrong passcode.";
        P.audit("Failed sign-in", `Counter Terminal ${t.serial}, ${u.name}`);
        if (u.fails >= 5) {
          u.status = "locked";
          P.audit("Account locked after 5 failed sign-ins", u.name);
        }
        return;
      }
      if (u.temp) {
        t.newPass = { stage: 1 };
        t.buf = "";
        t.err = "";
        return;
      }
      signedInOK(t, c, u);
    },
    switchUser: (t, c) => {
      const u = user(t);
      if (u) P.audit("Signed out", `Counter Terminal ${t.serial}, ${short(u)}`);
      t.user = null;
      t.pick = null;
      t.sale = null;
      t.bene = null;
      t.notice = "";
      go(t, "signin");
    },
    home: (t) => {
      t.notice = "";
      go(t, "ready");
    },
    done: (t) => {
      t.sale = null;
      t.bene = null;
      t.notice = "";
      t.notDone = null;
      go(t, "ready");
    },
    balanceSlip: (t, c) => {
      const b = P.bene(t.bene),
        u = user(t);
      const ok = print(t, {
        kind: "balance",
        bene: b.key,
        branch: c.br.id,
        when: P.stamp(),
        av: P.available(b),
        pend: P.pending(b),
        staff: short(u),
      });
      if (!ok) {
        P.toast(
          "Balance slip not printed",
          "Load paper, then press Print balance slip.",
        );
        return;
      }
      P.audit("Printed balance slip", `${b.name}, ${P.branchName(c.br.id)}`);
      P.mark("ctBalanceSlip");
    },
    startSale: (t, c) => {
      if (t.offline) return;
      const b = P.bene(t.bene);
      if (P.available(b) <= 0) return;
      t.slip = null;
      t.notice = "";
      t.sale = {
        no: saleNo(c.br.id),
        lines: [],
        edit: null,
        rx: { name: "", license: "", day: "", month: "", year: "" },
        discount: "",
        noDisc: false,
        noDiscReason: "",
        noDiscOther: "",
        presenter: "bene",
      };
      P.mark("ctSaleStarted");
      go(t, "lines");
    },
    addLine: (t) => {
      t.sale.edit = { i: null, name: "", qty: "", price: "" };
      go(t, "line");
    },
    editLine: (t, c, v) => {
      const [n, q, p] = t.sale.lines[+v];
      t.sale.edit = { i: +v, name: n, qty: String(q), price: String(p) };
      go(t, "line");
    },
    pickItem: (t, c, v) => {
      const e = t.sale.edit;
      e.name = v;
      const it = P.ITEMS.find(([n]) => n === v);
      if (it && !e.price) e.price = it[1].toFixed(2);
      if (!e.qty) e.qty = /Insulin|syrup/.test(v) ? "1" : "30";
    },
    pickCategory: (t, c, v) => {
      t.sale.edit.name = v;
    },
    saveLine: (t, c) => {
      const e = t.sale.edit,
        ph = isPharmacy(c);
      const l = ph
        ? [String(e.name).trim(), P.num(e.qty), P.num(e.price)]
        : [e.name, 1, P.num(e.price)];
      if (!l[0] || !(l[1] > 0) || !(l[2] > 0)) return;
      if (e.i == null) t.sale.lines.push(l);
      else t.sale.lines[e.i] = l;
      t.sale.edit = null;
      go(t, "lines");
    },
    removeLine: (t) => {
      t.sale.lines.splice(t.sale.edit.i, 1);
      t.sale.edit = null;
      go(t, "lines");
    },
    lineBack: (t) => {
      t.sale.edit = null;
      go(t, "lines");
    },
    linesNext: (t, c) => {
      if (!t.sale.lines.length || t.offline) return;
      if (isPharmacy(c)) {
        const rx = t.sale.rx;
        if (!rx.name) {
          const last = P.db.tx
            .filter((x) => x.branch === c.br.id && x.rx && x.rx.name)
            .pop();
          if (last) {
            rx.name = last.rx.name;
            rx.license = last.rx.license;
          }
        }
        go(t, "rx");
      } else afterRx(t);
    },
    pickRx: (t, c, v) => {
      const rx = t.sale.rx;
      rx.name = v;
      const m = P.db.tx.find((x) => x.rx && x.rx.name === v);
      if (m && !rx.license) rx.license = m.rx.license;
    },
    rxToday: (t) => {
      Object.assign(t.sale.rx, { day: "11", month: "11", year: "2026" });
    },
    rxNext: (t) => {
      const rx = t.sale.rx;
      if (!(rx.name && rx.license && rx.day && rx.month && rx.year)) return;
      rx.date = `${String(rx.day).padStart(2, "0")}/${String(rx.month).padStart(2, "0")}/${rx.year}`;
      afterRx(t);
    },
    discMode: (t, c, v) => {
      t.sale.noDisc = v === "none";
    },
    noDiscReason: (t, c, v) => {
      t.sale.noDiscReason = v;
    },
    toSummary: (t) => {
      if (discountProblem(t)) return;
      P.mark("ctSummary");
      go(t, "summary");
    },
    step: (t, c, v) => {
      if (v === "presenter") {
        if (t.offline || totals(t).credits <= 0) return;
      }
      if (v === "summary") P.mark("ctSummary");
      go(t, v);
    },
    presenter: (t, c, v) => {
      t.sale.presenter = v;
    },
    photoNoMatch: (t, c) => {
      const b = P.bene(t.bene);
      P.audit(
        "Sale stopped: photo does not match",
        `Sale ${t.sale.no}, ${b.name}, ${P.branchName(c.br.id)}`,
      );
      t.sale = null;
      t.bene = null;
      t.notice = "Sale stopped. No Credits were deducted.";
      go(t, "ready");
    },
    cancelSale: (t) => {
      t.dialog = {
        title: "Cancel this sale?",
        body: "No Credits have been deducted.",
        ok: "Cancel sale",
        kind: "destructive",
        cancel: "Keep going",
        act: "cancelSaleYes",
      };
    },
    cancelSaleYes: (t) => {
      t.sale = null;
      t.bene = null;
      t.notice = "Sale cancelled. No Credits were deducted.";
      go(t, "ready");
    },
    dialogOk: (t, c) => {
      const d = t.dialog;
      t.dialog = null;
      if (d && d.act) A[d.act](t, c, d.v);
    },
    dialogCancel: (t) => {
      t.dialog = null;
    },
    toPin: (t) => {
      if (t.offline) return;
      P.mark("ctPresented");
      go(t, "pin");
    },
    pinCancel: (t) => go(t, "summary"),
    pinConfirm: (t, c) => {
      if (t.buf.length < 6) return;
      const b = P.bene(t.bene),
        card = P.card(b);
      if (t.buf !== b.pin) {
        b.pinTries = Math.max((b.pinTries || 5) - 1, 0);
        t.buf = "";
        P.audit(
          "Wrong PIN entered",
          `${b.name}, ${P.branchName(c.br.id)}, ${triesText(b.pinTries)}`,
        );
        P.mark("ctWrongPin");
        if (b.pinTries <= 0) {
          if (card) card.status = "locked";
          P.audit(
            "Card locked after 5 wrong PINs",
            `${b.name}, Card ${card ? card.no : ""}`,
          );
          go(t, "locked");
        } else go(t, "wrongpin");
        return;
      }
      b.pinTries = 5;
      const r = refusalFor(b, c);
      if (r) {
        t.refusal = r;
        t.sale = null;
        go(t, "refusal");
        return;
      }
      if (P.available(b) <= 0) {
        t.sale = null;
        t.notice =
          "No Credits were deducted. The Available Balance is now zero.";
        go(t, "identity");
        return;
      }
      go(t, "confirming");
      const drop = t.dropNext;
      t.dropNext = false;
      const sale = JSON.parse(JSON.stringify(t.sale)),
        beneKey = t.bene,
        serial = t.serial;
      P.later(900, () => {
        const tt = T(serial);
        if (tt !== t || t.step !== "confirming") return;
        if (drop) {
          t.checking = { sale, bene: beneKey };
          t.offline = true;
          go(t, "checking");
          P.audit(
            "Connection lost during confirmation",
            `Sale ${sale.no}, ${P.branchName(c.br.id)}`,
          );
        } else recordSale(t, c, sale, beneKey);
      });
    },
    lockedDone: (t, c) => {
      t.refusal = 2;
      t.sale = null;
      go(t, "refusal");
    },
    printReceipt: (t) => {
      const tx = P.db.tx.find(
        (x) => x.no === t.lastTx && x.terminal === t.serial,
      );
      if (!print(t, { kind: "receipt", no: tx.no })) {
        P.toast("Receipt not printed", "Load paper, then press Print Receipt.");
        return;
      }
      tx.prints = (tx.prints || 0) + 1;
      t.receiptPending = false;
      P.audit("Printed Receipt", `Transaction ${tx.no}`);
    },
    enterAgain: (t, c) => {
      const nd = t.notDone;
      if (!nd) return;
      const res = P.S.ct._reserved || (P.S.ct._reserved = {});
      res[c.br.id] = Math.max(res[c.br.id] || 0, +nd.sale.no);
      t.bene = nd.bene;
      t.sale = Object.assign(nd.sale, { no: saleNo(c.br.id) });
      t.notDone = null;
      go(t, "summary");
    },
    txList: (t) => {
      t.findErr = "";
      t.txNo = null;
      t.voidSt = null;
      t.auth = null;
      t.printFail = false;
      go(t, "txlist");
    },
    openTx: (t, c, v) => {
      const tx = P.db.tx.find((x) => x.no === v && x.branch === c.br.id);
      if (!tx) return;
      const u = user(t);
      t.printFail = false;
      if (
        !canAuthorize(u) &&
        !(tx.staffKey === u.key || (!tx.staffKey && tx.staff === short(u)))
      ) {
        t.auth = { kind: "view", no: tx.no, pick: null };
        go(t, "auth");
        return;
      }
      t.txNo = tx.no;
      go(t, "txdetail");
    },
    findTx: (t, c) => {
      const no = String(t.findNo || "")
        .trim()
        .padStart(4, "0");
      const tx = P.db.tx.find((x) => x.no === no && x.branch === c.br.id);
      if (!tx) {
        t.findErr = no;
        return;
      }
      t.findErr = "";
      A.openTx(t, c, no);
    },
    reprint: (t, c) => {
      const tx = P.db.tx.find((x) => x.no === t.txNo && x.branch === c.br.id),
        u = user(t);
      const own =
        tx.staffKey === u.key || (!tx.staffKey && tx.staff === short(u));
      if (!tx.prints) {
        /* never printed: the first print is the original */
        if (!print(t, { kind: "receipt", no: tx.no })) {
          t.printFail = true;
          return;
        }
        tx.prints = 1;
        t.printFail = false;
        if (t.lastTx === tx.no) t.receiptPending = false;
        P.audit("Printed Receipt", `Transaction ${tx.no}`);
        return;
      }
      if (canAuthorize(u) || (own && isToday(tx))) doReprint(t, tx, null);
      else {
        t.auth = { kind: "reprint", no: tx.no, pick: null };
        go(t, "auth");
      }
    },
    printVoidSlip: (t, c) => {
      const tx = P.db.tx.find((x) => x.no === t.txNo && x.branch === c.br.id);
      if (!print(t, { kind: "void", no: tx.no, copy: !!tx.voidPrints })) {
        t.voidSlipPending = true;
        P.toast(
          "Void slip not printed",
          "Load paper, then press Print Void slip.",
        );
        return;
      }
      tx.voidPrints = (tx.voidPrints || 0) + 1;
      t.voidSlipPending = false;
      P.audit(
        tx.voidPrints > 1 ? "Printed Void slip copy" : "Printed Void slip",
        `Transaction ${tx.no}`,
      );
    },
    startVoid: (t, c) => {
      const tx = P.db.tx.find((x) => x.no === t.txNo && x.branch === c.br.id);
      if (!canVoid(tx)) return;
      t.voidSt = { reason: "", other: "" };
      go(t, "void");
    },
    voidReason: (t, c, v) => {
      t.voidSt.reason = v;
    },
    voidNext: (t, c) => {
      if (voidProblem(t)) return;
      const u = user(t);
      if (canAuthorize(u)) {
        askVoid(t, c, null);
        return;
      } /* a manager or Head Office user signed in voids in place */
      t.auth = { kind: "void", no: t.txNo, pick: null };
      go(t, "auth");
    },
    authPick: (t, c, v) => {
      t.auth.pick = v;
      t.buf = "";
      t.err = "";
    },
    authCancel: (t, c) => {
      const a = t.auth;
      t.auth = null;
      if (a && a.kind === "view") go(t, "txlist");
      else go(t, "txdetail");
    },
    voidYes: (t, c, authKey) => {
      const tx = P.db.tx.find((x) => x.no === t.txNo && x.branch === c.br.id),
        u = user(t),
        b = P.bene(tx.bene);
      const az = authKey
        ? P.db.institutionUsers.find((x) => x.key === authKey)
        : null;
      tx.status = "voided";
      tx.voidReason =
        t.voidSt.reason === "Other"
          ? `Other: ${t.voidSt.other}`
          : t.voidSt.reason;
      tx.voidBy = short(u);
      tx.voidAuth = az ? short(az) : "";
      tx.voidWhen = P.stamp();
      tx.voidAfter = P.available(b);
      tx.voidPend = P.pending(b);
      P.audit(
        "Transaction voided",
        `Transaction ${tx.no}, ${fmt(tx.credits)} Credits returned to ${b.name}, by ${tx.voidBy}${az ? `, authorized by ${az.name}` : ""}. Reason: ${tx.voidReason}`,
      );
      P.mark("ctVoided");
      const ok = print(t, { kind: "void", no: tx.no });
      t.voidSlipPending = !ok;
      if (ok) tx.voidPrints = 1;
      t.auth = null;
      go(t, "voided");
    },
  });
  function afterRx(t) {
    const b = P.bene(t.bene);
    if (needsDiscount(b)) {
      if (t.sale.discount === "")
        t.sale.discount = (totals(t).total * 0.2).toFixed(2);
      go(t, "discount");
    } else {
      P.mark("ctSummary");
      go(t, "summary");
    }
  }
  function doReprint(t, tx, az) {
    if (!print(t, { kind: "receipt", no: tx.no, copy: true })) {
      t.printFail = true;
      P.toast("Receipt not printed", "Load paper, then press Print copy.");
      return;
    }
    t.printFail = false;
    tx.prints = (tx.prints || 0) + 1;
    P.audit(
      "Reprinted Receipt (COPY)",
      `Transaction ${tx.no}${az ? `, authorized by ${az.name}` : ""}`,
    );
    P.mark("ctReprinted");
  }
  function askVoid(t, c, authKey) {
    const tx = P.db.tx.find((x) => x.no === t.txNo && x.branch === c.br.id);
    t.dialog = {
      title: `Void Transaction ${tx.no}?`,
      body: `${fmt(tx.credits)} Credits return to the Beneficiary. This cannot be undone.`,
      ok: "Void Transaction",
      kind: "destructive",
      act: "voidYes",
      v: authKey,
    };
  }
  function authCheck(t, c) {
    const a = t.auth,
      az = P.db.institutionUsers.find((x) => x.key === a.pick);
    if (!az) return;
    if (t.buf !== az.passcode) {
      az.fails = (az.fails || 0) + 1;
      t.buf = "";
      t.err = "Wrong passcode.";
      P.audit(
        "Wrong passcode in Authorize panel",
        `${az.name}, Counter Terminal ${t.serial}`,
      );
      if (az.fails >= 5) {
        az.status = "locked";
        P.audit("Account locked after 5 failed sign-ins", az.name);
      }
      return;
    }
    az.fails = 0;
    t.buf = "";
    t.err = "";
    const tx = P.db.tx.find((x) => x.no === a.no && x.branch === c.br.id);
    P.audit(
      "Authorized on Counter Terminal",
      `${a.kind === "void" ? "Void" : a.kind === "reprint" ? "Reprint" : "View"} of Transaction ${a.no}, by ${az.name} with ${short(user(t))}`,
    );
    if (a.kind === "void") {
      t.auth = Object.assign({}, a, { ok: true });
      go(t, "txdetail");
      t.txNo = tx.no;
      askVoid(t, c, az.key);
      t.step = "void";
      return;
    }
    t.auth = null;
    t.txNo = tx.no;
    go(t, "txdetail");
    if (a.kind === "reprint") doReprint(t, tx, az);
  }

  /* Tap handling */
  function tap(t, c, beneKey, copied) {
    if (!t.user) {
      P.toast(
        "Sign in first",
        "Pick a name on the Counter Terminal and enter the passcode.",
      );
      return;
    }
    if (t.step !== "ready") {
      t.tapLine = "Finish or cancel this sale first.";
      return;
    }
    if (blocked(c)) {
      t.refusal = 3;
      P.audit(
        "Tap refused",
        `Counter Terminal ${t.serial}: Branch or Counter Terminal cannot record sales`,
      );
      go(t, "refusal");
      return;
    }
    if (t.offline) {
      t.notice = "No connection. No sales can be recorded.";
      return;
    }
    t.notice = "";
    t.slip = null;
    t.sale = null;
    t.bene = null;
    go(t, "reading");
    const serial = t.serial;
    P.later(900, () => {
      if (T(serial) !== t || t.step !== "reading") return;
      if (copied) {
        t.refusal = 1;
        P.db.flags.unshift({
          id: "f-" + Date.now(),
          kind: "Card not genuine",
          detail: "A copied card was tapped and refused.",
          tx: null,
          bene: null,
          branch: c.br.id,
          when: P.TODAY,
          status: "new",
          note: "",
        });
        P.audit(
          "Tap refused: card not genuine",
          `${P.branchName(c.br.id)}, Counter Terminal ${t.serial}. Flag raised`,
        );
        P.mark("ctCopyRefused");
        go(t, "refusal");
        return;
      }
      const b = P.bene(beneKey);
      const r = refusalFor(b, c);
      if (r) {
        t.refusal = r;
        P.audit(
          "Tap refused",
          `Card of ${b ? b.name : "unknown"}, ${P.branchName(c.br.id)}`,
        );
        go(t, "refusal");
        return;
      }
      t.bene = b.key;
      P.audit(
        "Card tapped",
        `${b.name}, ${P.branchName(c.br.id)}, Counter Terminal ${t.serial}`,
      );
      P.mark("ctTapped");
      go(t, "identity");
    });
  }

  /* Simulation */
  Object.assign(A, {
    simTap: (t, c, v) => tap(t, c, v, false),
    simCopy: (t, c) => tap(t, c, null, true),
    simDrop: (t) => {
      t.dropNext = !t.dropNext;
    },
    simPaper: (t) => {
      t.paperOut = !t.paperOut;
      P.audit(
        t.paperOut ? "Printer out of paper" : "Printer paper loaded",
        `Counter Terminal ${t.serial}`,
      );
    },
    simOffline: (t) => {
      if (t.checking) return;
      t.offline = !t.offline;
    },
    simBattery: (t) => {
      t.battery = t.battery <= 15 ? 82 : 15;
    },
    simResolve: (t, c, v) => {
      const ch = t.checking;
      if (!ch) return;
      t.checking = null;
      t.offline = false;
      P.mark("ctInterruptedResolved");
      if (v === "yes") {
        recordSale(t, c, ch.sale, ch.bene);
        P.audit("Interrupted sale checked: completed", `Sale ${ch.sale.no}`);
      } else {
        t.notDone = ch;
        P.audit(
          "Interrupted sale checked: not completed",
          `Sale ${ch.sale.no}. No Credits were deducted`,
        );
        go(t, "notCompleted");
      }
    },
  });
  Object.keys(A).forEach((k) => P.action("ct." + k, withT(A[k])));

  /* Helpers for journeys */
  P.ct = {
    state: T,
    ctx,
    signIn: (serial, userKey) => {
      const t = T(serial),
        c = ctx(serial),
        u = P.db.institutionUsers.find((x) => x.key === userKey);
      if (u && !blocked(c)) {
        t.pick = u.key;
        signedInOK(t, c, u);
      }
    },
    tap: (serial, beneKey) => {
      const t = T(serial);
      tap(t, ctx(serial), beneKey, false);
    },
  };

  /* Physical keyboard on PIN screens */
  const prevKey = P.onKey;
  P.onKey = (e) => {
    const t = cur();
    if (
      t &&
      !(e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))
    ) {
      const pad =
        PAD_STEPS.includes(t.step) ||
        (t.step === "signin" && t.pick) ||
        (t.step === "auth" && t.auth && t.auth.pick);
      if (pad && !t.dialog) {
        const c = ctx(t.serial);
        if (/^[0-9]$/.test(e.key)) {
          e.preventDefault();
          A.key(t, c, e.key);
          return true;
        }
        if (e.key === "Backspace") {
          e.preventDefault();
          A.del(t);
          return true;
        }
        if (e.key === "Enter") {
          e.preventDefault();
          if (t.step === "pin") A.pinConfirm(t, c);
          else if (t.step === "signin") A.signInGo(t, c);
          return true;
        }
      }
    }
    return prevKey ? prevKey(e) : false;
  };

  /* Guide panel: simulation controls while a Counter Terminal persona is active */
  const prevGuide = P.guideExtra;
  P.guideExtra = () => {
    const before = prevGuide ? prevGuide() : "";
    const t = cur();
    if (!t) return before;
    const c = ctx(t.serial);
    const keysList = [
      P.S.journeyBene,
      "b-ernesto",
      "b-lorna",
      "b-gloria",
      "b-teresita",
      "b-corazon",
    ].filter((k, i, a) => k && a.indexOf(k) === i && P.bene(k));
    const sb = (label, a, v, on) =>
      `<button class="p-btn" type="button" data-a="${a}"${v ? ` data-v="${esc(v)}"` : ""}${on != null ? ` aria-pressed="${on}"` : ""}>${ic("nfc")}${esc(label)}</button>`;
    const taps =
      keysList
        .map((k) => sb(`Tap ${P.bene(k).name}'s Card`, "ct.simTap", k))
        .join("") + sb("Tap a copied card", "ct.simCopy");
    const dev =
      `<button class="p-btn" type="button" data-a="ct.simDrop" aria-pressed="${t.dropNext}">${ic("wifi-off")}${t.dropNext ? "Connection drops on the next sale (armed)" : "Drop the connection on the next sale"}</button>` +
      `<button class="p-btn" type="button" data-a="ct.simPaper" aria-pressed="${t.paperOut}">${ic("printer")}${t.paperOut ? "Load paper" : "Printer out of paper"}</button>` +
      (t.checking
        ? ""
        : `<button class="p-btn" type="button" data-a="ct.simOffline" aria-pressed="${t.offline}">${ic(t.offline ? "wifi" : "wifi-off")}${t.offline ? "Bring the connection back" : "Lose the connection now"}</button>`) +
      `<button class="p-btn" type="button" data-a="ct.simBattery">${ic("battery-medium")}${t.battery <= 15 ? "Charge the battery" : "Battery at 15%"}</button>`;
    const resolve = t.checking
      ? `<div class="p-box"><p class="p-label">Connection returns</p><button class="p-btn" type="button" data-a="ct.simResolve" data-v="yes">${ic("check")}The sale went through</button><button class="p-btn" type="button" data-a="ct.simResolve" data-v="no">${ic("x")}The sale did not go through</button></div>`
      : "";
    const staff = staffList(c)
      .map(
        (u) =>
          `${esc(short(u))} (${esc(u.role)}) <b>${esc(u.passcode)}</b>${u.temp ? " temporary" : ""}${u.status === "locked" ? ", locked" : ""}`,
      )
      .join("<br>");
    const pins = keysList
      .map((k) => {
        const b = P.bene(k);
        const card = P.card(b);
        return `${esc(b.name)} <b>${esc(b.pin || "none")}</b>${card && card.status !== "issued" ? `, Card ${esc(card.status)}` : ""}${b.status !== "active" ? `, ${esc(b.status)}` : ""}`;
      })
      .join("<br>");
    return `${before}<div class="p-box"><p class="p-label">Simulate on this Counter Terminal</p>${taps}${dev}</div>${resolve}<p class="p-hint">Demo only, never shown in the product.<br><u>Staff passcodes</u><br>${staff || "No one can sign in here."}<br><u>Beneficiary PINs</u><br>${pins}<br>PIN keys on your keyboard work on PIN screens. To see "No Credits available.", sell more than the balance (for example 10 Insulin pens), then tap the same Card again.</p>`;
  };

  /* Module state lives in P.S.ct, which Start over replaces, so no onReset hook is needed. */
  /* Institution suspended or revoked mid-session: refusal 3 shows on CT-01 via blocked(). */
})();

</script>
    <script>
/* Agapay clickable prototype: guided journeys.
   UJ-1 to UJ-11 from EXPERIENCE.md Key Flows, then the compact flows. Each step names who does it and where,
   and is ticked from P.mark flags the screen modules set, or from the data itself. */
(() => {
  "use strict";
  const has = (k) => P.has(k);
  const seen = (persona, screen) => has(`v:${persona}:${screen}`);
  const jb = () => P.S.journeyBene && P.bene(P.S.journeyBene);
  const firstName = () => (jb() ? jb().name.split(" ")[0] : "Remedios");

  /* Record every screen each persona has opened, so "look at X" steps can tick */
  P.beforeRender = (P.beforeRender || []).concat(() => {
    const p = P.persona();
    P.mark(`v:${p.key}:${p.app === "ct" ? "CT" : P.cur()}`);
  });

  /* Journeys after UJ-1 need Remedios enrolled, with Ana and a working Card. Create her if the viewer skipped UJ-1. */
  function ensureRemedios() {
    if (jb()) return jb();
    const db = P.db;
    const key = "b-remedios";
    db.benes.push({
      key,
      name: "Remedios Dela Cruz",
      pid: P.nextPid(),
      age: 68,
      birth: "14/03/1958",
      sex: "Female",
      category: "senior citizen",
      muni: "San Isidro",
      brgy: "Poblacion",
      phone: "0917 555 0142",
      idType: "Senior Citizen ID",
      idNo: "SC-SI-0193-58",
      status: "active",
      statusReason: "",
      reps: [{ name: "Ana Dela Cruz", rel: "Daughter", added: P.TODAY }],
      cards: [
        {
          no: "AGP-REM-1",
          status: "issued",
          issued: P.TODAY,
          by: "Tess, card officer",
        },
      ],
      pin: "246810",
      pinTries: 5,
      consent: P.TODAY,
      enrolled: P.TODAY,
      nextRecheck: "11 Nov 2027",
      history: [
        {
          when: P.TODAY + ", 9:05 AM",
          what: "Enrolled.",
          by: "Jun, enrollment officer",
