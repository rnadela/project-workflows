  /* ======================================================================
   AD-26 Transaction detail (panel)
   ====================================================================== */
  P.panel("AD-26", ({ no, flag }) => {
    const t = P.txByNo(no);
    if (!t)
      return {
        title: "Transaction",
        body: stateMsg("circle-alert", "Transaction not found", ""),
        footer: btn("Close", "closePanel"),
      };
    const b = P.bene(t.bene),
      br = P.branch(t.branch),
      st = t.stmt && P.statement(t.stmt);
    const pr = pendingRev(no),
      lr = lastRev(no);
    const lines = table(
      "Sale lines",
      ["Item or service", "Quantity", "Unit price$", "Amount$"],
      t.lines.map(
        ([n, q, p]) =>
          `<tr><th scope="row">${esc(n)}</th><td class="tabular">${int(q)}</td>${amt(peso(p))}${amt(peso(q * p))}</tr>`,
      ),
    );
    let notes = "";
    if (t.hold && t.status === "held")
      notes += alert(
        "Held",
        `${esc(t.hold.reason)}<br><span class="text-muted">${esc(t.hold.by)}, ${esc(t.hold.when)}. The Branch is not paid for this sale while it is held.</span>`,
        "lock",
      );
    if (pr)
      notes += alert(
        "Reversal waiting for approval",
        `Submitted by ${esc(pr.by)}, ${esc(pr.when)}. ${esc(pr.payload.reason || "")} ${link("Open in Approvals", "AD-18", { item: pr.id })}`,
        "info",
      );
    else if (t.status === "reversed")
      notes += alert(
        "Reversed",
        `${fmt(t.credits)} Credits went back to ${esc(beneName(t))}. ${t.revDeduct ? `It is deducted on the ${esc((P.statement(t.revDeduct) || {}).period || "next")} statement.` : "The Branch is never paid for this sale."}`,
        "rotate-ccw",
        true,
      );
    else if (lr && lr.status === "rejected")
      notes += alert(
        "Reversal rejected",
        `${esc(lr.decidedBy || "An approver")}: ${esc(lr.comment || "No comment.")} The Transaction stays ${esc(t.status)}.`,
        "circle-alert",
      );
    const body = `${flag ? `<p>${actionLink("Back to the Flag", "fl.open", flag)}</p>` : ""}<div class="row">${position(t)}</div>${notes}
    ${detail([
      ["Date and time", esc(t.when)],
      [
        "Institution and Branch",
        br ? link(P.branchName(t.branch), "AD-20", { inst: br.inst.id }) : "",
      ],
      [
        "Beneficiary",
        b ? link(b.name, "AD-02", { bene: b.key, tab: "Transactions" }) : "",
      ],
      ["Program ID number", esc(b ? b.pid : "")],
      ["Presented by", esc(t.presenter)],
      ["Institution User", esc(t.staff)],
      [
        "Settlement Statement",
        st
          ? link(`${st.period} (${st.stage})`, "AD-24", { id: st.id })
          : t.status === "held"
            ? "Off the statement while held"
            : "Not on a statement yet",
      ],
      [
        "Prescription",
        esc(t.rx ? `${t.rx.name}, license ${t.rx.license}` : "None"),
      ],
    ])}
    <h3 class="panel__title">Sale lines</h3>${lines}
    ${detail([
      ["Total", peso(t.total)],
      ["Discount", peso(t.discount)],
      ["Credits deducted", fmt(t.credits) + " Credits"],
      ["Cash paid", peso(t.cash)],
    ])}`;
    let footer;
    if (fin()) {
      const hOff = t.status === "held" ? canRelease(t) : canHold(t),
        rOff = canReverse(t);
      const reason =
        (ui().err["st.hold"] || ui().err["st.release"]) && hOff
          ? reasonOff(hOff)
          : ui().err["st.reverse"] && rOff
            ? reasonOff(rOff)
            : hOff && rOff
              ? reasonOff(rOff)
              : "";
      footer = `${reason}${btn("Close", "closePanel")}${t.status === "held" ? btn("Release Hold", "st.release", { v: no, off: !!hOff }) : ["reversed", "voided"].includes(t.status) ? "" : btn("Place Hold", "st.hold", { v: no, off: !!hOff })}${t.status === "reversed" ? "" : btn("Submit Reversal", "st.reverse", { kind: "primary", v: no, off: !!rOff })}`;
    } else
      footer = `<span class="text-muted">View only. A finance officer places Holds and submits Reversals.</span>${btn("Close", "closePanel")}`;
    return { title: "Transaction " + no, body, footer };
  });

  /* ======================================================================
   Analytics (AD-27 to AD-30)
   ====================================================================== */
  const RANGES = [
    ["ytd", "1 Jan to 11 Nov 2026"],
    ["q4", "1 Oct to 11 Nov 2026"],
    ["nov", "1 to 11 Nov 2026"],

  const SCALE = { ytd: 1, q4: 0.165, nov: 0.035 };
  const rangeOf = () => F("rp.range") || "ytd";
  const rangeLabel = () => RANGES.find((r) => r[0] === rangeOf())[1];
  const rangeField = () => field("Date range", select("form.rp.range", RANGES));
  const CATS = ["senior citizen", "PWD", "solo parent", "indigent"];
  const CAT_SHARE = {
    "senior citizen": 0.74,
    PWD: 0.15,
    "solo parent": 0.08,
    indigent: 0.03,
  };
  const SMALL = { "Dalisay|indigent": 3, "Malinis|solo parent": 4 };
  const CENT = {
    "San Isidro": 4,
    "Santa Rosa": 3,
    "Bagong Silang": 2,
    Malinis: 2,
    Dalisay: 3,
  };
  const FEM = {
    "senior citizen": 0.57,
    PWD: 0.46,
    "solo parent": 0.81,
    indigent: 0.52,
  };
  const AGES = [
    "under 60",
    "60 to 69",
    "70 to 79",
    "80 to 89",
    "90 to 99",
    "100 and over",
  ];

    s: [0, 0.46, 0.34, 0.155, 0.045],
    o: [0.78, 0.14, 0.06, 0.02, 0],
  };
  const muniTotal = (m) =>
    Math.round(
      (18402 * P.MUNI_COUNTS[m]) /
        Object.values(P.MUNI_COUNTS).reduce((a, b) => a + b, 0),
    );
  const catCount = (m, c) =>
    SMALL[m + "|" + c] ?? Math.round(muniTotal(m) * CAT_SHARE[c]);
  function cells() {
    const out = [];
    P.MUNIS.forEach((m) =>
      CATS.forEach((c) => {
        const n = catCount(m, c),
          sen = c === "senior citizen";
        AGES.forEach((ag, i) => {
          const an =
            ag === "100 and over"
              ? sen
                ? CENT[m]
                : 0
              : (n - (sen ? CENT[m] : 0)) * AGE_SHARE[sen ? "s" : "o"][i];
          ["Female", "Male"].forEach((sx) =>
            out.push({
              m,
              c,
              ag,
              sx,
              v: an * (sx === "Female" ? FEM[c] : 1 - FEM[c]),
            }),
          );
        });
      }),
    );
    return out;
  }
  const suppress = (n) => (analyst() && n > 0 && n < 5 ? null : n);
  const figure = (n) => (n == null ? "fewer than 5" : int(n));
  function bars(title, rows, f = int) {
    const w = 560,
      rowH = 30,
      lab = 140,
      right = 100,
      h = rows.length * rowH + 10;
    const max = Math.max(1, ...rows.map((r) => Math.max(r[1] || 0, r[2] || 0)));
    const sc = (v) => ((w - lab - right) * v) / max;
    const g = rows
      .map(([l, v, prev], i) => {
        const y = i * rowH + 4;
        return `<text class="chart-panel__axis" x="0" y="${y + 14}" style="fill:var(--color-foreground)">${esc(l)}</text>${prev != null ? `<rect class="chart-panel__bar-previous" x="${lab}" y="${y + 19}" width="${Math.max(sc(prev), 1)}" height="6" fill="none"/>` : ""}${v == null ? `<text class="chart-panel__axis" x="${lab}" y="${y + 14}">fewer than 5</text>` : `<rect class="chart-panel__bar-current" x="${lab}" y="${y + 3}" width="${Math.max(sc(v), 1)}" height="14" rx="2"/><text class="chart-panel__axis" x="${lab + sc(v) + 6}" y="${y + 14}">${esc(f(v))}</text>`}`;
      })
      .join("");
    return `<div class="table-wrap"><svg class="chart-panel__chart" viewBox="0 0 ${w} ${h}" style="min-width:420px" role="img" aria-label="${esc(title)}">${g}</svg></div>`;
  }
  /* Chart panel with chart/table switch and Export. rows: [label, value|null, previous?] */
  function chart(key, title, rows, o = {}) {
    const view = P.tab("chart-" + key, "chart"),
      f = o.fmt || int,
      hasPrev = rows.some((r) => r[2] != null);
    const cols = [o.col || "Group", (o.valueCol || "Value") + "$"].concat(
      hasPrev ? [(o.prevCol || "Same period last year") + "$"] : [],
    );
    const tbl = table(
      title,
      cols,
      rows.map(
        ([l, v, p]) =>
          `<tr><th scope="row">${esc(l)}</th>${amt(v == null ? "fewer than 5" : esc(f(v)))}${hasPrev ? amt(p == null ? "" : esc(f(p))) : ""}</tr>`,
      ),
    );
    return `<section class="chart-panel" aria-label="${esc(title)}"><div class="chart-panel__header"><h3 class="chart-panel__title">${esc(title)}</h3><div class="button-row">${btn(view === "chart" ? "View as table" : "View as chart", "rp.view", { v: key })}${btn("Export", "rp.export", { icon: "download", data: { title, filters: o.filters || "None", range: o.range || rangeLabel() } })}</div></div>${o.summary ? `<p class="chart-panel__summary">${esc(o.summary)}</p>` : ""}${hasPrev && view === "chart" ? '<p class="text-muted">Solid bar: this period. Outlined bar: the same period last year.</p>' : ""}${view === "chart" ? bars(title, rows, f) : tbl}</section>`;
  }
  const cmp = (cur, prev, f = int) =>
    `${ic(cur >= prev ? "arrow-up" : "arrow-down")}Same period last year ${f(prev)}`;

  /* AD-27 Program overview */
  const ENROL = [412, 380, 455, 398, 520, 610, 488, 502, 471, 530, 214],
    ENROL_PREV = [350, 342, 401, 377, 430, 466, 412, 440, 425, 461, 198];
  const USE = [
      3.41, 3.22, 3.78, 3.65, 3.92, 4.05, 3.88, 3.97, 4.12, 4.36, 1.48,

    USE_PREV = [3.02, 2.95, 3.31, 3.24, 3.4, 3.57, 3.49, 3.61, 3.66, 3.8, 1.29];
  P.screen("AD-27", {
    title: "Program overview",
    render() {
      const r = rangeOf(),
        k = SCALE[r];
      const months =
        r === "ytd"
          ? MONTHS.slice(0, 11).map((m, i) => i)
          : r === "q4"
            ? [9, 10]

      const sumUse = months.reduce((a, i) => a + USE[i], 0) * 1e6,
        sumPrev = months.reduce((a, i) => a + USE_PREV[i], 0) * 1e6;
      const enr = months.reduce((a, i) => a + ENROL[i], 0),
        enrPrev = months.reduce((a, i) => a + ENROL_PREV[i], 0);
      const txN = Math.round(28412 * k),
        txPrev = Math.round(25377 * k);
      const asOf = F("rp.asof") || "11 Nov 2026";
      const granted =
        asOf === "11 Nov 2026"
          ? 176840000
          : asOf === "31 Oct 2026"
            ? 176190000
            : 175400000;

          ? 41284750
          : asOf === "31 Oct 2026"
            ? 39804750
            : 35444750;
      return `<div class="stack">${head("Program overview", `Date range ${esc(rangeLabel())}, compared with the same period last year.`)}${filterBar(rangeField())}
      ${tiles([

          "Active Beneficiaries",

        ["Credits used", fmt(sumUse), cmp(sumUse, sumPrev, fmt)],
        ["Transactions", int(txN), cmp(txN, txPrev)],

      ])}
      <div class="grid2">${chart(

        {

        },

          [

          ],

    },
  });

  /* AD-28 Beneficiary demographics */

      ${chart("demo", `Beneficiaries by ${label.toLowerCase()}`, rows, { col: label, valueCol: "Beneficiaries", filters: demoFilters(), range: "Active records on " + P.TODAY })}

  /* AD-29 Maps and heatmaps */
  const AREAS = {
    Malinis: "10,30 110,10 120,110 30,120",

    "Santa Rosa": "200,20 290,40 280,120 190,100",

  const USED = {

      <div class="map-panel__legend" aria-label="Legend">${[
        ["", "under 50%"],
        ["--step-2", "50% to 59%"],
        ["--step-3", "60% to 69%"],
        ["--step-4", "70% to 79%"],
        ["--step-5", "80% and over"],
        ["--hatch", "No active Branch"],

    "br-pob": [3412500, 1210],
    "br-sr": [1980250, 744],

    "br-bay": [2615750, 935],
    "br-sidh": [6870000, 610],
  };

    ["inst", "Institutions by Credits redeemed"],
    ["brc", "Branches by Credits redeemed"],
    ["brs", "Branches by Beneficiaries served"],
  ];
  P.screen("AD-30", {
    title: "Utilization and Institution performance",
    render() {
      const by = F("ut.by") || "inst",
        ty = F("ut.type") || "",
        k = SCALE[rangeOf()];
      const live = (b) =>
        db()
          .tx.filter((t) => t.branch === b && t.status === "completed")
          .reduce((a, t) => a + t.credits, 0);
      const brs = allBranches().filter((b) => !ty || b.inst.type === ty);
      let rows;
      if (by === "inst") {
        const m = {};
        brs.forEach((b) => {
          m[b.inst.name] =
            (m[b.inst.name] || 0) + BASE[b.id][0] * k + live(b.id);
        });
        rows = Object.entries(m).map(([l, v]) => [l, v]);
      } else
        rows = brs.map((b) => [
          `${b.inst.name}, ${b.name}`,
          by === "brc"
            ? BASE[b.id][0] * k + live(b.id)
            : Math.round(BASE[b.id][1] * Math.max(k, 0.3)),
        ]);
      rows.sort((a, b) => b[1] - a[1]);
      rows = rows.map(([l, v], i) => [`${i + 1}. ${l}`, v]);
      const ytd = Object.values(BASE).reduce((a, b) => a + b[0], 0);

            ? `<div class="row">${btn("Download", "adm.downloadExport", { icon: "download" })}${btn("Start again", "adm.startExport", { off: a })}</div>`
            : btn("Start full data export", "adm.startExport", {
                off: a || (ex && ex.status === "preparing"),
              }),
        ],
      ].map(
        ([l, v, b]) =>
          `<tr><th scope="row">${l}</th><td>${v}</td><td>${b}</td></tr>`,
      );
      return `<div class="stack">${head("Program settings", "Each setting is changed in the side panel. Every change is recorded in the audit log.")}${a ? alert("View only", "Only the administrator changes Program settings.") : ""}${panel("Settings", table("Program settings", ["Setting", "Value", "Action"], rows), { raw: true })}${db().banner ? '<button class="p-btn" type="button" data-a="adm.maintPassed">Simulate: the maintenance window passes</button>' : ""}</div>`;
    },
  });
  P.panel("AD-37-edit", ({ k }) => {
    const s = db().settings;
    let title,
      body,
      off = "";
    if (k === "fee") {
      title = "Replacement fee";
      body = field(
        "Replacement fee, ₱ (required)",
        input("form.set.fee", { mode: "decimal" }),
        "Charged when a lost or damaged Card is replaced, unless waived.",
      );
      off =
        !(num(F("set.fee")) >= 0) || String(F("set.fee") || "").trim() === ""
          ? "Enter an amount"
          : num(F("set.fee")) === s.fee
            ? "Change the amount"
            : "";
    } else if (k === "helpLine") {
      title = "Program help line";
      body = field(
        "Program help line (required)",
        input("form.set.helpLine", { placeholder: "(043) 555 0100" }),
        "Shown on refusals, every slip, the account menu, and the Card back.",
      );
      off = !String(F("set.helpLine") || "").trim()
        ? "Enter the help line"
        : F("set.helpLine").trim() === s.helpLine
          ? "Change the help line"
          : "";
    } else if (k === "categories") {
      title = "Beneficiary categories";
      const rows = s.categories.map((c) => {
        const used = db().benes.some((b) => b.category === c);
        return `<tr><th scope="row">${esc(c)}</th><td>${used ? '<span class="text-muted">In use</span>' : ""}</td><td>${btn("Remove", "adm.removeCat", { v: c, off: used })}</td></tr>`;
      });
      body = `${table("Beneficiary categories", ["Category", "Use", "Action"], rows)}${ui().err["adm.removeCat"] ? reasonOff("A category with Beneficiaries in it cannot be removed.") : ""}${field("New category", input("form.set.newCat", { placeholder: "For example, indigenous people" }))}<div class="row">${btn("Add category", "adm.addCat", { icon: "plus", off: !String(F("set.newCat") || "").trim() })}</div>`;
      return { title, body, footer: btn("Done", "closePanel") };
    } else if (k === "maint") {
      title = "Planned maintenance notice";
      body = `${field("Date (required)", input("form.set.mDate", { placeholder: "14 Nov 2026" }))}${field("From (required)", input("form.set.mFrom", { placeholder: "10:00 PM" }))}${field("To (required)", input("form.set.mTo", { placeholder: "12:00 AM" }))}<p class="text-muted">A System banner shows on every dashboard until the window passes. Counter Terminals cannot record sales during the window.</p>`;
      off = ["mDate", "mFrom", "mTo"].some(
        (x) => !String(F("set." + x) || "").trim(),
      )
        ? "Enter the date and both times"
        : "";
    }
    return {
      title,
      body,
      footer: `${off ? reasonOff(off + " to save.") : ""}${btn("Cancel", "closePanel")}${btn("Save", "adm.saveSetting", { kind: "primary", v: k, off: !!off })}`,
    };
  });

  /* ======================================================================
   AD-38 Counter Terminal reason lists
   ====================================================================== */
  const LISTS = [
    [
      "noDiscount",
      "No-discount reasons",
      "Shown when a senior citizen or PWD is given no discount.",
    ],
    ["void", "Void reasons", "Shown when a Transaction is voided."],
  ];
  const retired = () => {
    if (!db().reasonsRetired)
      db().reasonsRetired = { noDiscount: [], void: [] };
    return db().reasonsRetired;
  };
  P.screen("AD-38", {
    title: "Counter Terminal reason lists",
    render() {
      const a = !admin();
      const sec = ([key, title, sub]) => {
        const list = db().reasons[key],
          last = list.length - 1;
        const rows = list.map((r, i) =>
          r === "Other"
            ? `<tr><td class="tabular">${i + 1}</td><th scope="row">Other</th><td>${status("active", "success")}</td><td><span class="text-muted">Always last. Needs a typed reason.</span></td></tr>`
            : `<tr><td class="tabular">${i + 1}</td><th scope="row">${esc(r)}</th><td>${status("active", "success")}</td><td><div class="button-row">${btn("", "rs.up", { icon: "arrow-up", label: "Move up: " + r, v: i, data: { list: key }, off: a || i === 0 })}${btn("", "rs.down", { icon: "arrow-down", label: "Move down: " + r, v: i, data: { list: key }, off: a || i >= last - 1 })}${btn("Rename", "rs.rename", { v: i, data: { list: key }, off: a })}${btn("Retire", "rs.retire", { v: i, data: { list: key }, off: a })}</div></td></tr>`,
        );
        const ret = retired()[key].map(
          (r, i) =>
            `<tr><td></td><th scope="row">${esc(r)}</th><td>${status("retired", "muted")}</td><td>${btn("Restore", "rs.restore", { v: i, data: { list: key }, off: a })}</td></tr>`,
        );
        return panel(
          title,
          `<div class="panel__body"><p class="text-muted">${esc(sub)}</p></div>${table(title, ["Order", "Reason", "Status", "Actions"], rows.concat(ret))}`,
          {
            raw: true,
            right: btn("Add reason", "rs.add", {
              icon: "plus",
              data: { list: key },
              off: a,
            }),
          },
        );
      };
      return `<div class="stack">${head("Counter Terminal reason lists", "Counter Terminals show the new list from the next sale. Past Transactions keep the reason they were saved with.")}${a ? alert("View only", "Only the administrator changes the reason lists.") : ""}${LISTS.map(sec).join("")}</div>`;
    },
  });
  P.panel("AD-38-edit", ({ list, i }) => {
    const t = String(F("rs.text") || "").trim(),
      cur = i != null ? db().reasons[list][i] : null;
    const dup = db().reasons[list].some(
      (r) => r.toLowerCase() === t.toLowerCase() && r !== cur,
    );
    const off = !t
      ? "Enter the reason"
      : t.toLowerCase() === "other"
        ? '"Other" is already on the list'
        : dup
          ? "That reason is already on the list"
          : t === cur
            ? "Change the wording"
            : "";
    return {
      title: cur ? "Rename reason" : "Add reason",
      body: `<p class="text-muted">${esc(LISTS.find((l) => l[0] === list)[1])}. ${cur ? "Past Transactions keep the old wording." : 'It goes above "Other".'}</p>${field("Reason (required)", input("form.rs.text"), "Short, as it shows on the Counter Terminal.")}`,
      footer: `${off ? reasonOff(off + ".") : ""}${btn("Cancel", "closePanel")}${btn(cur ? "Save" : "Add reason", "rs.save", { kind: "primary", off: !!off, v: i != null ? i : "", data: { list } })}`,
    };
  });

  /* ======================================================================
   Actions
   ====================================================================== */
  const stmtLabel = (st) => `${P.branchName(st.branch)}, ${st.period}`;
  Object.assign(P.actions, {
    /* Settlement */
    "st.openPeriod": () => {
      setF("period", { v: db().settings.period });
      P.openPanel("AD-23-period");
    },
    "st.savePeriod": () => {
      const v = F("period.v");
      db().settings.period = v;
      P.audit("Changed settlement period to " + v, "Program settings");
      P.closePanel();
      P.toast(
        "Settlement period saved",
        `Statements are now made ${v}. The next period is ${NEXT_PERIOD[v]}.`,
      );
    },
    "st.makeDrafts": () => {
      const made = allBranches()
        .filter(
          (b) =>
            !P.draftFor(b.id) &&
            db().tx.some(
              (t) => t.branch === b.id && t.status === "completed" && !t.stmt,
            ),
        )
        .map((b) => P.draftFor(b.id, true));
      P.toast(
        "Draft statements made",
        `${made.length} draft statement${made.length === 1 ? "" : "s"} for ${made[0] ? made[0].period : "the next period"}, with each Branch's unbilled sales.`,
      );
    },
    "st.startReview": (id) => {
      const st = P.statement(id);
      if (st.stage !== "draft") return;
      st.stage = "under review";
      P.audit("Started review of Settlement Statement", stmtLabel(st));
      P.mark("stmtReviewStarted");
      P.toast(
        "Review started",
        "New sales of this Branch now go on the next statement.",
      );
    },
    "st.approve": (id) => {
      const st = P.statement(id);
      const held = db().tx.filter(
        (t) => t.branch === st.branch && t.status === "held",
      ).length;
      P.confirm({
        title: "Approve this statement?",
        body: `<p>${peso(P.stmtTotal(id))} for ${P.stmtTx(id).filter((t) => t.status !== "reversed").length} Transactions. ${held ? `${held} held Transaction${held > 1 ? "s are" : " is"} not on it. ` : ""}An approved statement cannot be changed.</p>`,
        ok: "Approve statement",
        action: () => {
          st.stage = "approved";
          st.approvedBy = P.who();
          st.approvedWhen = P.stamp();
          P.audit("Approved Settlement Statement", stmtLabel(st));
          P.mark("stmtApproved");
          P.toast(
            "Statement approved",
            `${P.branch(st.branch).inst.name} sees it as approved. Add a Payment Record when the treasurer has paid.`,
          );
        },
      });
    },
    "st.openPay": (id) => {
      const st = P.statement(id);
      setF("pay", {
        date: "11/11/2026",
        gross: fmt(P.outstanding(st)),
        ded: "0.00",
        ref: "LBP-2026-11-" + (st.payments.length ? "0952" : "0931"),
        notes: "Paid by the Provincial Treasurer through LANDBANK",
      });
      P.openPanel("AD-24-pay", { id });
    },
    "st.savePay": (id) => {
      const st = P.statement(id),
        p = F("pay");
      const gross = num(p.gross),
        ded = num(p.ded);
      st.payments.push({
        date: toDate(p.date),
        gross,
        ded,
        net: gross - ded,
        ref: String(p.ref).trim(),
        notes: String(p.notes || "").trim(),
      });
      st.stage = P.paid(st) + 0.004 >= P.stmtTotal(id) ? "paid" : "partly paid";
      P.audit("Added Payment Record " + String(p.ref).trim(), stmtLabel(st));
      P.mark("paymentRecorded");
      if (st.stage === "paid") P.mark("stmtPaid");
      P.closePanel();
      P.toast(
        st.stage === "paid" ? "Statement paid" : "Statement partly paid",
        `Payment Record ${p.ref} saved. ${P.branch(st.branch).inst.name} sees it now.${st.stage === "partly paid" ? ` ${peso(P.outstanding(st))} is still outstanding.` : ""}`,
      );
    },
    "st.export": (id) => {
      const st = P.statement(id);
      exportDialog({
        title: "Export statement",
        what: "Settlement Statement, " + stmtLabel(st),
        lines: [
          ["Stage", st.stage],
          ["Total", peso(P.stmtTotal(id))],
        ],
        formats: [
          ["pdf", "PDF"],
          ["sheet", "Spreadsheet"],
        ],
        done: (f) => {
          P.audit("Exported Settlement Statement (" + f + ")", stmtLabel(st));
          P.toast(
            "Statement exported",
            `${f} of ${stmtLabel(st)}. This export is recorded in the audit log.`,
          );
        },
      });
    },
    "st.openTx": (no) => P.openPanel("AD-26", { no }),
    "st.hold": (no) => {
      const t = P.txByNo(no);
      if (!t || canHold(t)) return;
      const st = t.stmt && P.statement(t.stmt);
      reasonDialog({
        title: `Place a Hold on Transaction ${no}?`,
        label: "Reason for the Hold (required)",
        ok: "Place Hold",
        key: "hold",
        body: `<p>${fmt(t.credits)} Credits at ${esc(P.branchName(t.branch))}. ${st ? `It leaves the ${esc(st.period)} statement. ` : ""}The Branch is not paid for it until the Hold is released.</p>`,
        action: (reason) => {
          holdTx(t, reason);
          P.mark("holdPlaced");
          P.toast(
            "Hold placed",
            `Transaction ${no} is held${st ? " and off the draft statement" : ""}.`,
          );
        },
      });
    },
    "st.release": (no) => {
      const t = P.txByNo(no);
      if (!t || t.status !== "held" || canRelease(t)) return;
      const d0 = P.draftFor(t.branch);
      P.confirm({
        title: `Release the Hold on Transaction ${no}?`,
        body: `<p>It goes onto ${d0 ? `the ${esc(d0.period)} draft statement` : "the next statement"} for ${esc(P.branchName(t.branch))}, and the Branch is paid for it then.</p>`,
        ok: "Release Hold",
        action: () => {
          t.status = "completed";
          t.hold = null;
          const d = P.draftFor(t.branch, true);
          t.stmt = d.id;
          P.audit("Released Hold", "Transaction " + no);
          flagNote(no, "Hold released.");
          P.mark("holdReleased");
          P.toast(
            "Hold released",
            `Transaction ${no} is on the ${d.period} statement.`,
          );
        },
      });
    },
    "st.reverse": (no) => {
      const t = P.txByNo(no);
      if (!t || canReverse(t)) return;
      reasonDialog({
        title: `Submit a Reversal of Transaction ${no}?`,
        label: "Reason for the Reversal (required)",
        ok: "Submit Reversal",
        key: "rev",
        body: `<p>If an approver approves it, ${fmt(t.credits)} Credits go back to ${esc(beneName(t))} and ${esc(P.branchName(t.branch))} is never paid for this sale.${t.status === "held" ? " Until then the Transaction stays held." : ""}</p>`,
        action: (reason) => {
          const a = P.submitApproval(
            "reversal",
            `Reversal: Transaction ${no}`,
            `${P.branchName(t.branch)}. ${fmt(t.credits)} Credits. ${reason}`,
            { tx: no, reason },
          );
          t.reversal = null;
          flagNote(no, "Reversal submitted. " + reason);
          P.mark("reversalSubmitted");
          P.toast(
            "Reversal submitted",
            `It waits for an approver on Approvals (${a.id}). Another person must approve it.`,
          );
        },
      });
    },
    "st.holdAll": (br) => {
      const list = unbilledOf(br);
      if (!list.length || !fin()) return;
      reasonDialog({
        title: `Hold all unbilled Transactions of ${P.branchName(br)}?`,
        label: "Reason for the Hold (required)",
        ok: `Hold ${list.length} Transactions`,
        key: "holdAll",
        body: `<p>${list.length} Transactions, ${fmt(list.reduce((a, t) => a + t.credits, 0))} Credits. They leave any draft statement. The Branch is not paid for them until each Hold is released.</p>`,
        action: (reason) => {
          list.forEach((t) => holdTx(t, reason));
          P.audit(
            `Placed Hold on all ${list.length} unbilled Transactions`,
            P.branchName(br),
          );
          P.mark("holdPlaced");
          P.mark("holdAllPlaced");
          P.toast(
            "Transactions held",
            `${list.length} Transactions of ${P.branchName(br)} are held.`,
          );
        },
      });
    },
    /* Reports */
    "rp.view": (key) => {
      const k = "chart-" + key;
      ui().tab[k] = P.tab(k, "chart") === "chart" ? "table" : "chart";
    },
    "rp.muni": (m) => setF("hm.m", m),
    "rp.export": (v, el) => {
      const { title, filters, range } = el.dataset;
      const formats =
        el.dataset.fmt === "image"
          ? [
              ["image", "Image (PNG)"],
              ["pdf", "PDF"],
              ["sheet", "Spreadsheet"],
            ]
          : [
              ["image", "Image (PNG)"],
              ["pdf", "PDF"],
              ["sheet", "Spreadsheet"],
            ];
      exportDialog({
        title: "Export chart",
        what: title,
        lines: [
          ["Filters", filters],
          ["Date range", range],
        ],
        formats,
        done: (f) => {
          P.audit(`Exported chart (${f})`, title);
          P.mark("chartExported");
          P.toast(
            `Chart exported as ${f === "Image (PNG)" ? "an image" : f}`,
            `“${title}”. Filters: ${filters}. Date range: ${range}. Made ${P.TODAY} by ${P.who()}. Recorded in the audit log.`,
          );
        },
      });
    },
    /* Flags */
    "fl.open": (id) => {
      const f = db().flags.find((x) => x.id === id);
      setF("flag", {
        status: f.status === "new" ? "under review" : f.status,
        note: "",
      });
      P.openPanel("AD-32", { id });
    },
    "fl.openTx": (no) => {
      const cur = ui().panel;
      const f =
        (cur && cur.id === "AD-32" && cur.params.id) || (flagOfTx(no) || {}).id;
      P.openPanel("AD-26", { no, flag: f });
    },
    "fl.saveStatus": (id) => {
      const f = db().flags.find((x) => x.id === id),
        s = F("flag.status"),
        note = String(F("flag.note")).trim();
      f.status = s;
      f.note = note;
      (f.history = f.history || []).unshift({
        when: P.stamp(),
        who: P.who(),
        what: `Status ${s}. ${note}`,
      });
      P.audit(
        `Changed Flag status to ${s}`,
        f.kind + (f.tx ? ", Transaction " + f.tx : ""),
      );
      P.mark("flagStatusChanged");
      if (s === "cleared") P.mark("flagCleared");
      if (s === "confirmed") P.mark("flagConfirmed");
      setF("flag.note", "");
      P.toast(
        "Flag status saved",
        `The Flag is ${s}. Your note is recorded with your name.`,
      );
    },
    "fl.openThresholds": () => {
      const th = db().thresholds;
      setF("thr", Object.fromEntries(THR.map(([k]) => [k, String(th[k])])));
      P.openPanel("AD-33");
    },
    "fl.saveThresholds": () => {
      const th = db().thresholds,
        ch = [];
      THR.forEach(([k, l, f]) => {
        const v = num(F("thr." + k));
        if (v !== th[k]) {
          ch.push(`${l}: ${f(th[k])} to ${f(v)}`);
          th[k] = v;
        }
      });
      db().thresholdHistory.unshift({
        when: P.stamp(),
        who: P.who(),
        what: ch.join(". ") + ".",
      });
      P.audit("Changed unusual activity thresholds", ch.join("; "));
      P.mark("thresholdsChanged");
      P.toast("Thresholds saved", "New numbers apply to activity from now on.");
    },
    /* Province Users */
    "adm.openUser": (key) => {
      const u = db().provinceUsers.find((x) => x.key === key);
      setF("user", {
        roles: Object.fromEntries(ROLES.map((r) => [r, u.roles.includes(r)])),
      });
      P.openPanel("AD-34-user", { key });
    },
    "adm.saveRoles": (key) => {
      const u = db().provinceUsers.find((x) => x.key === key),
        old = u.roles.join(", ");
      u.roles = ROLES.filter((r) => F("user.roles." + r));
      P.audit(`Changed roles from ${old} to ${u.roles.join(", ")}`, u.name);
      if (P.persona().key === key)
        db().flags.unshift({
          id: "f-" + Date.now(),
          kind: "Administrator changed own roles",
          detail: `${u.name} changed their own roles from ${old} to ${u.roles.join(", ")}.`,
          tx: null,
          bene: null,
          branch: null,
          when: P.TODAY,
          status: "new",
          note: "",
        });
      P.toast("Roles saved", `${u.name}: ${u.roles.join(", ")}.`);
    },
    "adm.disable": (key) => {
      const u = db().provinceUsers.find((x) => x.key === key);
      P.confirm({
        title: `Disable ${u.name}?`,
        body: "<p>They can no longer sign in. Their past actions stay in the audit log.</p>",
        ok: "Disable",
        kind: "destructive",
        action: () => {
          u.status = "disabled";
          P.audit("Disabled Province User", u.name);
          P.toast("User disabled", `${u.name} can no longer sign in.`);
        },
      });
    },
    "adm.enable": (key) => {
      const u = db().provinceUsers.find((x) => x.key === key);
      u.status = "active";
      P.audit("Enabled Province User", u.name);
      P.toast("User enabled", `${u.name} can sign in again.`);
    },
    "adm.unlock": (key) => {
      const u = db().provinceUsers.find((x) => x.key === key);
      P.confirm({
        title: `Unlock ${u.name}?`,
        body: "<p>The account was locked after too many wrong sign-ins. Confirm who they are before unlocking.</p>",
        ok: "Unlock",
        action: () => {
          u.status = "active";
          P.audit("Unlocked Province User", u.name);
          P.mark("userUnlocked");
          P.toast("Account unlocked", `${u.name} can sign in again.`);
        },
      });
    },
    "adm.reset2fa": (key) => {
      const u = db().provinceUsers.find((x) => x.key === key);
      P.confirm({
        title: `Reset ${u.name}'s second factor?`,
        body: "<p>They set up the authenticator app again at their next sign-in. The reset is recorded in the audit log.</p>",
        ok: "Reset second factor",
        action: () => {
          u.mfaReset = true;
          P.audit("Reset second factor", u.name);
          P.mark("mfaReset");
          P.toast(
            "Second factor reset",
            `${u.name} sets up the authenticator app at next sign-in.`,
          );
        },
      });
    },
    "adm.openAdd": () => {
      setF("nu", { name: "", email: "", roles: {} });
      P.openPanel("AD-34-add");
    },
    "adm.addUser": () => {
      const name = String(F("nu.name")).trim(),
        key = "u-" + Date.now();
      const u = {
        key,
        name,
        email: String(F("nu.email")).trim(),
        roles: ROLES.filter((r) => F("nu.roles." + r)),
        status: "awaiting first sign-in",
        last: "Not yet signed in",
      };
      db().provinceUsers.push(u);
      P.audit("Added Province User with roles " + u.roles.join(", "), name);
      P.mark("userAdded");
      setF("user", {
        roles: Object.fromEntries(ROLES.map((r) => [r, u.roles.includes(r)])),
      });
      P.openPanel("AD-34-user", { key });
      ui().tempPw = { key, pw: tempPw() };
      P.toast(
        "Province User added",
        `${name}. Give them the temporary password shown.`,
      );
    },
    "adm.toggleVendor": (key) => {
      const v = db().vendorOperators.find((x) => x.key === key);
      v.status = v.status === "active" ? "disabled" : "active";
      P.audit(
        (v.status === "active" ? "Enabled" : "Disabled") + " Vendor Operator",
        v.name,
      );
      P.toast(
        `Vendor Operator ${v.status === "active" ? "enabled" : "disabled"}`,
        v.name,
      );
    },
    /* Support Access Grants */
    "adm.openNewGrant": () => {
      const op = db().vendorOperators.find((v) => v.status === "active");
      setF("gr", { op: op ? op.key : "", text: "", hours: "2" });
      P.openPanel("AD-35-new");
    },
    "adm.grant": () => {
      const v =
        db().vendorOperators.find((x) => x.key === F("gr.op")) ||
        db().vendorOperators[0];
      const from = P.stamp(),
        h = +F("gr.hours") || 2;
      const g = {
        id: "g-" + Date.now(),
        who: `${v.name}, ${v.company}`,
        request: String(F("gr.text")).trim(),
        from,
        to: addHours(from, h),
        status: "active",
        viewed: [],
        by: P.who(),
      };
      db().grants.unshift(g);
      P.audit(
        `Gave Support Access Grant for ${h} hour${h > 1 ? "s" : ""}`,
        g.who,
      );
      P.mark("grantGiven");
      P.openPanel("AD-35-grant", { id: g.id });
      P.toast(
        "Support Access Grant given",
        `${v.name} can view records until ${g.to}, view only.`,
      );
      const db0 = P.db;
      P.later(4000, () => {
        if (P.db === db0 && g.status === "active")
          g.viewed.push(`Card print queue, ${P.now()}`);
      });
      P.later(8000, () => {
        if (P.db === db0 && g.status === "active")
          g.viewed.push(`Office devices, ${P.now()}`);
      });
    },
    "adm.openGrant": (id) => P.openPanel("AD-35-grant", { id }),
    "adm.endGrant": (id) => {
      const g = db().grants.find((x) => x.id === id);
      P.confirm({
        title: "End this grant now?",
        body: `<p>${esc(g.who)} loses access at once.</p>`,
        ok: "End grant",
        kind: "destructive",
        action: () => {
          g.status = "ended";
          g.to = P.stamp();
          P.audit("Ended Support Access Grant early", g.who);
          P.mark("grantEnded");
          P.toast("Grant ended", `${g.who} no longer has access.`);
        },
      });
    },
    /* Audit log */
    "adm.openAudit": (i) =>
      P.openPanel("AD-36-entry", { entry: db().audit[+i] }),
    "adm.exportAudit": () => {
      const n = auditRows().length,
        filters = audFilters();
      exportDialog({
        title: "Export audit log",
        what: `Audit log, ${n} entries`,
        lines: [["Filters", filters]],
        formats: [["sheet", "Spreadsheet"]],
        done: () => {
          P.audit("Exported audit log", `${n} entries. Filters: ${filters}`);
          P.mark("auditExported");
          P.toast(
            "Audit log exported",
            `Spreadsheet of ${n} entries. The export itself is now in the audit log.`,
          );
        },
      });
    },
    /* Program settings */
    "adm.editSetting": (k) => {
      const s = db().settings;
      setF("set", {
        fee: fmt(s.fee),
        helpLine: s.helpLine || "",
        newCat: "",
        mDate: "14 Nov 2026",
        mFrom: "10:00 PM",
        mTo: "12:00 AM",
      });
      P.openPanel("AD-37-edit", { k });
    },
    "adm.saveSetting": (k) => {
      const s = db().settings;
      if (k === "fee") {
        const old = s.fee;
        s.fee = num(F("set.fee"));
        P.audit(
          `Changed replacement fee from ${peso(old)} to ${peso(s.fee)}`,
          "Program settings",
        );
        P.toast(
          "Replacement fee saved",
          `${peso(s.fee)} from the next replacement.`,
        );
      } else if (k === "helpLine") {
        s.helpLine = String(F("set.helpLine")).trim();
        P.audit(
          "Changed Program help line to " + s.helpLine,
          "Program settings",
        );
        P.toast(
          "Program help line saved",
          "It shows on slips, refusals, and the account menu.",
        );
      } else if (k === "maint") {
        db().banner = `Planned maintenance on ${F("set.mDate").trim()}, ${F("set.mFrom").trim()} to ${F("set.mTo").trim()}. Agapay cannot be used then, and no sales can be recorded.`;
        P.audit("Set planned maintenance notice", db().banner);
        P.mark("maintenanceSet");
        P.toast(
          "Maintenance notice set",
          "The System banner shows on every dashboard.",
        );
      }
      P.closePanel();
    },
    "adm.clearMaint": () => {
      db().banner = null;
      P.audit("Removed planned maintenance notice", "Program settings");
      P.toast("Maintenance notice removed", "The System banner is gone.");
    },
    "adm.maintPassed": () => {
      db().banner = null;
      P.audit("Maintenance window passed", "System");
      P.toast("Maintenance window passed", "The System banner is gone.");
    },
    "adm.addCat": () => {
      const c = String(F("set.newCat") || "").trim();
      if (!c) return;
      const s = db().settings;
      if (s.categories.some((x) => x.toLowerCase() === c.toLowerCase())) {
        P.toast("Category not added", `"${c}" is already on the list.`);
        return;
      }
      s.categories.push(c);
      setF("set.newCat", "");
      P.audit("Added Beneficiary category " + c, "Program settings");
      P.toast("Category added", `"${c}" can be chosen at enrollment.`);
    },
    "adm.removeCat": (c) => {
      const s = db().settings;
      s.categories = s.categories.filter((x) => x !== c);
      P.audit("Removed Beneficiary category " + c, "Program settings");
      P.toast("Category removed", `"${c}" is no longer offered at enrollment.`);
    },
    "adm.startExport": () => {
      const s = db().settings;
      s.exportReady = { status: "preparing", started: P.stamp() };
      P.audit("Started full data export", "Program settings");
      P.mark("exportStarted");
      P.toast(
        "Full data export started",
        "It is being prepared. You can leave this screen.",
      );
      const db0 = P.db;
      P.later(5000, () => {
        if (P.db !== db0) return;
        s.exportReady = {
          status: "ready",
          when: P.stamp(),
          file: "agapay-full-export-2026-11-11.zip, documented format",
        };
        P.mark("exportReady");
        P.toast("Full data export ready", "Download it from Program settings.");
      });
    },
    "adm.downloadExport": () => {
      P.audit("Downloaded full data export", db().settings.exportReady.file);
      P.toast(
        "Download started",
        db().settings.exportReady.file + ". Recorded in the audit log.",
      );
    },
    /* Reason lists */
    "rs.up": (i, el) => moveReason(el.dataset.list, +i, -1),
    "rs.down": (i, el) => moveReason(el.dataset.list, +i, 1),
    "rs.retire": (i, el) => {
      const k = el.dataset.list,
        l = db().reasons[k],
        r = l[+i];
      if (r === "Other") return;
      P.confirm({
        title: `Retire "${r}"?`,
        body: "<p>Counter Terminals stop showing it from the next sale. Past Transactions keep it.</p>",
        ok: "Retire reason",
        action: () => {
          l.splice(+i, 1);
          retired()[k].push(r);
          P.audit(`Retired reason "${r}"`, listName(k));
          P.mark("reasonListChanged");
          P.toast(
            "Reason retired",
            "Counter Terminals show the new list from the next sale.",
          );
        },
      });
    },
    "rs.restore": (i, el) => {
      const k = el.dataset.list,
        r = retired()[k].splice(+i, 1)[0];
      insertBeforeOther(k, r);
      P.audit(`Restored reason "${r}"`, listName(k));
      P.toast("Reason restored", `"${r}" is back above "Other".`);
    },
    "rs.add": (v, el) => {
      setF("rs", { text: "" });
      P.openPanel("AD-38-edit", { list: el.dataset.list, i: null });
    },
    "rs.rename": (i, el) => {
      setF("rs", { text: db().reasons[el.dataset.list][+i] });
      P.openPanel("AD-38-edit", { list: el.dataset.list, i: +i });
    },
    "rs.save": (i, el) => {
      const k = el.dataset.list,
        t = String(F("rs.text")).trim(),
        l = db().reasons[k];
      if (i === "" || i == null) {
        insertBeforeOther(k, t);
        P.audit(`Added reason "${t}"`, listName(k));
        P.toast(
          "Reason added",
          "Counter Terminals show the new list from the next sale.",
        );
      } else {
        const old = l[+i];
        l[+i] = t;
        P.audit(`Renamed reason "${old}" to "${t}"`, listName(k));
        P.toast("Reason renamed", "Past Transactions keep the old wording.");
      }
      P.mark("reasonListChanged");
      P.closePanel();
    },
  });
  const listName = (k) => LISTS.find((l) => l[0] === k)[1];
  function insertBeforeOther(k, r) {
    const l = db().reasons[k];
    const o = l.indexOf("Other");
    if (o < 0) l.push(r);
    else l.splice(o, 0, r);
  }
  function moveReason(k, i, d) {
    const l = db().reasons[k],
      j = i + d;
    if (j < 0 || j >= l.length || l[i] === "Other" || l[j] === "Other") return;
    [l[i], l[j]] = [l[j], l[i]];
    P.audit(`Moved reason "${l[j]}" ${d < 0 ? "up" : "down"}`, listName(k));
    P.mark("reasonListChanged");
    P.toast(
      "Order saved",
      "Counter Terminals show the new order from the next sale.",
    );
  }
})();

</script>
    <script>
/* Agapay prototype: Institution Dashboard (ID-00 to ID-08).
   Reach: a Head Office user sees every Branch of the Institution (Title-bar Branch selector, P.S.ui.branch, '' = All Branches).
   A manager sees their own Branch only. Markup follows key-03-institution-overview-transactions.html. */
(() => {
  "use strict";
  const P = window.P;
  const {
    esc,
    fmt,
    peso,
    int,
    ic,
    btn,
    badge,
    status,
    field,
    input,
    select,
    detail,
    head,
    link,
    tiles,
    alert,
    stateMsg,
    actionLink,
    filterBar,
  } = P;
  const panelHtml = (...a) => (P.panelHtml || P.panel)(...a);

  /* ---------- reach and helpers ---------- */
  const me = () => P.persona();
  const inst = () => P.inst(me().inst);
  const isHO = () => (me().roles || []).includes("Head Office");
  const viewOnly = () => {
    const i = inst();
    return !!i && ["suspended", "revoked"].includes(i.status);
  };
  function reach() {
    const i = inst();
    if (!i) return [];
    if (isHO()) {
      const sel = P.S.ui.branch;
      return i.branches.filter((b) => !sel || b.id === sel).map((b) => b.id);
    }
    return [me().branch];
  }
  const allBranches = () => (!isHO() ? false : !P.S.ui.branch);
  const reachLabel = () => {
    const r = reach();
    if (allBranches()) return "All Branches";
    const b = P.branch(r[0]);
    return b ? b.name : "";
  };
  const dayOf = (w) => new Date(String(w).split(",")[0]);
  const daysUntil = (d) =>
    Math.round((new Date(d) - new Date(P.TODAY)) / 864e5);
  const hourOf = (w) => {
    const m = String(w).match(/(\d+):(\d+) (AM|PM)/);
    if (!m) return null;
    let h = +m[1] % 12;
    if (m[3] === "PM") h += 12;
    return h;
  };
  const hourLabel = (h) => `${((h + 11) % 12) + 1} ${h < 12 ? "AM" : "PM"}`;
  const maskedId = (pid) => {
    const l4 = String(pid || "").slice(-4);
    return `<span class="masked-id" aria-label="Program ID number ending ${l4}"><span class="masked-id__mask">•••• ••••</span> ${l4}</span>`;
  };
  const txIn = () => {
    const r = reach();
    return P.db.tx.filter((t) => r.includes(t.branch));
  };
  const counted = (t) => ["completed", "held"].includes(t.status);
  const staffOf = (t) => t.staff || "";
  function viewBanner() {
    const i = inst();
    return viewOnly()
      ? `<div class="system-banner system-banner--warning" role="status">${ic("triangle-alert")}<span class="system-banner__text">This Institution is ${esc(i.status)}. You can view records and statements only.</span></div>`
      : "";
  }
  const sub = () => `${esc(inst().name)} · ${esc(reachLabel())}`;
  /* Settlement position of one Transaction (FR-31) */
  function stageOf(t) {
    const st = t.stmt && P.statement(t.stmt);
    return st ? st.stage : null;
  }
  function position(t) {
    if (t.status === "voided") return badge("muted", "voided");
    if (t.status === "held") return badge("warning", "held");
    if (t.status === "reversed") return badge("destructive", "reversed");
    const sg = stageOf(t);
    if (!sg || sg === "draft") return badge("muted", "unbilled");
    return badge(
      sg === "paid" ? "success" : sg === "partly paid" ? "warning" : "info",
      `on a statement (${sg})`,
    );
  }
  const visibleStmt = (s) =>
    s.stage !==
    "draft"; /* a draft is hidden until it is under review [ASSUMPTION] */
  const stmtsIn = () => {
    const r = reach();
    return P.db.statements.filter(
      (s) => r.includes(s.branch) && visibleStmt(s),
    );
  };
  const owed = (s) => Math.max(P.stmtTotal(s.id) - P.paid(s), 0);
  const unbilled = () =>
    txIn()
      .filter(
        (t) => t.status === "completed" && (!t.stmt || stageOf(t) === "draft"),
      )
      .reduce((a, t) => a + t.credits, 0);
  const outstanding = () =>
    stmtsIn()
      .filter((s) => ["approved", "partly paid"].includes(s.stage))
      .reduce((a, s) => a + owed(s), 0);
  function lastPayment() {
    const ps = stmtsIn().flatMap((s) =>
      s.payments.map((p) => Object.assign({ branch: s.branch }, p)),
    );
    ps.sort((a, b) => new Date(b.date) - new Date(a.date));
    return ps[0] || null;
  }
  const branchUsers = (id) =>
    P.db.institutionUsers.filter((u) => u.branch === id);
  const blockedFn = (label, why) =>
    why ? `${P.reasonOff(why)}${btn(label, "na", { off: true })}` : "";

  /* ---------- first sign-in (UJ-11): a new Head Office account starts on ID-00 ---------- */
  (P.beforeRender = P.beforeRender || []).push(() => {
    const p = me();
    if (!p || p.app !== "inst") return;
    const u = P.db.institutionUsers.find((x) => x.key === p.key);
    const st = P.S.ui.id00 || (P.S.ui.id00 = {});
    if (u && u.mustChange && !st[p.key + ":shown"]) {
      st[p.key + ":shown"] = true;
      P.S.signedIn[p.key] = false;
    }
    /* View-only Institution: ID-08 is absent from the sidebar */
    const nav = P.NAV.inst[0][1].find((x) => x[0] === "ID-08");
    if (nav) nav[3] = viewOnly() ? [] : ["Head Office", "manager"];
  });

  /* ---------- ID-00 Sign in ---------- */
  P.screen("ID-00", {
    title: "Sign in",
    render: () => {
      const p = me(),
        u = P.db.institutionUsers.find((x) => x.key === p.key);
      const st = P.S.ui.id00 || (P.S.ui.id00 = {});
      const step = st[p.key] || "pw";
      const err = P.S.ui.err.id00
        ? `<div class="alert alert--destructive">${ic("circle-alert")}<p class="alert__title">${esc(P.S.ui.err.id00)}</p></div>`
        : "";
      let body;
      if (step === "pw")
        body = `${field("User name", input("form.id00.user", { value: P.get("form.id00.user") ?? ((u && u.email) || p.name), auto: "username" }))}${field("Password", input("form.id00.pw", { type: "password", auto: "current-password" }), u && u.mustChange ? `First sign-in: use the temporary password. Demo only: ${u.tempPassword || ""}` : "Any password works in this prototype.")}<div class="row">${btn("Continue", "id.signInPw", { kind: "primary" })}</div>`;
      else if (step === "newpw")
        body = `<p>Set a new password. Use at least 12 characters.</p>${field("New password", input("form.id00.npw", { type: "password", auto: "new-password" }))}<div class="row">${btn("Save password", "id.signInNewPw", { kind: "primary", off: String(P.get("form.id00.npw") || "").length < 12 })}</div>`;
      else if (step === "tfa-setup")
        body = `<p>Scan this QR code with an authenticator app, then enter one code to confirm.</p><div class="row"><span class="photo" role="img" aria-label="QR code for the authenticator app" style="width:120px;height:120px"></span><p class="text-muted">Setup key <b class="tabular">JBSW Y3DP EHPK 3PXP</b></p></div>${field("6-digit code", input("form.id00.code", { mode: "numeric", auto: "one-time-code" }), "Demo only: any 6 digits.")}<div class="row">${btn("Confirm code", "id.signInSetup", { kind: "primary", off: !/^\d{6}$/.test(String(P.get("form.id00.code") || "")) })}</div>`;
      else if (step === "backup")
        body = `<p>Keep these backup codes. Each works once in place of a code. They are shown once.</p><p class="tabular"><b>4821-7730 · 1093-5562 · 6618-2047 · 3305-9184 · 7741-0263</b></p><div class="row">${btn("Download", "na", { v: "Download backup codes", icon: "download" })}${btn("Print", "na", { v: "Print backup codes", icon: "printer" })}${btn("Continue", "id.signInDone", { kind: "primary" })}</div>`;
      else
        body = `${field("6-digit code from your authenticator app", input("form.id00.code", { mode: "numeric", auto: "one-time-code" }), "Demo only: any 6 digits.")}<div class="row">${btn("Sign in", "id.signInDone", { kind: "primary", off: !/^\d{6}$/.test(String(P.get("form.id00.code") || "")) })}${actionLink("Use a backup code", "na", "Backup codes")}</div>`;
      return `<div class="stack" style="max-width:420px;margin:48px auto;padding:0 16px"><span class="title-bar__wordmark" style="font-size:24px">Agapay</span><h1 class="screen-title">Sign in to the Institution Dashboard</h1>${err}${panelHtml("", `<div class="stack">${body}</div>`)}</div>`;
    },
  });
  function id00(step) {
    const p = me();
    P.S.ui.id00[p.key] = step;
    P.S.ui.err.id00 = "";
  }
  P.action("id.signInPw", () => {
    const p = me(),
      u = P.db.institutionUsers.find((x) => x.key === p.key);
    const pw = String(P.get("form.id00.pw") || "");
    if (u && u.mustChange && u.tempPassword && pw !== u.tempPassword) {
      P.S.ui.err.id00 = "Wrong user name or password.";
      P.audit("Failed sign-in", `Institution Dashboard, ${u.name}`);
      return;
    }
    id00(u && u.mustChange ? "newpw" : u && u.tfaReset ? "tfa-setup" : "code");
  });
  P.action("id.signInNewPw", () => {
    const p = me(),
      u = P.db.institutionUsers.find((x) => x.key === p.key);
    if (u) {
      u.mustChange = false;
      u.tempPassword = "";
      P.audit("Set new password", u.name);
    }
    P.set("form.id00.code", "");
    id00("tfa-setup");
  });
  P.action("id.signInSetup", () => {
    const p = me(),
      u = P.db.institutionUsers.find((x) => x.key === p.key);
    if (u) {
      u.tfaReset = false;
      u.tfa = "set up";
      P.audit("Set up authenticator app", u.name);
    }
    id00("backup");
  });
  P.action("id.signInDone", () => {
    const p = me();
    P.S.signedIn[p.key] = true;
    P.S.ui.id00[p.key] = "pw";
    P.set("form.id00", {});
    P.audit("Signed in", "Institution Dashboard");
    P.mark("idSignedIn");
    P.go("ID-01");
  });

  /* ---------- ID-01 Overview ---------- */
  P.screen("ID-01", {
    title: "Overview",
    render: () => {
      const i = inst(),
        lp = lastPayment(),
        out = outstanding();
      P.mark("idOverview");
      const t = tiles([
        [
          "Unbilled total",
          peso(unbilled()),
          "Transactions since the last statement",
          "ID-06",
        ],
        [
          "Total outstanding",
          peso(out),
          out
            ? "Approved, not yet fully paid"
            : "Every Settlement Statement is paid",
          "ID-06",
        ],
        [
          "Last payment",
          lp ? peso(lp.net) : "—",
          lp ? `Recorded ${esc(lp.date)}` : "No payment yet",
          "ID-06",
        ],
      ]);
      const branches = reach()
        .map((id) => {
          const b = P.branch(id),
            d = daysUntil(b.accTo);
          const st =
            b.status ||
            (["suspended", "revoked"].includes(i.status) ? i.status : "active");
          const warn =
            d < 0
              ? badge("destructive", "Branch accreditation has ended")
              : d <= 30
                ? badge("warning", "Branch accreditation ends within 30 days")
                : "";
          const terms = P.db.terminals.filter((x) => x.branch === id);
          const tRows = terms.map((x) => {
            const last = P.db.tx.filter((y) => y.terminal === x.serial).pop();
            return `<tr><th scope="row" class="tabular">${esc(x.serial)}</th><td>${status(x.status)}</td><td class="tabular">${esc(last ? last.when : "—")}</td></tr>`;
          });
          const uRows = branchUsers(id).map(
            (u) =>
              `<tr><th scope="row">${esc(u.name)}</th><td>${esc(u.role)}${u.status !== "active" ? " " + status(u.status) : ""}</td></tr>`,
          );
          const tbl = (cap, cols, rows) =>
            `<div class="table-wrap"><table class="data-table"><caption>${esc(cap)}</caption><thead><tr>${cols.map((c) => `<th scope="col">${c}</th>`).join("")}</tr></thead><tbody>${rows.join("") || `<tr><td colspan="${cols.length}" class="text-muted">None</td></tr>`}</tbody></table></div><nav class="pagination"><span class="pagination__summary">1 to ${rows.length} of ${rows.length}</span></nav>`;
          return `<section class="panel" aria-label="${esc(b.name)}"><div class="panel__header"><h2 class="panel__title">${esc(b.name)}</h2><span class="row">${status(st)}${warn}</span></div><div class="panel__body"><div class="stack">${detail(
            [
              [
                "Accreditation ends",
                `${esc(b.accTo)}${d >= 0 && d <= 30 ? ` <span class="text-muted">(in ${d} days)</span>` : ""}`,
              ],
              ["Address", esc(b.addr)],
              [
                "License numbers on record",
                `<span class="tabular">${esc(b.license)}</span>`,
                true,
              ],
            ],
          )}<div class="grid2">${tbl(`Counter Terminals assigned to ${b.name}`, ["Counter Terminal", "Status", "Last use"], tRows)}${tbl(`Institution Users at ${b.name}`, ["Name", "Role"], uRows)}</div></div></div></section>`;
        })
        .join("");
      const firstFrom = i.branches
        .map((b) => b.accFrom)
        .sort((a, b) => new Date(a) - new Date(b))[0];
      const reg = panelHtml(
        "Registered details",
        `<div class="stack">${detail([
          ["Institution name", esc(i.name)],
          ["Type", esc(i.type)],
          ["Owner", esc(i.owner)],
          ["Status", status(i.status)],
          ["Accredited since", esc(firstFrom || "—")],
          ["Branches", int(i.branches.length)],
        ])}<p class="text-muted">To change these details, contact the Province's Agapay office.</p></div>`,
      );
      return `${viewBanner()}<div class="stack">${head("Overview", sub())}${t}${branches}${reg}</div>`;
    },
  });

  /* ---------- ID-02 Sales summary ---------- */
  const PERIODS = [
    ["nov", "This month (Nov 2026)"],
    ["oct", "Last month (Oct 2026)"],
  ];
  const inPeriod = (t, per) => {
    const d = dayOf(t.when);
    return per === "oct" ? d.getMonth() === 9 : d.getMonth() === 10;
  };
  function figures(list) {
    const c = list.filter(counted);
    const credits = c.reduce((a, t) => a + t.credits, 0);
    return {
      credits,
      n: c.length,
      benes: new Set(c.map((t) => t.bene)).size,
      avg: c.length ? credits / c.length : 0,
      cash: c.reduce((a, t) => a + (t.cash || 0), 0),
      disc: c.reduce((a, t) => a + (t.discount || 0), 0),
    };
  }
  P.screen("ID-02", {
    title: "Sales summary",
    render: () => {
      const per = P.get("form.id02.period") || "nov",
        prevPer = per === "nov" ? "oct" : null;
      const all = txIn();
      const f = figures(all.filter((t) => inPeriod(t, per))),
        pf = prevPer ? figures(all.filter((t) => inPeriod(t, prevPer))) : null;
      const cmp = (v, pv, money) =>
        pf
          ? `${ic(v >= pv ? "arrow-up" : "arrow-down")}Previous period ${money ? fmt(pv) : int(pv)}`
          : "";
      const t = tiles([
        [
          "Program sales (Credits)",
          fmt(f.credits),
          cmp(f.credits, pf && pf.credits, true),
        ],
        ["Transactions", int(f.n), cmp(f.n, pf && pf.n)],
        ["Beneficiaries served", int(f.benes), cmp(f.benes, pf && pf.benes)],
        ["Average sale (Credits)", fmt(f.avg), cmp(f.avg, pf && pf.avg, true)],
      ]);
      const i = inst();
      const chart = P.barChart(
        `Program sales by Branch, ${PERIODS.find((p) => p[0] === per)[1]}`,
        reach().map((id) => {
          const b = P.branch(id);
          const tx = all.filter((x) => x.branch === id);
          return [
            b.name.replace(/ Branch$/, ""),
            figures(tx.filter((x) => inPeriod(x, per))).credits,
            prevPer
              ? figures(tx.filter((x) => inPeriod(x, prevPer))).credits
              : null,
          ];
        }),
        {
          fmt,
          legend: prevPer ? "Bar: this period. Thin line: previous period" : "",
        },
      );
      const comparing = isHO() && P.tab("id02-compare", "") === "on";
      let compare = "";
      if (comparing) {
        const cols = i.branches.map((b) => ({
          b,
          f: figures(
            P.db.tx.filter((x) => x.branch === b.id && inPeriod(x, per)),
          ),
        }));
        const rowsDef = [
          ["Program sales (Credits)", (x) => fmt(x.credits)],
          ["Transactions", (x) => int(x.n)],
          ["Beneficiaries served", (x) => int(x.benes)],
          ["Average sale (Credits)", (x) => fmt(x.avg)],
          ["Discounts given", (x) => peso(x.disc)],
          ["Cash collected", (x) => peso(x.cash)],
        ];
        compare = panelHtml(
          "Compare Branches",
          `<div class="table-wrap"><table class="data-table"><caption class="visually-hidden">Branches side by side</caption><thead><tr><th scope="col">Figure</th>${cols.map((c) => `<th scope="col" class="data-table__amount">${esc(c.b.name)}</th>`).join("")}</tr></thead><tbody>${rowsDef.map(([l, fn]) => `<tr><th scope="row">${l}</th>${cols.map((c) => `<td class="data-table__amount tabular">${fn(c.f)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`,
          {
            raw: true,
            right: btn("Close comparison", "id.compare", { v: "off" }),
          },
        );
      }
      const actions = isHO()
        ? btn(
            comparing ? "Close comparison" : "Compare Branches",
            "id.compare",
            { v: comparing ? "off" : "on", icon: "chart-column" },
          )
        : "";
      return `${viewBanner()}<div class="stack">${head("Sales summary", sub(), actions)}${filterBar(field("Period", select("form.id02.period", PERIODS)))}<p class="text-muted">Figures include Transactions up to ${P.TODAY}, ${P.now()}.</p>${t}${compare}${chart}</div>`;
    },
  });
  P.action("id.compare", (v) => {
    P.S.ui.tab["id02-compare"] = v;
    if (v === "on") {
      P.mark("idCompared");
      P.audit("Viewed Branch comparison", inst().name);
    }

  /* ---------- ID-03 Transactions ---------- */
  const F3 = () =>
    P.S.form.id03 ||
    (P.S.form.id03 = { q: "", from: "26 Oct 2026", to: P.TODAY, user: "" });
  function filtered() {
    const f = F3(),
      q = String(f.q || "").replace(/\s/g, "");
    const from = f.from ? new Date(f.from) : null,
      to = f.to ? new Date(f.to) : null;
    return txIn()
      .filter((t) => {
        const d = dayOf(t.when);
        if (from && !isNaN(from) && d < from) return false;
        if (to && !isNaN(to) && d > to) return false;
        if (f.user && staffOf(t) !== f.user) return false;
        if (q) {
          const b = P.bene(t.bene);
          if (
            t.no !== q.padStart(4, "0") &&
            !(b && b.pid.replace(/\s/g, "") === q) &&
            !(q.length === 4 && b && b.pid.endsWith(q) && t.no !== q)
          )
            return false;
        }
        return true;
      })
      .sort(
        (a, b) =>
          new Date(b.when.replace(",", "")) - new Date(a.when.replace(",", "")),
      );
  }
  function txRow(t, withBranch) {
    const b = P.bene(t.bene),
      br = P.branch(t.branch);
    const pres =
      t.presenter && t.presenter !== "Beneficiary"
        ? `<span class="data-table__row-detail"><span>Presented by <b>${esc(t.presenter)}</b></span></span>`
        : "";
    return `<tr><th scope="row"><a class="tabular" href="#" data-a="id.openTx" data-v="${esc(t.no)}|${esc(t.branch)}">${esc(t.no)}</a><span class="data-table__row-detail"><span>Institution User <b>${esc(staffOf(t))}</b></span>${withBranch ? `<span>Branch <b>${esc(br.name)}</b></span>` : ""}</span></th><td class="tabular">${esc(t.when)}</td><td><span style="display:block">${esc(b.name)}</span><span style="display:block">${maskedId(b.pid)}</span>${pres}</td><td class="data-table__amount tabular">${fmt(t.credits)}</td><td>${position(t)}</td></tr>`;
  }
  const txTable = (caption, list, withBranch) =>
    `<div class="table-wrap"><table class="data-table"><caption class="visually-hidden">${esc(caption)}</caption><thead><tr><th scope="col">Transaction number</th><th scope="col" aria-sort="descending">Date and time</th><th scope="col">Beneficiary</th><th scope="col" class="data-table__amount">Credits deducted</th><th scope="col">Settlement position</th></tr></thead><tbody>${list.map((t) => txRow(t, withBranch)).join("")}</tbody></table></div>`;
  P.screen("ID-03", {
    title: "Transactions",

      const fb = filterBar(
        `<label class="field" style="flex:1 1 260px"><span class="field__label">Transaction number or Program ID number</span>${input("form.id03.q", { type: "search" })}</label>${field("From (day month year)", input("form.id03.from"))}${field("To (day month year)", input("form.id03.to"))}${field("Institution User", select("form.id03.user", [["", "All Institution Users"]].concat(users.map((u) => [u, u]))))}${chips}`,
      );

      const body = list.length
        ? panelHtml(
            "",
            txTable(`Transactions, ${reachLabel()}`, list, allBranches()),
            {
              raw: true,
              footer: `<nav class="pagination" aria-label="Pagination, Transactions"><span class="pagination__summary">1 to ${list.length} of ${list.length} Transactions</span></nav>`,
            },
          )
        : `<div class="state-message" role="status"><span class="icon icon--lg icon--search state-message__icon"></span><h3 class="state-message__title">${q ? `No match for ${esc(shownQ)}.` : "No Transactions in these dates."}</h3><p class="state-message__body">Check the Transaction number, or change the dates or the Branch.</p></div>`;
      return `${viewBanner()}<div class="stack">${head("Transactions", sub(), exportBtn)}${fb}${body}</div>`;
    },
  });

  /* ---------- ID-04 Transaction detail (Side panel) ---------- */
  P.panel("ID-04", ({ no, br }) => {
    const t = P.db.tx.find((x) => x.no === no && (!br || x.branch === br));
    if (
      !t ||
      !reach()
        .concat(inst().branches.map((b) => b.id))
        .includes(t.branch)
    )
      return {
        title: "Transaction",
        body: stateMsg("lock", "This record cannot be opened.", ""),
      };
    const b = P.bene(t.bene),
      branch = P.branch(t.branch),

    let note = "";
    if (t.status === "held" && t.hold)
      note = alert(

        "triangle-alert",
      );
    if (t.status === "reversed") {

      const ap = P.db.approvals.find(

      );

        typeof rv === "string"

      note = alert(

      );
    }
    if (t.status === "voided")

      );
    const lines = t.lines

      )
      .join("");
    const body = `<div class="stack">${note}${detail([["Date and time", `<span class="tabular">${esc(t.when)}</span>`], ["Branch", esc(branch.name)], ["Institution User", esc(staffOf(t))], ["Settlement position", position(t)], ["Beneficiary", `${esc(b.name)} · ${maskedId(b.pid)}`, true], t.presenter && t.presenter !== "Beneficiary" ? ["Presented by", esc(t.presenter), true] : null, t.rx && t.rx.name ? ["Prescription", `${esc(t.rx.name)}, license ${esc(t.rx.license)}${t.rx.date ? `, ${esc(t.rx.date)}` : ""}`, true] : null, t.stmt && P.statement(t.stmt) && visibleStmt(P.statement(t.stmt)) ? ["Settlement Statement", link(P.statement(t.stmt).period, "ID-07", { id: t.stmt }), true] : null])}
<section class="panel" aria-label="Sale lines"><div class="table-wrap"><table class="data-table"><caption>Sale lines. ${t.lines.length} results</caption><thead><tr><th scope="col">${ph ? "Item" : "Service category"}</th><th scope="col" class="data-table__amount">Amount</th></tr></thead><tbody>${lines}</tbody></table></div></section>
<section class="panel" aria-label="Amounts"><div class="table-wrap"><table class="data-table" aria-label="Amounts"><tbody><tr><th scope="row">Total</th><td class="data-table__amount">${peso(t.total)}</td></tr><tr><th scope="row">Discount amount</th><td class="data-table__amount">${peso(t.discount)}</td></tr><tr><th scope="row">Cash paid</th><td class="data-table__amount">${peso(t.cash)}</td></tr><tr class="data-table__total"><th scope="row">Credits deducted</th><td class="data-table__amount">${fmt(t.credits)} Credits</td></tr></tbody></table></div></section></div>`;

  });

  /* ---------- ID-05 Analytics ---------- */
  P.screen("ID-05", {
    title: "Analytics",
    render: () => {
      P.mark("idAnalytics");
      const per = P.get("form.id05.period") || "nov";

      const items = {};
      list.forEach((t) =>
        t.lines.forEach(([n, q, p]) => {
          items[n] = (items[n] || 0) + q * p;
        }),
      );
      const top = Object.entries(items)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 6);
      const hours = {};
      list.forEach((t) => {
        const h = hourOf(t.when);
        if (h != null) hours[h] = (hours[h] || 0) + 1;
      });
      const hrRows = Array.from({ length: 10 }, (_, i) => i + 8).map((h) => [
        hourLabel(h),
        hours[h] || 0,
      ]);
      const byUser = {},
        byTerm = {};
      list.forEach((t) => {
        byUser[staffOf(t)] = (byUser[staffOf(t)] || 0) + t.credits;
        const terms = P.db.terminals.filter((x) => x.branch === t.branch);
        const term =
          t.terminal ||
          (terms.length ? terms[+t.no % terms.length].serial : "Not recorded");
        byTerm[term] = (byTerm[term] || 0) + t.credits;
      });
      const groups = {};
      const ages = (a) =>
        a < 60
          ? "Under 60"
          : a < 70
            ? "60 to 69"
            : a < 80
              ? "70 to 79"

      const seen = {};
      list.forEach((t) => {

            ([u, v]) =>
              `<tr><th scope="row">${esc(u)}</th><td class="data-table__amount tabular">${fmt(v)}</td></tr>`,

        { raw: true },
      )}${panelHtml(
        "Activity per Counter Terminal",
        simple(
          "Activity per Counter Terminal",
          ["Counter Terminal", "Credits deducted$"],
          Object.entries(byTerm).map(
            ([u, v]) =>

${panelHtml("Totals by age group and sex", simple("Totals by age group and sex", ["Age group", "Sex", "Beneficiaries$", "Credits deducted$"], gRows), { raw: true, footer: '<span class="text-muted">Groups of fewer than 5 Beneficiaries show as "fewer than 5". No names are shown here.</span>' })}</div>`;
