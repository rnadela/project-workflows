      { bene: b.key, reason: f.waiveReason.trim() },
    );
    b.feeDue = { status: "waiver pending", approval: a.id };
    hist(b, `Fee waiver requested. Reason: ${f.waiveReason.trim()}`);
    P.mark("flow17.waiverRequested");
    P.mark("uj6.waiver");
    P.closePanel();
    P.toast(
      "Fee waiver sent for approval",
      `${b.name}. The replacement is unlocked when an approver waives the fee.`,
    );
  };

  /* Card Stock (flow 19) */
  A["ben.batchOpen"] = (v) => {
    if (!v) P.S.form.batch = null;
    P.openPanel("ben.batch", v ? { batch: v } : {});
  };
  A["ben.batchSave"] = () => {
    const f = P.get("form.batch"),
      n = parseInt(String(f.count).replace(/,/g, ""), 10);
    stock().push({
      batch: f.batch.trim(),
      received: f.received.trim() || P.TODAY,
      count: n,
      used: 0,
      by: P.who(),
      serials: `${f.firstSerial.trim()} onward, ${int(n)} Cards`,
    });
    P.audit("Registered Card Stock batch", f.batch.trim());
    P.mark("flow19.stockRegistered");
    P.closePanel();
    P.toast(
      "Batch registered",
      `${f.batch.trim()}: ${int(n)} Cards. The registered and remaining counts rose.`,
    );
  };

  /* Card design (flow 18) */
  A["ben.designNew"] = () => {
    P.db.cardDesign.draft = {
      name: "Agapay Card 2027",
      front: null,
      back: null,
      err: {},
      place: Object.assign(defaultPlace(), {
        category: { side: "Front", size: "6", bg: "panel" },
        address: { side: "Back", size: "7", bg: "art" },
      }),
    };
    Object.values(P.db.cardDesign.draft.place).forEach((p) => {
      p.size = String(p.size);
    });
    P.audit("Started Card design draft", "Agapay Card 2027");
  };
  A["ben.art"] = (v, el) => {
    const d = P.db.cardDesign.draft;
    if (/:bad$/.test(v)) {
      const side = v.split(":")[0];
      d[side] = null;
      d.err[side] =
        "This artwork is 1200 × 1200 pixels, a square. A Card is 85.6 by 54 mm, about 1.586 to 1. Use artwork of 1012 × 638 pixels or larger at that proportion.";
      return;
    }
    d.err[v] = "";
    d[v] = el.dataset.f || null;
  };
  A["ben.designDiscard"] = () => {
    P.db.cardDesign.draft = null;
    P.toast("Draft discarded", "The active design is unchanged.");
  };
  A["ben.designActivate"] = () => {
    const cd = P.db.cardDesign;
    P.confirm({
      title: "Make this design active?",
      ok: "Make active",
      body: `<p>Every Card printed from now uses “${esc(cd.draft.name)}”. Cards already issued keep their design.</p>`,
      action: () => {
        cd.active = cd.draft.name;
        cd.activeSince = P.TODAY;
        cd.place = cd.draft.place;
        cd.draft = null;
        P.audit("Made Card design active", cd.active);
        P.mark("flow18.designActive");
        P.toast("Design active", `${cd.active}. It is used for later prints.`);
      },
    });
  };

  Object.assign(P.actions, A);
})();

</script>
    <script>
/* Agapay clickable prototype: Credits, Approvals, Institutions, Counter Terminals.
   Screens AD-15 to AD-22. Registers the approval types award, adjustment, allocation.
   Never caches P.S or P.db: Start over replaces them. */
(() => {
  "use strict";
  const P = window.P;
  const {
    esc,
    fmt,
    int,
    num,
    ic,
    btn,
    field,
    input,
    select,
    checkbox,
    radios,
    reasonField,
    reasonOff,
    crumbs,
    head,
    panel,
    table,
    pager,
    detail,
    stateMsg,
    alert,
    tabs,
    link,
    status,
    badge,
    filterBar,
  } = P;

  /* ---------- local helpers ---------- */
  /* core's Object.assign(P, {panel}) replaces the P.panel registry with the HTML helper, so register panels directly */
  const regPanel = (id, fn) => {
    P.panels[id] = fn;
  };
  const F = () => {
    const S = P.S;
    S.form.cr = S.form.cr || {};
    return S.form.cr;
  };
  const errOn = (...names) => names.some((n) => P.S.ui.err[n]);
  const MON = [
    "Jan",
    "Feb",
    "Mar",
    "Apr",
    "May",
    "Jun",
    "Jul",
    "Aug",
    "Sep",
    "Oct",
    "Nov",
    "Dec",
  ];
  const TODAY_D = new Date(2026, 10, 11);
  /* Accepts DD/MM/YYYY or "D Mon YYYY". Returns a Date or null. */
  function parseDate(s) {
    s = String(s || "").trim();
    let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if (m) {
      const d = new Date(+m[3], +m[2] - 1, +m[1]);
      return d.getMonth() === +m[2] - 1 ? d : null;
    }
    m = s.match(/^(\d{1,2}) ([A-Za-z]{3})[a-z]* (\d{4})$/);
    if (m) {
      const mi = MON.findIndex((x) => x.toLowerCase() === m[2].toLowerCase());
      if (mi < 0) return null;
      const d = new Date(+m[3], mi, +m[1]);
      return d.getMonth() === mi ? d : null;
    }
    return null;
  }
  const fmtDate = (d) =>
    `${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}`;
  const daysUntil = (s) => {
    const d = parseDate(s);
    return d ? Math.round((d - TODAY_D) / 86400000) : null;
  };
  /* "10 Nov 2026, 4:10 PM" to a sortable number */
  function whenNum(s) {
    const [dp, tp] = String(s || "").split(", ");
    const d = parseDate(dp);
    if (!d) return 0;
    let mins = 0;
    const m = (tp || "").match(/(\d+):(\d+) (AM|PM)/);
    if (m) mins = ((+m[1] % 12) + (m[3] === "PM" ? 12 : 0)) * 60 + +m[2];
    return d.getTime() + mins * 60000;
  }
  const slug = (s) =>
    String(s)
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, "-")
      .replace(/^-|-$/g, "");
  const showErr = (s, name) => s.replace("Give a reason", "Give a " + name);
  const footerRow = (html) =>
    `<div class="row" style="justify-content:flex-end">${html}</div>`;
  const firstName = (whoStr) => String(whoStr || "").split(",")[0];

  /* ================================================================
   Approval types (FR-14). Other modules register feeWaiver, reversal.
   ================================================================ */
  const typeLabel = (t) =>
    (P.approvalTypes[t] && P.approvalTypes[t].label) ||
    t.charAt(0).toUpperCase() + t.slice(1);
  const typeShort = (t) =>
    (P.approvalTypes[t] &&
      (P.approvalTypes[t].short || P.approvalTypes[t].label)) ||
    typeLabel(t);
  const refEntries = (id) => P.db.ledger.filter((l) => l.ref === id);
  const dropRef = (id) => {
    P.db.ledger = P.db.ledger.filter((l) => l.ref !== id);
  };

  P.approvalTypes.award = {
    label: "Award",
    apply(item) {
      const pl = item.payload,
        skipped = [];
      refEntries(item.id).forEach((l) => {
        const b = P.bene(l.bene);
        if (!b || ["suspended", "closed"].includes(b.status)) {
          skipped.push(l.bene);
          l.skip = true;
        } else l.status = "posted";
      });
      P.db.ledger = P.db.ledger.filter((l) => !(l.ref === item.id && l.skip));
      (pl.recipients || []).forEach((k) => {
        const b = P.bene(k);
        if (
          b &&
          ["suspended", "closed"].includes(b.status) &&
          !skipped.includes(k)
        )
          skipped.push(k);
      });
      pl.skipped = skipped.map((k) => {
        const b = P.bene(k);
        return { key: k, name: b.name, status: b.status };
      });
      const aw = P.db.awards.find((a) => a.approval === item.id);
      if (aw) {
        aw.status = "approved";
        aw.skipped = pl.skipped.length;
      }
      P.mark("awardApproved");
    },
    reject(item) {
      dropRef(item.id);
      const aw = P.db.awards.find((a) => a.approval === item.id);
      if (aw) aw.status = "rejected";
      P.mark("awardRejected");
    },
    detail: (item) => awardBody(item),
  };

  P.approvalTypes.adjustment = {
    label: "Adjustment",
    apply(item) {
      const pl = item.payload,
        e = refEntries(item.id);
      if (e.length)
        e.forEach((l) => {
          l.status = "posted";
        });
      else
        P.db.ledger.push({
          bene: pl.bene,
          date: P.TODAY,
          label: "Adjustment: " + pl.reason,
          amount: pl.amount,
          status: "posted",
          by: item.by,
          ref: item.id,
        });
    },
    reject(item) {
      dropRef(item.id);
    },
    detail(item) {
      const pl = item.payload,
        b = P.bene(pl.bene);
      if (!b) return "";
      return panel(
        "Beneficiary",
        `<div class="stack">${detail([
          [
            "Beneficiary",
            link(b.name, "AD-02", { bene: b.key, tab: "Credits" }),
          ],
          ["Program ID number", `<span class="tabular">${esc(b.pid)}</span>`],
          ["Status", status(b.status)],
          ["Direction", pl.amount >= 0 ? "Upward" : "Downward"],
          [
            "Amount",
            `<span class="tabular">${pl.amount < 0 ? "−" : "+"}${fmt(Math.abs(pl.amount))}</span> Credits`,
          ],
          pl.expiry ? ["Credits expire on", esc(pl.expiry)] : null,
          ["Reason", esc(pl.reason), true],
        ])}${P.balanceBoxes(b)}</div>`,
      );
    },
  };

  P.approvalTypes.allocation = {
    label: "Allocation amount change",
    short: "Allocation change",
    apply(item) {
      const db = P.db,
        pl = item.payload;
      db.allocation = Object.assign({}, pl.to);
      db.allocationPending = null;
      db.allocationHistory.unshift({
        when: P.stamp(),
        what:
          "Yearly Allocation amounts changed: " +
          allocDiff(pl) +
          ". Applies from the next grant, 1 Jan 2027.",
        by: `${firstName(item.by)}, approved by ${P.who()}`,
      });
    },
    reject(item) {
      const db = P.db;
      db.allocationPending = null;
      db.allocationHistory.unshift({
        when: P.stamp(),
        what:
          "Allocation amount change rejected: " + allocDiff(item.payload) + ".",
        by: P.who(),
      });
    },
    detail(item) {
      const pl = item.payload;
      const rows = Object.keys(pl.to).map(
        (c) =>
          `<tr><th scope="row">${esc(c)}</th><td class="data-table__amount tabular">${fmt(pl.from[c])}</td><td class="data-table__amount tabular">${fmt(pl.to[c])}</td></tr>`,
      );
      return panel(
        "Amounts",
        table(
          "Allocation amounts",
          ["Beneficiary category", "Now, Credits$", "New, Credits$"],
          rows,
        ),
        {
          raw: true,
          footer: `<p class="text-muted">Applies from the next grant, 1 Jan 2027. Balances already granted do not change.${pl.note ? " Note: " + esc(pl.note) : ""}</p>`,
        },
      );
    },
  };
  const allocDiff = (pl) =>
    Object.keys(pl.to)
      .filter((c) => pl.to[c] !== pl.from[c])
      .map((c) => `${c} ${fmt(pl.from[c])} to ${fmt(pl.to[c])}`)
      .join(", ");

  /* ================================================================
   AD-15 Allocation (flow 16)
   ================================================================ */
  P.screen("AD-15", {
    title: "Allocation",
    render() {
      const db = P.db,
        pend = db.allocationPending;
      const pendItem = pend && db.approvals.find((a) => a.id === pend.approval);
      const rows = Object.keys(db.allocation).map(
        (c) =>
          `<tr><th scope="row">${esc(c)}</th><td class="data-table__amount tabular">${fmt(db.allocation[c])}</td><td>${pend && pend.to[c] !== db.allocation[c] ? `<span class="tabular">${fmt(pend.to[c])}</span> ${status("pending")}` : '<span class="text-muted">No change</span>'}</td></tr>`,
      );
      const can = P.hasRole("credits officer");
      const offWhy = !can
        ? "Only a credits officer changes the amounts."
        : pend
          ? "A change is waiting for an approver."
          : "";
      const hist = db.allocationHistory.map(
        (h) =>
          `<tr><th scope="row" class="tabular">${esc(h.when)}</th><td>${esc(h.what)}</td><td>${esc(h.by)}</td></tr>`,
      );
      return `${head("Allocation", "Yearly Allocation for each Beneficiary category. Each change needs an approver.", `${reasonOff(offWhy)}${btn("Change amounts", "cr.allocOpen", { kind: "primary", icon: "pencil", off: !!offWhy })}`)}
      <div class="stack">
      ${pend ? alert("A change is waiting for an approver.", `${esc(allocDiff(pend))}. Submitted by ${esc(pendItem ? pendItem.by : "")}. It applies from the next grant, 1 Jan 2027. ${pendItem ? link("Open in Approvals", "AD-18", { item: pendItem.id }) : ""}`, "info") : ""}
      ${panel("Yearly Allocation amounts", table("Yearly Allocation amounts", ["Beneficiary category", "Credits per year$", "Waiting for approval"], rows), { raw: true, footer: '<p class="text-muted">A new amount applies from the next grant. Balances already granted do not change.</p>' })}
      ${alert("Year end", "Unused Credits expire at 11:59 PM, 31 Dec 2026, Philippine time. The next Yearly Allocation is granted to every active Beneficiary on 1 Jan 2027 at the amounts shown above.", "calendar")}
      ${panel("History", table("Allocation history", ["When", "What", "By"], hist), { raw: true })}
      </div>`;
    },
  });
  P.action("cr.allocOpen", () => {
    const f = F();
    f.alloc = Object.assign(
      {},
      ...Object.entries(P.db.allocation).map(([k, v]) => ({ [k]: fmt(v) })),
    );
    f.allocNote = "";
    P.openPanel("AD-15-change");
  });
  function allocProblems() {
    const f = F(),
      db = P.db,
      cats = Object.keys(db.allocation);
    const vals = cats.map((c) => num(f.alloc && f.alloc[c]));
    if (vals.some((v) => v <= 0))
      return "Enter an amount above 0.00 for every category.";
    if (cats.every((c, i) => vals[i] === db.allocation[c]))
      return "Change at least one amount.";
    return "";
  }
  regPanel("AD-15-change", () => {
    const db = P.db,
      err = errOn("cr.allocSubmit"),
      why = allocProblems();
    const fields = Object.keys(db.allocation)
      .map((c) =>
        field(
          `${c} (Credits per year)`,
          input("form.cr.alloc." + c, { mode: "decimal" }),
          `Now ${fmt(db.allocation[c])}`,
        ),
      )
      .join("");
    return {
      title: "Change Allocation amounts",
      body: `<div class="stack"><p class="text-muted">An approver decides. A new amount applies from the next grant, 1 Jan 2027.</p>${fields}${field("Note for the approver (optional)", P.textarea("form.cr.allocNote"))}${err && why ? `<span class="field__error">${esc(why)}</span>` : ""}</div>`,
      footer: `${reasonOff(why)}${btn("Cancel", "closePanel")}${btn("Submit change", "cr.allocSubmit", { kind: "primary", off: !!why })}`,
    };
  });
  P.action("cr.allocSubmit", () => {
    const f = F(),
      db = P.db,
      from = Object.assign({}, db.allocation),
      to = {};
    Object.keys(from).forEach((c) => {
      to[c] = num(f.alloc[c]);
    });
    const pl = { from, to, note: (f.allocNote || "").trim() };
    const a = P.submitApproval(
      "allocation",
      "Yearly Allocation amounts",
      allocDiff(pl) + ". Applies from the next grant.",
      pl,
    );
    db.allocationPending = { approval: a.id, from, to };
    P.closePanel();
    P.toast("Allocation change submitted", "It waits for an approver.");
  });

  /* ================================================================
   AD-16 Awards (UJ-5, FR-13)
   ================================================================ */
  const UJ5 = () => ({
    name: "Typhoon Kristine relief",
    amount: "2,000.00",
    reason:
      "Governor’s order for the three municipalities hit by Typhoon Kristine.",
    expiry: "31/12/2026",
    munis: { "San Isidro": true, "Santa Rosa": true, "Bagong Silang": true },
    people: [],
    tab: "group",
    q: "",
    tap: { paired: false, state: "idle" },
  });
  const SRC = {
    pick: "Picked",
    tap: "Card tap",
    upload: "Uploaded list",
  };
  const simBtn = (label, a, v) =>
    `<button class="p-btn sim-tap" type="button" data-a="${a}"${v != null ? ` data-v="${esc(v)}"` : ""}>${ic("nfc")}${esc(label)}</button>`;
  const awardMunis = (d) => P.MUNIS.filter((m) => d.munis && d.munis[m]);
  const muniCount = (munis) =>
    munis.reduce((t, m) => t + (P.MUNI_COUNTS[m] || 0), 0);
  const sampleIn = (munis) =>
    P.db.benes.filter(
      (b) => munis.includes(b.muni) && b.status !== "pre-enrolled",
    );
  /* People added one by one who are not already inside a picked municipality */
  const extraPeople = (d) => {
    const munis = awardMunis(d);
    return (d.people || []).filter((p) => {
      const b = P.bene(p.key);
      return b && !munis.includes(b.muni);
    });
  };
  const awardCount = (d) => muniCount(awardMunis(d)) + extraPeople(d).length;
  /* Why a record cannot join an Award, or "" */
  const cannotAdd = (b) =>
    b.status === "pre-enrolled"
      ? "Pre-enrolled records cannot receive an Award."
      : b.status === "closed"
        ? "This record is closed."
        : "";
  const onAward = (d, b) =>
    (d.people || []).some((p) => p.key === b.key) ||
    awardMunis(d).includes(b.muni);
  function awardProblems(d) {
    const p = [],
      exp = parseDate(d.expiry);
    if (!awardCount(d)) p.push("add at least one recipient");
    if (!String(d.name || "").trim()) p.push("enter the Award name");
    if (num(d.amount) <= 0) p.push("enter the Credits for each Beneficiary");
    if (String(d.reason || "").trim().length < 10)
      p.push("give a reason of at least 10 characters");
    if (!exp || exp < TODAY_D) p.push("enter an expiry date from today on");
    return p;
  }
  P.screen("AD-16", {
    title: "Awards",
    render(pr) {
      return pr.form === "new" ? newAward() : awardsList();
    },
  });
  function awardsList() {
    const db = P.db,
      me = P.who();
    /* A draft is seen only by the credits officer who started it */
    const rows = db.awards
      .filter((a) => a.status !== "draft" || a.by === me)
      .map((a) => {
        const st = a.status === "pending" ? "pending" : a.status;
        return `<tr><th scope="row">${P.actionLink(a.name, "cr.awardOpen", a.id)}</th><td>${status(st)}</td><td class="tabular">${int(a.count)}</td><td class="data-table__amount tabular">${fmt(a.amount)}</td><td class="tabular">${a.status === "draft" ? `<span class="text-muted">Saved ${esc(a.when)}</span>` : esc(a.when)}</td></tr>`;
      });
    const can = P.hasRole("credits officer");
    return `${head("Awards", "Extra Credits for one person, people you pick, or a whole group. Each Award needs an approver.", `${reasonOff(can ? "" : "Only a credits officer starts an Award.")}${btn("New Award", "cr.newAward", { kind: "primary", icon: "plus", off: !can })}`)}
    ${panel("Awards this year", table("Awards", ["Award", "Status", "Recipients", "Credits each$", "Submitted"], rows, "No Awards yet"), { raw: true })}`;
  }
  P.action("cr.newAward", () => {
    F().award = UJ5();
    P.go("AD-16", { form: "new" });
  });
  P.action("cr.awardOpen", (v) => {
    const aw = P.db.awards.find((a) => a.id === v);
    if (aw && aw.status === "draft") {
      F().award = JSON.parse(JSON.stringify(aw.form));
      F().award.draftId = aw.id;
      F().award.tap = { paired: false, state: "idle" };
      P.go("AD-16", { form: "new" });
      return;
    }
    P.openPanel("AD-16-award", { id: v });
  });

  /* ---------- recipient builder: four ways to add, one list ---------- */
  function groupTab(d, err) {
    const checks = P.MUNIS.map((m) =>
      checkbox(
        "form.cr.award.munis." + m,
        `${esc(m)} <span class="text-muted tabular">· ${int(P.MUNI_COUNTS[m])} Beneficiaries</span>`,
      ),
    ).join("");
    return `<div class="stack"><p class="text-muted">Active and suspended Beneficiaries in these municipalities. Pre-enrolled records are never included.</p>${filterBar(`<div class="check-list">${checks}</div>`)}${err && !awardCount(d) ? '<span class="field__error">Add at least one recipient.</span>' : ""}</div>`;
  }
  function pickTab(d) {
    const q = String(d.q || "")
      .trim()
      .toLowerCase();
    const hits = q
      ? P.db.benes
          .filter(
            (b) =>
              b.name.toLowerCase().includes(q) ||
              (b.pid &&
                b.pid.replace(/ /g, "").includes(q.replace(/ /g, ""))) ||
              String(b.idNo || "")
                .toLowerCase()
                .includes(q),
          )
          .slice(0, 6)
      : [];
    const rows = hits.map((b) => {
      const no = cannotAdd(b),
        on = onAward(d, b);
      const act = no
        ? `<span class="text-muted">${esc(no)}</span>`
        : on
          ? '<span class="text-muted">On this Award</span>'
          : btn("Add", "cr.awAdd", {
              v: b.key,
              icon: "plus",
              data: { src: "pick" },
              label: "Add " + b.name,
            });
      return `<tr><th scope="row">${esc(b.name)}<span class="data-table__row-detail"><span>Program ID number <b class="tabular">${esc(b.pid || "not given yet")}</b></span></span></th><td>${esc(b.muni)}</td><td>${status(b.status)}</td><td>${act}</td></tr>`;
    });
    return `<div class="stack">${field("Search Beneficiaries", input("form.cr.award.q", { type: "search", placeholder: "Name, Program ID number, or government ID number" }), "Try “Perla”, “Teresita”, or “Corazon”.")}${q ? table("Search results", ["Beneficiary", "Municipality", "Status", ""], rows, "No Beneficiary matches the search") : ""}</div>`;
  }
  function tapTab(d) {
    const t = d.tap || (d.tap = { paired: false, state: "idle" });
    if (!t.paired) {
      if (t.state === "qr")
        return `<div class="stack"><p>Scan this code with the Office Station. It works for 60 seconds.</p><div class="tap-prompt" role="status">${ic("wifi")}<h3 class="tap-prompt__title">Scan to pair</h3><p class="tap-prompt__body">Open Pair on the Office Station and point it at the screen.</p></div>${simBtn("Simulate: the Office Station scans the code", "cr.awPair", "scanned")}<div class="row">${btn("Cancel", "cr.awPair", { v: "cancel" })}</div></div>`;
      if (t.state === "confirm")

    if (v === "start") t.state = "qr";
    else if (v === "scanned") t.state = "confirm";
    else if (v === "ok") {
      t.paired = true;
      t.state = "ready";
      P.audit("Paired Office Station OS-PROV-02", "Award draft");
    } else if (v === "unpair") {
      t.paired = false;
      t.state = "idle";

      );
    } else t.state = "idle";

  P.action("cr.awTap", (v) => {
    const d = F().award,
      t = d.tap;
    if (v === "ready") {
      t.state = "ready";
      return;
    }
    const refuse = (title, body) =>
      Object.assign(t, { state: "refused", title, body });
    if (v === "copied") {
      P.audit("Refused Tap: Card not genuine", "Office Station OS-PROV-02");
      return refuse(
        "This Card cannot be used",
        "The Card is not genuine. No one was added. The refusal was recorded.",
      );
    }
    if (v === "offline")
      return refuse(
        "No connection",
        "The Tap needs a connection. No one was added. Try again when the tablet is back online.",
      );
    const b = P.bene(v);
    if (onAward(d, b))
      return refuse(
        "Already on this Award",
        `${b.name} is already on the list.`,
      );
    if (cannotAdd(b)) return refuse("Not added", cannotAdd(b));
    t.state = "reading";
    t.key = v;

      .trim()
      .toLowerCase();
    const shown = recips.filter(
      (b) =>
        !q ||
        b.name.toLowerCase().includes(q) ||

        [
          "Total",
          `<span class="tabular">${fmt((pl.count || 0) * (pl.amount || 0))}</span> Credits`,
        ],
        pl.munis && pl.munis.length

              `<span class="tabular">${int(pl.people)}</span> people`,
            ]

    const list = recips.length

  P.openAdjustment = (key) => P.openPanel("AD-17", { bene: key });
  function adjForm(key) {
    const f = F();
    f.adj = f.adj || {};

      f.adj[key] = { dir: "up", amount: "", reason: "", expiry: "31/12/2026" };

  function adjProblems(b, d) {
    const p = [],
      amt = num(d.amount);
    if (amt <= 0) p.push("enter an amount");
    if (d.dir === "down" && amt > P.available(b))
      p.push("enter an amount no more than the Available Balance");
    if (String(d.reason || "").trim().length < 10)
      p.push("give a reason of at least 10 characters");
    if (d.dir === "up") {
      const e = parseDate(d.expiry);
      if (!e || e < TODAY_D) p.push("enter an expiry date from today on");
    }
    return p;
  }

        title: "Adjustment",

      };
    const d = adjForm(b.key),
      base = "form.cr.adj." + b.key,
      err = errOn("cr.submitAdj");
    const can = P.hasRole("credits officer");
    const probs = can ? adjProblems(b, d) : [];
    const why = !can
      ? "Only a credits officer submits an Adjustment."
      : !["active", "suspended"].includes(b.status)
        ? "This record is not active."
        : probs.length
          ? `To submit, ${probs.join(", ")}.`
          : "";
    const amt = num(d.amount);
    return {
      title: "Adjustment: " + b.name,
      body: `<div class="stack">${P.balanceBoxes(b)}
      <div class="field"><span class="field__label">Direction</span><div class="row">${radios(

      )}</div></div>
      ${field("Credits (required)", input(base + ".amount", { mode: "decimal", err: err && (amt <= 0 || (d.dir === "down" && amt > P.available(b))) }), d.dir === "down" ? `No more than the Available Balance, ${fmt(P.available(b))}.` : "", err && amt <= 0 ? "Enter an amount above 0.00." : err && d.dir === "down" && amt > P.available(b) ? "This is more than the Available Balance." : "")}
      ${showErr(reasonField(base + ".reason", "Reason (required)", 10, err), "reason")}
      ${d.dir === "up" ? field("Credits expire on (required)", input(base + ".expiry", { placeholder: "DD/MM/YYYY" }), "Defaults to the end of the year. DD/MM/YYYY", err && !parseDate(d.expiry) ? "Enter a date as DD/MM/YYYY." : "") : ""}
      <p class="text-muted">${d.dir === "up" ? "Until an approver decides, the Credits show as Pending Credits." : "The Credits come off the Available Balance when an approver approves."}</p></div>`,
      footer: `${reasonOff(why)}${btn("Cancel", "closePanel")}${btn("Submit Adjustment", "cr.submitAdj", { kind: "primary", off: !!why, v: b.key })}`,
    };

  P.action("cr.submitAdj", (v) => {
    const b = P.bene(v),
      d = adjForm(v),
      amt = num(d.amount),
      up = d.dir === "up",
      signed = up ? amt : -amt;
    const exp = up ? fmtDate(parseDate(d.expiry)) : "";
    const a = P.submitApproval(
      "adjustment",
      "Adjustment: " + b.name,
      `${up ? "Upward" : "Downward"}: ${up ? "+" : "−"}${fmt(amt)} Credits. ${d.reason.trim()}`,
      { bene: b.key, amount: signed, reason: d.reason.trim(), expiry: exp },
    );
    if (up)
      P.db.ledger.push({
        bene: b.key,
        date: P.TODAY,

        status: "pending",

    P.closePanel();

      "Adjustment submitted",

  /* ================================================================

  const isApprover = () => P.hasRole("approver");
  const visibleItems = () => {
    const db = P.db;

      ? db.approvals

  };
  P.counts["AD-18"] = (p) =>
    p.roles && p.roles.includes("approver")
      ? P.db.approvals.filter(
          (a) => a.status === "pending" && a.byKey !== p.key,
        ).length
      : 0;
  const decidedWhen = (a) =>
    a.decidedWhen ||
    (String(a.decidedBy).match(/\d{1,2} \w{3} \d{4}.*$/) || [""])[0];
  const decidedWho = (a) =>
    a.decidedWhen
      ? a.decidedBy
      : String(a.decidedBy).replace(/, \d{1,2} \w{3} \d{4}.*$/, "");
  P.screen("AD-18", {
    title: "Approvals",
    render(pr) {
      return pr.item ? approvalItem(pr.item) : approvalsList();
    },
  });
  function approvalsList() {
    const tab = P.tab("AD-18", "pending"),
      type = P.get("form.cr.apType") || "";
    const all = visibleItems();
    const types = [
      ...new Set(
        P.db.approvals.map((a) => a.type).concat(Object.keys(P.approvalTypes)),
      ),
    ];
    let list = all.filter(
      (a) => a.status === tab && (!type || a.type === type),
    );
    list =
      tab === "pending"
        ? list.slice().sort((a, b) => whenNum(a.when) - whenNum(b.when))
        : list
            .slice()
            .sort((a, b) => whenNum(decidedWhen(b)) - whenNum(decidedWhen(a)));
    const decided = tab !== "pending";
    const rows = list.map(
      (a) =>
        `<tr><th scope="row">${link(a.title.replace(/^[^:]+: /, ""), "AD-18", { item: a.id })}</th><td>${esc(typeLabel(a.type))}</td><td>${esc(a.details)}</td><td>${esc(a.by)}</td><td class="tabular">${esc(a.when)}</td>${decided ? `<td>${esc(decidedWho(a))}</td><td class="tabular">${esc(decidedWhen(a))}</td>` : ""}<td>${status(a.status)}</td></tr>`,
    );
    const cols = ["Item", "Type", "Details", "Submitted by", "Submitted"]
      .concat(decided ? ["Approver", "Decided"] : [])
      .concat(["Status"]);
    const n = (s) => all.filter((a) => a.status === s).length;
    return `${head("Approvals", isApprover() ? "Oldest first. Decide one item at a time. You cannot decide items you submitted." : "Items you submitted, and their decisions. An approver decides them.")}
    <div class="stack">
    ${tabs(
      [
        ["pending", `Pending (${n("pending")})`],
        ["approved", `Approved (${n("approved")})`],
        ["rejected", `Rejected (${n("rejected")})`],
      ],
      tab,
    )}
    ${filterBar(field("Type", select("form.cr.apType", [["", "All types"]].concat(types.map((t) => [t, typeLabel(t)])))))}
    ${panel(tab.charAt(0).toUpperCase() + tab.slice(1) + " items", table("Approval items", cols, rows, tab === "pending" ? "Nothing waiting for a decision" : "No items yet"), { raw: true, footer: pager(rows.length) })}
    </div>`;
  }
  function decidedRecord(a) {
    return `<section class="decision-panel" aria-label="Decision">${detail([
      ["Decision", status(a.status)],
      ["Approver", esc(decidedWho(a))],
      ["Decided", `<span class="tabular">${esc(decidedWhen(a))}</span>`],
      ["Submitted by", esc(a.by)],
      ["Submitted", `<span class="tabular">${esc(a.when)}</span>`],
      ["Comment", esc(a.comment), true],
    ])}</section>`;
  }
  function approvalItem(id) {
    const a = P.db.approvals.find((x) => x.id === id);
    if (!a)
      return `${crumbs(["Approvals", "AD-18"], ["Item"])}${stateMsg("circle-help", "Item not found", "It may have been removed. Go back to Approvals.")}`;
    const t = P.approvalTypes[a.type],
      short = typeShort(a.type);
    const facts = panel(
      "Facts",
      detail([
        ["Type", esc(typeLabel(a.type))],
        ["Status", status(a.status)],
        ["Submitted by", esc(a.by)],
        ["Submitted", `<span class="tabular">${esc(a.when)}</span>`],
        ["Details", esc(a.details), true],
      ]),
    );
    let extra = "";
    try {
      extra = t && t.detail ? t.detail(a) || "" : "";
    } catch (e) {
      console.error(e);
    }
    let dec;
    if (a.status !== "pending") {
      const pl = a.payload || {};
      const first =
        a.type === "award" &&
        a.status === "approved" &&
        (pl.recipients || [])
          .map(P.bene)
          .find((b) => b && b.status === "active");
      dec =
        decidedRecord(a) +
        (first
          ? footerRow(
              btn(`Open ${first.name}’s profile`, "go", {
                v: "AD-02",
                kind: "primary",
                data: {
                  p: JSON.stringify({ bene: first.key, tab: "Credits" }),
                },
              }),
            )
          : "");
    } else if (a.byKey === P.S.persona) {
      dec =
        '<section class="decision-panel" aria-label="Decision"><p>You submitted this item. Another approver must decide.</p></section>';
    } else if (!isApprover()) {
      dec =
        '<section class="decision-panel" aria-label="Decision"><p>Waiting for an approver.</p></section>';
    } else {
      const bind = "form.cr.comment." + a.id,
        ok = String(P.get(bind) || "").trim().length >= 10;
      const err = errOn("cr.approve", "cr.reject") && !ok;
      dec = `<section class="decision-panel" aria-label="Decision">${showErr(reasonField(bind, "Comment (required)", 10, err), "comment")}<div class="decision-panel__actions">${btn("Approve " + short, "cr.approve", { kind: "primary", off: !ok, v: a.id })}${btn("Reject " + short, "cr.reject", { kind: "destructive", off: !ok, v: a.id })}</div>${ok ? "" : `<span class="button-reason">Give a comment to approve or reject this ${esc(short)}.</span>`}</section>`;
    }
    return `${crumbs(["Approvals", "AD-18"], [a.title])}
    <header class="row row--between"><div class="row"><h1 class="screen-title">${esc(a.title)}</h1>${status(a.status)}</div></header>
    <div class="stack">${a.status !== "pending" ? dec + facts + extra : facts + extra + dec}</div>`;
  }
  const consequence = (a, approve) => {
    const pl = a.payload || {};
    if (a.type === "award")
      return approve
        ? `${fmt(pl.amount)} Credits join the Available Balance of each of ${int(pl.count)} Beneficiaries at once. Recipients who are suspended or closed are skipped. This cannot be undone.`
        : `The ${fmt(pl.amount)} Pending Credits are removed from each of ${int(pl.count)} Beneficiaries. ${esc(firstName(a.by))} sees your comment. This cannot be undone.`;
    if (a.type === "adjustment") {
      const b = P.bene(pl.bene);
      return approve
        ? `${pl.amount < 0 ? `${fmt(-pl.amount)} Credits come off` : `${fmt(pl.amount)} Credits join`} ${esc(b ? b.name : "")}’s Available Balance at once. This cannot be undone.`
        : `${pl.amount > 0 ? "The Pending Credits are removed. " : ""}${esc(firstName(a.by))} sees your comment. This cannot be undone.`;
    }
    if (a.type === "allocation")
      return approve
        ? "The new amounts apply from the next grant, 1 Jan 2027. This cannot be undone."
        : `The amounts stay as they are. ${esc(firstName(a.by))} sees your comment. This cannot be undone.`;
    return approve
      ? "This takes effect at once. This cannot be undone."
      : `${esc(firstName(a.by))} sees your comment. This cannot be undone.`;
  };
  function decide(id, approve) {
    const a = P.db.approvals.find((x) => x.id === id);
    if (!a || a.status !== "pending") return;
    const short = typeShort(a.type);
    P.confirm({
      title: `${approve ? "Approve" : "Reject"} ${short} “${a.title.replace(/^[^:]+: /, "")}”?`,
      body: `<p>${consequence(a, approve)}</p>`,
      ok: `${approve ? "Approve" : "Reject"} ${short}`,
      kind: approve ? "primary" : "destructive",
      action: () => {
        const t = P.approvalTypes[a.type];
        a.comment = String(P.get("form.cr.comment." + a.id) || "").trim();
        a.decidedBy = P.who();
        a.decidedWhen = P.stamp();
        a.decidedByKey = P.S.persona;
        a.status = approve ? "approved" : "rejected";
        if (t) (approve ? t.apply : t.reject).call(t, a);
        P.audit(
          `${approve ? "Approved" : "Rejected"} ${typeLabel(a.type)}`,
          a.title,
        );
        P.toast(
          `${short} ${approve ? "approved" : "rejected"}`,
          approve
            ? a.type === "award"
              ? "The Credits are in each Available Balance."
              : "It takes effect now."
            : `${firstName(a.by)} sees your comment.`,
        );
      },
    });
  }
  P.action("cr.approve", (v) => decide(v, true));
  P.action("cr.reject", (v) => decide(v, false));

      return {
        title: "Head Office account created",
        body: `<div class="stack">${alert("Temporary password, shown once", `<span class="tabular" style="font-size:1.25em;letter-spacing:0.08em"><b>${esc(pr.pw)}</b></span><br>Give it to ${esc(u ? u.name : "the owner")} in person. It cannot be shown again. At first sign-in the owner sets a new password and sets up the authenticator app.`, "lock")}${detail(
          [
            ["Name", esc(u.name)],
            ["Email", esc(u.email)],
            ["Institution", esc(i.name)],
            ["Role", "Head Office"],
          ],
        )}</div>`,
        footer: btn("Done", "closePanel", { kind: "primary" }),
      };
    }
    const d = F().ho || {},
      err = errOn("cr.hoSave");
    const emailOk = /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(
      String(d.email || "").trim(),
    );
    const probs = [];
    if (!String(d.name || "").trim()) probs.push("enter the name");
    if (!emailOk) probs.push("enter a valid email");
    const why = probs.length ? `To create, ${probs.join(", ")}.` : "";
    return {
      title: "Create Head Office account",
      body: `<div class="stack"><p class="text-muted">The first account for ${esc(i.name)}. The owner adds the other users on the Institution Dashboard.</p>${field("Full name (required)", input("form.cr.ho.name", { err: err && !String(d.name || "").trim() }))}${field("Email (required)", input("form.cr.ho.email", { type: "email", err: err && !emailOk }), "The owner signs in with this.", err && !emailOk ? "Enter a valid email." : "")}${field("Mobile number", input("form.cr.ho.phone", { mode: "tel" }))}</div>`,
      footer: `${reasonOff(why)}${btn("Cancel", "closePanel")}${btn("Create account", "cr.hoSave", { kind: "primary", off: !!why, v: i.id })}`,
    };
  });
  const ADDED = [];
  P.onReset = P.onReset || [];
  P.onReset.push(() => {
    ADDED.splice(0).forEach((k) => {
      const ix = P.PERSONAS.findIndex((p) => p.key === k);
      if (ix >= 0) P.PERSONAS.splice(ix, 1);
    });
  });
  P.action("cr.hoSave", (v) => {
    const i = P.inst(v),
      d = F().ho,
      db = P.db;
    let key = "ho-" + slug(i.id.replace(/^i-/, ""));
    while (db.institutionUsers.some((u) => u.key === key)) key += "2";
    const pw =
      "AGP-" +
      Math.random().toString(36).slice(2, 6).toUpperCase() +
      "-" +
      (1000 + Math.floor(Math.random() * 9000));
    db.institutionUsers.push({
      key,
      name: d.name.trim(),
      role: "Head Office",
      inst: i.id,
      branch: null,
      status: "active",
      passcode: null,
      email: d.email.trim(),
      phone: (d.phone || "").trim(),
      mustChange: true,
      tempPassword: pw,
    });
    /* So the guide can sign in as the new owner (UJ-11 step 5) */
    if (!P.PERSONAS.some((p) => p.key === key)) {
      P.PERSONAS.push({
        key,
        app: "inst",
        name: d.name.trim(),
        label: `${d.name.trim()} · Head Office, ${i.name}`,
        roles: ["Head Office"],
        inst: i.id,
        branch: null,
      });
      ADDED.push(key);
    }
    (i.history = i.history || []).unshift({
      when: P.stamp(),
      who: P.who(),
      field: "Head Office account",
      now: d.name.trim(),
      was: "",
    });
    P.audit("Created Head Office account", `${d.name.trim()}, ${i.name}`);
    P.mark("headOfficeCreated");
    F().ho = null;
    P.openPanel("AD-20-ho", { inst: i.id, pw, user: key });
    P.toast(
      "Head Office account created",
      "Give the owner the temporary password.",
    );
  });

  /* ================================================================
   AD-21 Branch detail (wide panel over AD-20)
   ================================================================ */
  P.action("cr.branchOpen", (v) => {
    const [inst, br] = v.split("|");
    P.openPanel("AD-21", { inst, br });
  });
  P.action("cr.branchNew", (v) => {
    const i = P.inst(v),
      first = !i.branches.length && i.name === "Malasakit Pharmacy";
    F().br = first
      ? {
          name: "Poblacion Branch",
          addr: i.addr || "7 Bonifacio Street, Poblacion, Malinis",
          license: "FDA-DS-2026-1182",
          permit: "BP-MAL-2026-0419",
          accFrom: P.TODAY,
          accTo: "31 Dec 2027",
        }
      : {
          name: "",
          addr: "",
          license: "",
          permit: "",
          accFrom: P.TODAY,
          accTo: "",
        };
    P.openPanel("AD-21", { inst: v, add: true });
  });
  P.action("cr.branchEdit", (v) => {
    const [inst, id] = v.split("|"),
      b = P.inst(inst).branches.find((x) => x.id === id);
    F().br = {
      name: b.name,
      addr: b.addr,
      license: b.license,
      permit: b.permit || "",
      accFrom: b.accFrom,
      accTo: b.accTo,
    };
    P.openPanel("AD-21", { inst, br: id, edit: true });
  });
  function branchProblems(d) {
    const p = [],
      from = parseDate(d.accFrom),
      to = parseDate(d.accTo);
    if (!String(d.name || "").trim()) p.push("enter the Branch name");
    if (!String(d.addr || "").trim()) p.push("enter the address");
    if (!String(d.license || "").trim())
      p.push("enter the License to Operate number");
    if (!from) p.push("enter the accreditation start date");
    if (!to) p.push("enter the accreditation end date");
    else if (from && to <= from)
      p.push("make the end date later than the start date");
    return p;
  }
  regPanel("AD-21", (pr) => {
    const i = P.inst(pr.inst);
    if (pr.add || pr.edit) {
      const d = F().br || {},
        err = errOn("cr.branchSave"),
        probs = branchProblems(d);
      const why = probs.length ? `To save, ${probs.join(", ")}.` : "";
      const e = (bad, msg) => (err && bad ? msg : "");
      return {
        title: pr.add ? "Add Branch: " + i.name : "Edit Branch",
        wide: true,
        body: `<div class="stack">
        ${field("Branch name (required)", input("form.cr.br.name", { err: err && !String(d.name || "").trim() }), "", e(!String(d.name || "").trim(), "Enter the Branch name."))}
        ${field("Address (required)", input("form.cr.br.addr", { err: err && !String(d.addr || "").trim() }), "", e(!String(d.addr || "").trim(), "Enter the address."))}
        ${field("License to Operate number (required)", input("form.cr.br.license", { err: err && !String(d.license || "").trim() }), i.type === "pharmacy" ? "FDA License to Operate" : "DOH License to Operate", e(!String(d.license || "").trim(), "Enter the license number."))}
        ${field("Business permit number", input("form.cr.br.permit"))}
        <div class="grid2">${field("Accredited from (required)", input("form.cr.br.accFrom", { placeholder: "DD/MM/YYYY", err: err && !parseDate(d.accFrom) }), "DD/MM/YYYY or 11 Nov 2026")}${field("Accredited until (required)", input("form.cr.br.accTo", { placeholder: "DD/MM/YYYY", err: err && !parseDate(d.accTo) }), "DD/MM/YYYY or 31 Dec 2027")}</div>
        ${err && why ? `<span class="field__error">${esc(why)}</span>` : ""}</div>`,
        footer: `${reasonOff(why)}${btn("Cancel", pr.add ? "closePanel" : "cr.branchOpen", pr.add ? {} : { v: i.id + "|" + pr.br })}${btn("Save Branch", "cr.branchSave", { kind: "primary", off: !!why, v: i.id + "|" + (pr.br || "") })}`,
      };
    }
    const b = i.branches.find((x) => x.id === pr.br);
    if (!b)
      return {
        title: "Branch",
        body: stateMsg("circle-help", "Branch not found", ""),
      };
    const ts = P.db.terminals.filter((t) => t.branch === b.id);
    const tRows = ts.map(
      (t) =>
        `<tr><th scope="row" class="tabular">${esc(t.serial)}</th><td>${status(t.status)}</td><td class="tabular">${esc(t.registered)}</td></tr>`,
    );
    const n = daysUntil(b.accTo);
    return {
      title: b.name,
      wide: true,
      body: `<div class="stack"><div class="row">${status(i.status === "accredited" ? "active" : i.status)}${accBadge(b)}</div>
      ${n != null && n <= 30 ? alert(n < 0 ? "Accreditation has ended." : `Accreditation ends on ${esc(b.accTo)}.`, n < 0 ? "This Branch cannot record sales until its accreditation is renewed." : "Renew it before then, or this Branch stops recording sales.", "calendar", n < 0) : ""}
      ${detail([
        ["Institution", esc(i.name)],
        ["Branch", esc(b.name)],
        ["Address", esc(b.addr), true],
        [
          "License to Operate number",
          `<span class="tabular">${esc(b.license)}</span>`,
        ],
        [
          "Business permit number",
          `<span class="tabular">${esc(b.permit || "Not recorded")}</span>`,
        ],
        ["Accredited from", esc(b.accFrom)],
        ["Accredited until", esc(b.accTo)],
      ])}
      ${panel("Counter Terminals", table("Counter Terminals at this Branch", ["Serial number", "Status", "Registered"], tRows, "No Counter Terminal assigned yet"), { raw: true, right: isAdmin() ? btn("Assign a Counter Terminal", "go", { v: "AD-22", kind: "ghost" }) : "" })}
      ${panel("Change history", histTable(b.history), { raw: true })}</div>`,
      footer: isAdmin()
        ? btn("Edit Branch", "cr.branchEdit", {
            icon: "pencil",
            v: i.id + "|" + b.id,
          })
        : "",
    };
  });
  P.action("cr.branchSave", (v) => {
    const [instId, brId] = v.split("|"),
      i = P.inst(instId),
      d = F().br;
    const vals = {
      name: d.name.trim(),
      addr: d.addr.trim(),
      license: d.license.trim(),
      permit: (d.permit || "").trim(),
      accFrom: fmtDate(parseDate(d.accFrom)),
      accTo: fmtDate(parseDate(d.accTo)),
    };
    let id = brId;
    if (!brId) {
      id =
        "br-" + slug(i.id.replace(/^i-/, "") + "-" + vals.name.split(" ")[0]);
      while (P.branch(id)) id += "-2";
      i.branches.push(
        Object.assign(
          {
            id,
            history: [
              {
                when: P.stamp(),
                who: P.who(),
                field: "Branch",
                now: "added",
                was: "",
              },
            ],
          },
          vals,
        ),
      );
      (i.history = i.history || []).unshift({
        when: P.stamp(),
        who: P.who(),
        field: "Branches",
        now: "added " + vals.name,
        was: "",
      });
      P.audit("Added Branch", `${i.name}, ${vals.name}`);
      P.mark("branchAdded");
      P.toast(
        "Branch saved",
        `${vals.name} is added. Assign a Counter Terminal on Counter Terminals.`,
      );
    } else {
      const b = i.branches.find((x) => x.id === brId);
      b.history = b.history || [];
      const labels = {
        name: "Branch name",
        addr: "Address",
        license: "License to Operate number",
        permit: "Business permit number",
        accFrom: "Accredited from",
        accTo: "Accredited until",
      };
      Object.keys(vals).forEach((k) => {
        if ((b[k] || "") !== vals[k]) {
          b.history.unshift({
            when: P.stamp(),
            who: P.who(),
            field: labels[k],
            now: vals[k],
            was: b[k] || "",
          });
          b[k] = vals[k];
        }
      });
      P.audit("Edited Branch", `${i.name}, ${vals.name}`);
      P.toast("Branch saved", "");
    }
    F().br = null;
    P.openPanel("AD-21", { inst: i.id, br: id });
  });

  /* ================================================================
   AD-22 Counter Terminals (flows 24, 25, FR-48)
   ================================================================ */
  const lastUsed = (t) => {
    if (t.lastUsed) return t.lastUsed;
    if (!t.branch || t.status === "unassigned") return "Not used yet";
    const w = P.db.tx
      .filter((x) => x.branch === t.branch)
      .map((x) => x.when)
      .sort((a, b) => whenNum(b) - whenNum(a))[0];
    return w || "Not used yet";
  };
  P.counts["AD-22"] = (p) =>
    p.roles && p.roles.includes("administrator")
      ? P.db.terminals.filter((t) => t.status === "unassigned").length
      : 0;
  P.screen("AD-22", {
    title: "Counter Terminals",
    render() {
      const vendor = P.hasRole("Vendor Operator"),
        fl = P.get("form.cr.ctFilter") || "";
      const list = P.db.terminals.filter((t) => !fl || t.status === fl);
      const rows = list.map(
        (t) =>
          `<tr><th scope="row">${P.actionLink(t.serial, "cr.ctOpen", t.serial)}</th><td>${t.branch ? esc(P.branchName(t.branch)) : '<span class="text-muted">Not assigned</span>'}</td><td>${status(t.status)}</td><td class="tabular">${esc(lastUsed(t))}</td><td class="tabular">${esc(t.registered)}</td></tr>`,
      );
      return `${head("Counter Terminals", vendor ? "Register each new device here. An administrator then assigns it to a Branch." : "Assign each registered device to a Branch. Switch off a lost or faulty one.", `${reasonOff(vendor ? "" : "The Vendor Operator registers new devices.")}${btn("Register Counter Terminal", "cr.ctNew", { kind: "primary", icon: "plus", off: !vendor })}`)}
      <div class="stack">
      ${filterBar(
        field(
          "Status",
          select("form.cr.ctFilter", [
            ["", "All statuses"],
            ["unassigned", "unassigned"],
            ["assigned", "assigned"],
            ["switched off", "switched off"],
          ]),
        ),
      )}
      ${panel("Counter Terminals", table("Counter Terminals", ["Serial number", "Branch", "Status", "Last used", "Registered"], rows, "No Counter Terminal with this status"), { raw: true, footer: pager(rows.length, P.db.terminals.length) })}
      </div>`;
    },
  });
  P.action("cr.ctOpen", (v) => P.openPanel("AD-22-ct", { serial: v }));
  const branchOpts = (except) => {
    const o = [];
    P.db.institutions
      .filter((i) => i.status === "accredited")
      .forEach((i) =>
        i.branches.forEach((b) => {
          if (b.id !== except) o.push([b.id, `${i.name}, ${b.name}`]);
        }),
      );
    return o;
  };
  P.action("cr.ctMode", (v) => {
    const [serial, mode] = v.split("|"),
      t = P.db.terminals.find((x) => x.serial === serial);
    const opts = branchOpts(t.branch),
      mal = opts.find(
        ([id]) => P.branch(id).inst.name === "Malasakit Pharmacy",
      );
    F().ctBranch = (
      serial === "CT-7F21-0007" && mal ? mal : opts[0] || [""]
    )[0];
    P.openPanel("AD-22-ct", { serial, mode });
  });
  regPanel("AD-22-ct", (pr) => {
    const t = P.db.terminals.find((x) => x.serial === pr.serial);
    if (!t)
      return {
        title: "Counter Terminal",
        body: stateMsg("circle-help", "Not found", ""),
      };
    const admin = isAdmin();
    const facts = detail([
      ["Serial number", `<span class="tabular">${esc(t.serial)}</span>`],
      ["Status", status(t.status)],
      ["Branch", esc(t.branch ? P.branchName(t.branch) : "Not assigned")],
      ["Registered", esc(t.registered)],
      ["Last used", esc(lastUsed(t))],
    ]);
    if (pr.mode) {
      const opts = branchOpts(pr.mode === "move" ? t.branch : null),
        assign = pr.mode === "assign";
      const why = opts.length
        ? ""
        : "No accredited Branch to choose. Add a Branch first.";
      return {
        title: (assign ? "Assign " : "Move ") + t.serial,
        body: `<div class="stack">${facts}${opts.length ? field(assign ? "Branch (required)" : "Move to Branch (required)", select("form.cr.ctBranch", opts), "Only Branches of accredited Institutions are listed.") : alert("No Branch to choose", "Add a Branch to an accredited Institution first.", "info")}${pr.mode === "move" && t.status === "switched off" ? '<p class="text-muted">After the move the Counter Terminal is assigned and can record sales again.</p>' : ""}</div>`,
        footer: `${reasonOff(why)}${btn("Cancel", "cr.ctOpen", { v: t.serial })}${btn(assign ? "Assign Counter Terminal" : "Move Counter Terminal", "cr.ctSave", { kind: "primary", off: !!why, v: t.serial + "|" + pr.mode })}`,
      };
    }
    let footer = "",
      note = "";
    if (!admin)
      note = `<p class="text-muted">${P.hasRole("Vendor Operator") ? "An administrator assigns, moves, and switches off Counter Terminals." : "Only an administrator changes Counter Terminals."}</p>`;
    else if (t.status === "unassigned")
      footer = btn("Assign to a Branch", "cr.ctMode", {
        kind: "primary",
        v: t.serial + "|assign",
      });
    else if (t.status === "assigned")
      footer =
        btn("Switch off", "cr.ctOff", { kind: "destructive", v: t.serial }) +
        btn("Move to another Branch", "cr.ctMode", {
          kind: "primary",
          v: t.serial + "|move",
        });
    else
      footer = btn("Move to another Branch", "cr.ctMode", {
        kind: "primary",
        v: t.serial + "|move",
      });
    const offNote =
      t.status === "switched off"
        ? alert(
            "Switched off.",
            "It reads no Tap and shows “This Branch or Counter Terminal cannot record sales.” No Credits can be deducted on it.",
            "circle-alert",
            true,
          )
        : "";
    return {
      title: t.serial,
      body: `<div class="stack">${offNote}${facts}${note}</div>`,
      footer,
    };
  });
  P.action("cr.ctSave", (v) => {
    const [serial, mode] = v.split("|"),
      t = P.db.terminals.find((x) => x.serial === serial),
      to = P.get("form.cr.ctBranch");
    if (!to || !P.branch(to)) return;
    const was = t.branch;
    t.branch = to;
    t.status = "assigned";
    P.audit(
      mode === "assign"
        ? "Assigned Counter Terminal"
        : "Moved Counter Terminal",
      `${serial} to ${P.branchName(to)}`,
    );
    if (mode === "assign") P.mark("terminalAssigned");
    else P.mark("terminalMoved");
    P.openPanel("AD-22-ct", { serial });
    P.toast(
      mode === "assign"
        ? "Counter Terminal assigned"
        : "Counter Terminal moved",
      `${serial} records sales for ${P.branchName(to)}${was && mode === "move" ? ", no longer " + P.branchName(was) : ""}.`,
    );
  });
  P.action("cr.ctOff", (v) => {
    const t = P.db.terminals.find((x) => x.serial === v);
    P.confirm({
      title: `Switch off ${t.serial}?`,
      body: `<p>It stops reading Taps at once and shows “This Branch or Counter Terminal cannot record sales.” ${esc(P.branchName(t.branch))} can still use its other Counter Terminals. Move it to a Branch later to use it again.</p>`,
      ok: "Switch off",
      kind: "destructive",
      action: () => {
        t.status = "switched off";
        P.audit("Switched off Counter Terminal", t.serial);
        P.mark("terminalSwitchedOff");
        P.toast("Counter Terminal switched off", `${t.serial} reads no Tap.`);
      },
    });
  });
  P.action("cr.ctNew", () => {
    const ns = P.db.terminals
      .map((t) => +t.serial.slice(-4))
      .filter((n) => !isNaN(n));
    F().ctNew = {
      serial: "CT-7F21-" + String(Math.max(0, ...ns) + 1).padStart(4, "0"),
    };
    P.openPanel("AD-22-new");
  });
  regPanel("AD-22-new", () => {
    const d = F().ctNew || {},
      s = String(d.serial || "")
        .trim()
        .toUpperCase(),
      err = errOn("cr.ctRegister");
    const why = !/^CT-[0-9A-F]{4}-\d{4}$/.test(s)
      ? "Enter the serial number as printed on the device, like CT-7F21-0008."
      : P.db.terminals.some((t) => t.serial === s)
        ? "This serial number is already registered."
        : "";
    return {
      title: "Register Counter Terminal",
      body: `<div class="stack"><p class="text-muted">Register the device before it leaves for the Branch. An administrator assigns it.</p>${field("Serial number (required)", input("form.cr.ctNew.serial", { err: err && !!why }), "Printed on the back of the device.", err && why ? why : "")}</div>`,
      footer: `${reasonOff(why)}${btn("Cancel", "closePanel")}${btn("Register Counter Terminal", "cr.ctRegister", { kind: "primary", off: !!why })}`,
    };
  });
  P.action("cr.ctRegister", () => {
    const s = String(F().ctNew.serial).trim().toUpperCase();
    P.db.terminals.push({
      serial: s,
      branch: null,
      status: "unassigned",
      registered: P.TODAY,
    });
    P.audit("Registered Counter Terminal", s);
    P.mark("terminalRegistered");
    F().ctNew = null;
    P.openPanel("AD-22-ct", { serial: s });
    P.toast(
      "Counter Terminal registered",
      `${s} is unassigned. An administrator assigns it to a Branch.`,
    );
  });
})();

</script>
    <script>
/* Agapay clickable prototype: Settlement, Reports, Unusual activity, Administration.
   Screens AD-23 to AD-38. Registers screens, panels, actions (st.*, fl.*, rp.*, adm.*, rs.*),
   P.approvalTypes.reversal, sidebar counts for AD-23 and AD-31, and settlement helpers
   (P.draftFor, P.outstanding, P.stmtTotal with Reversal deductions). Never caches P.S or P.db. */
(() => {
  "use strict";
  const {
    esc,
    fmt,
    peso,
    num,
    int,
    ic,
    status,
    btn,
    field,
    input,
    select,
    checkbox,
    radios,
    reasonField,
    table,
    detail,
    stateMsg,
    alert,
    link,
    actionLink,
    filterBar,
    crumbs,
    head,
    pager,
    reasonOff,
    tiles,
  } = P;
  const panel = (...a) => (P.panelHtml || P.panel)(...a);
  const db = () => P.db;
  const F = (k) => P.get("form." + k);
  const setF = (k, v) => P.set("form." + k, v);
  const ui = () => P.S.ui;
  const fin = () => P.hasRole("finance officer");
  const admin = () => P.hasRole("administrator");
  const analyst = () => P.hasRole("analyst");
  const clearErr = (...ks) =>
    ks.forEach((k) => {
      delete ui().err[k];
    });
  const amt = (v) => `<td class="is-amount tabular">${v}</td>`;
  const neg = (v) => "−" + peso(v);
  const strLen = (k) => String(F(k) || "").trim().length;
  const MONTHS = [
    "Jan",
    "Feb",
    "Mar",
    "Apr",
    "May",
    "Jun",
    "Jul",
    "Aug",
    "Sep",
    "Oct",
    "Nov",
    "Dec",
  ];
  /* "11/11/2026" -> "11 Nov 2026"; anything else is kept as typed */
  const toDate = (s) => {
    const m = String(s || "")
      .trim()
      .match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    return m && +m[2] >= 1 && +m[2] <= 12
      ? `${+m[1]} ${MONTHS[+m[2] - 1]} ${m[3]}`
      : String(s || "").trim();
  };
  const addHours = (stamp, h) => {
    const m = String(stamp).match(/^(.*), (\d+):(\d+) (AM|PM)$/);
    if (!m) return stamp;
    let mins = ((+m[2] % 12) + (m[4] === "PM" ? 12 : 0)) * 60 + +m[3] + h * 60;
    const day = mins >= 1440;
    mins %= 1440;
    const hh = Math.floor(mins / 60),
      mm = mins % 60;
    return `${day ? "12 Nov 2026" : m[1]}, ${((hh + 11) % 12) + 1}:${String(mm).padStart(2, "0")} ${hh < 12 ? "AM" : "PM"}`;
  };

  /* ======================================================================
   Settlement model
   ====================================================================== */
  const STAGE_ROLE = {
    draft: "muted",
    "under review": "info",
    approved: "info",
    "partly paid": "warning",
    paid: "success",
  };
  const stageBadge = (s) => status(s, STAGE_ROLE[s]);
  const LOCKED = ["approved", "partly paid", "paid"];
  const NEXT_PERIOD = {
    "twice a month": "16 to 30 Nov 2026",
    monthly: "16 Nov to 15 Dec 2026",
    weekly: "16 to 22 Nov 2026",
  };
  const allBranches = () =>
    db().institutions.flatMap((i) =>
      i.branches.map((b) => Object.assign({ inst: i }, b)),
    );

  /* Statement total: charged Transactions (reversed ones are not charged, unless the Reversal came after approval
   and is deducted from a later statement instead), minus deductions for Reversals placed on this statement. */
  P.stmtTotal = (id) =>
    P.stmtTx(id)
      .filter((t) => t.status !== "reversed" || t.revDeduct)
      .reduce((a, t) => a + t.credits, 0) -
    db()
      .tx.filter((t) => t.revDeduct === id)
      .reduce((a, t) => a + t.credits, 0);
  P.outstanding = (st) => Math.max(P.stmtTotal(st.id) - P.paid(st), 0);
  /* The Branch's draft statement. With create, makes one for the next period and puts the Branch's unbilled sales on it. */
  P.draftFor = (branch, create) => {
    const list = db().statements;
    let s = list.find((x) => x.branch === branch && x.stage === "draft");
    if (!s && create) {
      s = {
        id: `s-${branch.replace("br-", "")}-${list.length + 1}`,
        branch,
        period:
          NEXT_PERIOD[db().settings.period] || NEXT_PERIOD["twice a month"],
        stage: "draft",
        payments: [],
        approvedBy: "",
      };
      list.unshift(s);
      db()
        .tx.filter(
          (t) => t.branch === branch && t.status === "completed" && !t.stmt,
        )
        .forEach((t) => {
          t.stmt = s.id;
        });
      P.audit(
        "Made draft Settlement Statement",
        `${P.branchName(branch)}, ${s.period}`,
      );
    }
    return s || null;
  };
  const revOf = (no) =>
    db().approvals.filter(
      (a) => a.type === "reversal" && a.payload && a.payload.tx === no,
    );
  const pendingRev = (no) => revOf(no).find((a) => a.status === "pending");
  const lastRev = (no) => revOf(no)[0];
  function position(t) {
    if (t.status === "reversed") return status("reversed", "destructive");
    if (t.status === "voided") return status("voided", "muted");
    if (t.status === "held") return status("held", "warning");
    if (t.stmt) {
      const st = P.statement(t.stmt);
      return status(`on a statement (${st ? st.stage : "draft"})`, "info");
    }
    return status("unbilled", "muted");
  }
  const flagOfTx = (no) => db().flags.find((f) => f.tx === no);
  const flagNote = (no, what) => {
    const f = flagOfTx(no);
    if (f)
      (f.history = f.history || []).unshift({
        when: P.stamp(),
        who: P.who(),
        what,
      });
  };
  const beneName = (t) => {
    const b = P.bene(t.bene);
    return b ? b.name : "Unknown";
  };

  function canHold(t) {
    if (!fin()) return "Only a finance officer places a Hold.";
    if (t.status === "held") return "This Transaction is already held.";
    if (t.status === "reversed") return "This Transaction is reversed.";
    if (t.status === "voided") return "This Transaction was voided.";
    const st = t.stmt && P.statement(t.stmt);
    if (st && LOCKED.includes(st.stage))
      return "This Transaction is on an approved statement, which cannot be changed.";
    return "";
  }
  function canReverse(t) {
    if (!fin()) return "Only a finance officer submits a Reversal.";
    if (t.status === "reversed") return "This Transaction is already reversed.";
    if (t.status === "voided")
      return "This Transaction was voided. Its Credits are back.";
    if (pendingRev(t.no))
      return "A Reversal of this Transaction is waiting for approval.";
    return "";
  }
  const canRelease = (t) =>
    !fin()
      ? "Only a finance officer releases a Hold."
      : pendingRev(t.no)
        ? "A Reversal of this Transaction is waiting for approval."
        : "";
  function holdTx(t, reason) {
    const from = t.stmt;
    t.status = "held";
    t.hold = { reason, by: P.who(), when: P.stamp(), from };
    t.stmt = null;
    P.audit("Placed Hold", "Transaction " + t.no);
    flagNote(t.no, "Hold placed. " + reason);
  }

  /* Reversal approval type (AD-18 calls apply/reject when an approver decides) */
  P.approvalTypes.reversal = {
    label: "Reversal",
    apply(item) {
      const t = P.txByNo(item.payload.tx);
      if (!t) return;
      const st = t.stmt && P.statement(t.stmt);
      if (st && LOCKED.includes(st.stage)) {
        const d = P.draftFor(t.branch, true);
        t.revDeduct = d.id;
      }
      t.status = "reversed";
      t.reversal = {
        reason: item.payload.reason,
        when: P.stamp(),
        approval: item.id,
      };
      P.audit(
        "Reversed Transaction",
        `Transaction ${t.no}. ${fmt(t.credits)} Credits returned to ${beneName(t)}`,
      );
      flagNote(t.no, "Reversal approved. Credits returned to the Beneficiary.");
      P.mark("reversalApproved");
    },
    reject(item) {
      const t = P.txByNo(item.payload.tx);
      if (!t) return;
      flagNote(
        t.no,
        "Reversal rejected. The Transaction stays " +
          (t.status === "held" ? "held." : "as it was."),
      );
    },
    detail(item) {
      const t = P.txByNo(item.payload.tx);
      if (!t) return "";
      return (
        detail([
          ["Transaction", esc(t.no)],
          ["Date and time", esc(t.when)],
          ["Branch", esc(P.branchName(t.branch))],
          ["Beneficiary", esc(beneName(t))],
          ["Credits deducted", fmt(t.credits) + " Credits"],
          ["Settlement position", position(t)],
          ["Reason", esc(item.payload.reason || ""), true],
        ]) +
        `<p class="text-muted">If approved, ${fmt(t.credits)} Credits go back to the Beneficiary and the Branch is never paid for this sale.</p>`
      );
    },
  };

  P.counts["AD-23"] = () =>
    P.S && db().statements.filter((s) => s.stage === "draft").length;
  P.counts["AD-31"] = () =>
    P.S && db().flags.filter((f) => f.status === "new").length;

  /* Shared dialogs */
  function reasonDialog({
    title,
    body,
    label,
    ok,
    kind,
    action,
    key = "reason",
  }) {
    setF(key, { text: "" });
    clearErr("dialogOk");
    P.confirm({
      title,
      ok,
      kind,
      body: () =>
        `${body}${reasonField(`form.${key}.text`, label, 10, ui().err.dialogOk)}${strLen(key + ".text") < 10 ? '<p class="text-muted">Give a reason of at least 10 characters.</p>' : ""}`,
      off: () => strLen(key + ".text") < 10,
      action: () => action(String(F(key + ".text")).trim()),
    });
  }
  function exportDialog({ title, what, lines, formats, done }) {
    setF("exp", { fmt: formats[0][0] });
    P.confirm({
      title,
      ok: "Export",
      body: () =>
        `<p><b>${esc(what)}</b></p>${detail(lines.map(([l, v]) => [l, esc(v)]))}<div class="field"><span class="field__label">Format</span><div class="check-list">${radios("form.exp.fmt", formats)}</div></div><p class="text-muted">The file carries its title, the filters or period, today's date, and your name. This export is recorded in the audit log.</p>`,
      action: () => {
        const f = formats.find((x) => x[0] === F("exp.fmt")) || formats[0];
        done(f[1]);
      },
    });
  }

  /* ======================================================================
   AD-23 Settlement Statements
   ====================================================================== */
  P.screen("AD-23", {
    title: "Settlement Statements",
    render() {
      const list = db().statements;
      const periods = [...new Set(list.map((s) => s.period))];
      const fp = F("st.period") || "",
        fs = F("st.stage") || "";
      const rows = list
        .filter((s) => (!fp || s.period === fp) && (!fs || s.stage === fs))
        .map((s) => {
          const br = P.branch(s.branch);
          return `<tr><th scope="row">${link(br.name, "AD-24", { id: s.id })}<span class="data-table__row-detail">${esc(br.inst.name)}</span></th><td class="tabular">${esc(s.period)}</td><td class="tabular">${P.stmtTx(s.id).length}</td>${amt(peso(P.stmtTotal(s.id)))}${amt(peso(P.paid(s)))}<td>${stageBadge(s.stage)}</td></tr>`;
        });
      const waiting = allBranches().filter(
        (b) =>
          !P.draftFor(b.id) &&

            (t) => t.branch === b.id && t.status === "completed" && !t.stmt,

      const drafts = list.filter((s) => s.stage === "draft").length;
      const makeOff = !fin()
        ? "Only a finance officer makes statements."
        : !waiting.length
          ? "No unbilled sales are waiting for a statement."
          : "";
      const actions = `${btn("Change settlement period", "st.openPeriod", { off: !fin() })}${btn("Close period and make drafts", "st.makeDrafts", { kind: "primary", off: !!makeOff })}`;
      const reasons =
        (ui().err["st.makeDrafts"] && makeOff ? reasonOff(makeOff) : "") +
        (ui().err["st.openPeriod"] && !fin()
          ? reasonOff("Only a finance officer sets the settlement period.")

      const filters = filterBar(
        `${field("Period", select("form.st.period", [["", "All periods"], ...periods]))}${field("Stage", select("form.st.stage", [["", "All stages"], "draft", "under review", "approved", "partly paid", "paid"]))}`,
      );
      return `<div class="stack">${head("Settlement Statements", `Settlement period: <b>${esc(db().settings.period)}</b>. One statement per Branch per period. ${drafts ? `${drafts} draft statements for ${esc(periods[0] || "this period")} wait for review.` : "No draft statements."}`, actions)}${reasons ? `<div class="row">${reasons}</div>` : ""}${waiting.length ? alert(`${waiting.length} Branch${waiting.length > 1 ? "es have" : " has"} unbilled sales and no draft statement`, `${esc(waiting.map((b) => P.branchName(b.id)).join("; "))}. Close the period to put them on a new draft statement.`) : ""}${filters}${panel("Statements", table("Settlement Statements", ["Branch", "Period", "Transactions", "Total$", "Paid$", "Stage"], rows, "No statements match these filters"), { raw: true, footer: pager(rows.length, list.length) })}</div>`;
    },
  });
  P.panel("AD-23-period", () => ({
    title: "Settlement period",
    body: `<p class="text-muted">How often a statement is made for each Branch. The next statements follow the new setting. Statements already made keep their period.</p><div class="field"><span class="field__label">Settlement period</span><div class="check-list">${radios(
      "form.period.v",
      [
        ["monthly", "Monthly"],
        ["twice a month", "Twice a month (1 to 15, 16 to end of month)"],
        ["weekly", "Weekly"],
      ],
    )}</div></div>${detail([["Next period", esc(NEXT_PERIOD[F("period.v")] || "")]])}<p class="text-muted">A combined statement for all Branches of an Institution is switched on the Institution's page.</p>`,
    footer: `${btn("Cancel", "closePanel")}${btn("Save settlement period", "st.savePeriod", { kind: "primary", off: F("period.v") === db().settings.period })}${ui().err["st.savePeriod"] ? reasonOff("Choose a different period to save.") : ""}`,
  }));

  /* ======================================================================
   AD-24 Settlement Statement detail
   ====================================================================== */
  P.screen("AD-24", {
    title: "Settlement Statement detail",
    nav: "AD-23",
    render({ id }) {
      const st = P.statement(id);
      if (!st)
        return `${crumbs(["Settlement Statements", "AD-23"], ["Not found"])}${stateMsg("circle-alert", "Statement not found", "Go back to Settlement Statements and pick one.")}`;
      const br = P.branch(st.branch);
      const txs = P.stmtTx(id);
      const charged = txs.filter((t) => t.status !== "reversed" || t.revDeduct);
      const reversedHere = txs.filter(
        (t) => t.status === "reversed" && !t.revDeduct,
      );
      const deductions = db().tx.filter((t) => t.revDeduct === id);
      const held = db().tx.filter(
        (t) => t.branch === st.branch && t.status === "held",
      );
      const total = P.stmtTotal(id),
        paid = P.paid(st),
        out = P.outstanding(st);
      const s = st.stage;
      let action = "",
        why = "";
      const offR = fin() ? "" : "Only a finance officer changes a statement.";
      if (s === "draft")
        action = btn("Start review", "st.startReview", {
          kind: "primary",
          v: id,
          off: !!offR,
        });
      else if (s === "under review")
        action = btn("Approve statement", "st.approve", {
          kind: "primary",
          v: id,
          off: !!offR,
        });
      else if (s === "approved" || s === "partly paid")
        action = btn("Add Payment Record", "st.openPay", {
          kind: "primary",
          icon: "plus",
          v: id,
          off: !!offR,
        });
      if (
        offR &&
        (ui().err["st.startReview"] ||
          ui().err["st.approve"] ||
          ui().err["st.openPay"])
      )
        why = reasonOff(offR);
      const flagged = txs.filter((t) => {
        const f = flagOfTx(t.no);
        return (
          f &&
          ["new", "under review"].includes(f.status) &&
          t.status !== "reversed"
        );
      });
      let note = "";
      if (s === "draft")
        note = alert(
          "Draft",
          "Review the Transactions. Place a Hold on any you are unsure of, from the Transaction or from its Flag. Then press Start review.",
        );
      else if (s === "under review")
        note = alert(
          "Under review",
          "New sales of this Branch now go on the next statement. Approve the statement when the review is done. An approved statement cannot be changed.",
        );
      else
        note = `<div class="alert">${ic("lock")}<p class="alert__title">Approved by ${esc(st.approvedBy || "a finance officer")}${st.approvedWhen ? ", " + esc(st.approvedWhen) : ""}.</p><p class="alert__body">An approved statement cannot be changed. ${esc(br.inst.name)} sees the same stage and Payment Records on its dashboard.</p></div>`;
      const flagNoteHtml =
        flagged.length && !LOCKED.includes(s)
          ? alert(
              `${flagged.length} Transaction${flagged.length > 1 ? "s" : ""} on this statement ha${flagged.length > 1 ? "ve" : "s"} an open Flag`,
              `${flagged.map((t) => esc(t.no)).join(", ")}. ${link("Open the unusual activity report", "AD-31")}`,
              "flag",
            )
          : "";
      const totals = `<div class="table-wrap"><table class="data-table"><caption class="visually-hidden">Totals</caption><thead><tr><th scope="col">Line</th><th scope="col" class="is-amount">Amount</th></tr></thead><tbody>
      <tr><th scope="row">Transactions (${charged.length})</th>${amt(peso(charged.reduce((a, t) => a + t.credits, 0)))}</tr>
      ${reversedHere.length ? `<tr><th scope="row">Reversed, not charged (${reversedHere.length})</th>${amt(peso(0))}</tr>` : ""}
      <tr><th scope="row">Deductions for Reversals (${deductions.length})</th>${amt(deductions.length ? neg(deductions.reduce((a, t) => a + t.credits, 0)) : peso(0))}</tr>
      <tr class="data-table__total"><th scope="row">Statement total</th>${amt(peso(total))}</tr>
      <tr><th scope="row">Paid so far</th>${amt(peso(paid))}</tr>
      <tr class="data-table__total"><th scope="row">Outstanding</th>${amt(peso(LOCKED.includes(s) ? out : total))}</tr></tbody></table></div>`;
      const info = detail([
        ["Institution", link(br.inst.name, "AD-20", { inst: br.inst.id })],
        ["Branch", esc(br.name)],
        ["Settlement period", esc(st.period), true],
        ["Stage", stageBadge(s)],
      ]);
      const txRows = txs.map((t) => {
        const b = P.bene(t.bene);
        const rev = t.status === "reversed";
        return `<tr><th scope="row">${actionLink(t.no, "st.openTx", t.no)}</th><td class="tabular">${esc(t.when)}</td><td>${b ? link(b.name, "AD-02", { bene: b.key, tab: "Transactions" }) : ""}<span class="data-table__row-detail"><span>${esc(b ? b.pid : "")}</span>${t.presenter !== "Beneficiary" ? `<span>${esc(t.presenter)}</span>` : ""}</span></td><td>${esc(t.staff)}</td>${amt(rev && !t.revDeduct ? `<s>${fmt(t.credits)}</s> <span class="text-muted">not charged</span>` : fmt(t.credits))}<td>${rev ? status("reversed", "destructive") : flagOfTx(t.no) && flagOfTx(t.no).status !== "cleared" ? status("flagged", "warning") : status("charged", "info")}</td></tr>`;
      });
      const dedRows = deductions.map(
        (t) =>
          `<tr><th scope="row">${actionLink(t.no, "st.openTx", t.no)}</th><td class="tabular">${esc(t.when)}</td><td>${esc((P.statement(t.stmt) || {}).period || "")}</td><td>${esc(t.reversal ? t.reversal.reason : "")}</td>${amt(neg(t.credits))}</tr>`,
      );
      const heldRows = held.map(
        (t) =>
          `<tr><th scope="row">${actionLink(t.no, "st.openTx", t.no)}</th><td class="tabular">${esc(t.when)}</td><td>${esc(beneName(t))}</td>${amt(fmt(t.credits))}<td>${status("held", "warning")}${pendingRev(t.no) ? " " + status("Reversal pending approval", "warning") : ""}</td><td>${esc(t.hold ? t.hold.reason : "")}</td></tr>`,
      );
      const pays = st.payments.length
        ? table(
            "Payment Records",
            [
              "Payment date",
              "Reference",
              "Gross settled$",
              "Deductions$",
              "Net paid$",
              "Notes",
            ],
            st.payments.map(
              (p) =>
                `<tr><th scope="row" class="tabular">${esc(p.date)}</th><td class="tabular">${esc(p.ref)}</td>${amt(peso(p.gross))}${amt(peso(p.ded))}${amt(peso(p.net))}<td>${esc(p.notes || "")}</td></tr>`,
            ),
          )
        : `<div class="panel__body">${stateMsg("inbox", "No Payment Records yet.", LOCKED.includes(s) ? "Add one when the treasurer has paid." : "A Payment Record can be added after this statement is approved.")}</div>`;
      return `<div class="stack">${crumbs(["Settlement Statements", "AD-23"], [`${br.inst.name}, ${br.name} · ${st.period}`])}
      <header class="row row--between"><div><div class="row"><h1 class="screen-title">Settlement Statement detail</h1>${stageBadge(s)}</div><p class="text-muted">${esc(br.inst.name)}, ${esc(br.name)} · ${esc(st.period)}</p></div><div class="row">${btn("Export", "st.export", { icon: "download", v: id })}${action}${why}</div></header>
      ${note}${flagNoteHtml}
      <div class="grid2">${panel("Statement", info)}${panel("Totals", totals, { raw: true })}</div>
      ${panel(`Transactions (${txs.length})`, table("Transactions on this statement", ["Transaction number", "Date and time", "Beneficiary", "Institution User", "Credits deducted$", "Status"], txRows, "No Transactions on this statement"), { raw: true, footer: pager(txs.length) })}
      ${deductions.length ? panel("Deductions for Reversals", table("Deductions for Reversals", ["Original Transaction", "Date and time", "Charged on the statement for", "Reason for the Reversal", "Deduction$"], dedRows), { raw: true }) : ""}
      ${held.length ? panel("Held Transactions", `<div class="panel__body"><p class="text-muted">These Transactions of this Branch are held. They are not on this statement and the Branch is not paid for them until the Hold is released.</p></div>${table("Held Transactions of this Branch", ["Transaction number", "Date and time", "Beneficiary", "Credits deducted$", "Status", "Reason for the Hold"], heldRows)}`, { raw: true }) : ""}
      ${panel("Payment Records", pays, { raw: true })}</div>`;

  P.panel("AD-24-pay", ({ id }) => {

  /* ======================================================================
   AD-25 Amounts owed

  const unbilledOf = (b) =>
    db().tx.filter(
      (t) =>
        t.branch === b &&

        (!t.stmt || !LOCKED.includes((P.statement(t.stmt) || {}).stage)),

  P.screen("AD-25", {
    title: "Amounts owed",
    render() {
      const sum = (a) => a.reduce((x, t) => x + t.credits, 0);

        const unpaid = sts.filter(

        );

          unN: un.length,
          held: sum(held),

          settled: sts.reduce((a, s) => a + P.paid(s), 0),
          oldest: unpaid.length ? unpaid[unpaid.length - 1] : null,
        };
      };
      const tot = { un: 0, held: 0, owed: 0, settled: 0 };
      const rows = [];
      db().institutions.forEach((inst) => {
        const it = { un: 0, held: 0, owed: 0, settled: 0 };
        inst.branches.forEach((br) => {
          const l = line(br.id);

            it[k] += l[k];
            tot[k] += l[k];

      )}${panel("Amounts owed by Branch", table("Amounts owed", ["Branch", "Unbilled$", "Held$", "Approved, not yet paid$", "Settled$", "Oldest unpaid statement", "Action"], rows), { raw: true })}</div>`;
    },
