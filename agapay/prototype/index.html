/* Progress indicator (EXPERIENCE.md, Screen states: Loading on the Counter Terminal; Tap prompt while reading) */
.progress-indicator { display: inline-block; flex: none; width: var(--stock-size-6); height: var(--stock-size-6); background: currentColor; -webkit-mask: var(--icon-loader-circle) center / contain no-repeat; mask: var(--icon-loader-circle) center / contain no-repeat; animation: agapay-spin var(--stock-spin-duration) linear infinite; }
@keyframes agapay-spin { to { rotate: 1turn; } }
@keyframes agapay-pulse { 50% { opacity: 0.5; } }
@media (prefers-reduced-motion: reduce) { .progress-indicator, .skeleton { animation: none; } }

/* ---- Photo. Part of identity-panel: rectangular portrait, never a circle ----
   @component identity-panel -> .photo (photo-background, photo-border, photo-radius, photo-width-list) */
.photo { position: relative; display: block; flex: none; width: var(--spacing-photo-list); aspect-ratio: var(--spacing-photo-aspect); overflow: hidden; background: var(--color-muted); color: var(--color-input); border: var(--spacing-border-width) solid var(--color-border); border-radius: var(--rounded-md); }
.photo::before { content: ""; position: absolute; left: 32%; right: 32%; top: 20%; aspect-ratio: 1; border-radius: var(--rounded-full); background: currentColor; }
.photo::after { content: ""; position: absolute; left: 12%; right: 12%; top: 62%; bottom: -12%; border-radius: 50% 50% 0 0 / 70% 70% 0 0; background: currentColor; }
.photo--profile { width: var(--spacing-photo-profile); }
.photo--missing { display: grid; place-items: center; padding: var(--stock-space-1); color: var(--color-muted-foreground); font-size: var(--stock-text-xs); line-height: var(--stock-leading-xs); text-align: center; }
.photo--missing::before, .photo--missing::after { content: none; }

/* ---- Button (shadcn Button with a brand override) ----
   @component button-primary -> .button--primary
   @component button-primary-terminal -> .button--primary.button--terminal
   @component button-secondary -> .button--secondary
   @component button-secondary-terminal -> .button--secondary.button--terminal
   @component button-destructive -> .button--destructive
   @component button-destructive-terminal -> .button--destructive.button--terminal
   @component button-icon -> .button--icon
   @component button-icon-destructive -> .button--icon-destructive
   @component button-icon-terminal -> .button--icon.button--terminal
   Ghost is stock. Link is underlined at rest. Heights are minimums.
   Icon-only: .button--ghost.button--icon, a touch-min square with one icon and no label. Its name shows in a .tooltip. */
.button { display: inline-flex; align-items: center; justify-content: center; gap: var(--stock-space-2); min-height: var(--spacing-control-height); padding: var(--stock-space-2) var(--spacing-control-padding-x); background: transparent; color: inherit; border: var(--spacing-border-width) solid transparent; border-radius: var(--rounded-sm); font-size: var(--typography-button-font-size); font-weight: var(--typography-button-font-weight); line-height: var(--typography-button-line-height); text-align: center; text-decoration: none; cursor: pointer; }
.button--primary { background: var(--color-primary); color: var(--color-primary-foreground); }
.button--primary:hover { background: color-mix(in srgb, var(--color-primary) var(--stock-hover-strong), transparent); }
.button--secondary { background: var(--color-secondary); color: var(--color-secondary-foreground); border-color: var(--color-input); }
.button--secondary:hover { background: color-mix(in srgb, var(--color-secondary) var(--stock-hover-soft), transparent); }
.button--destructive { background: var(--color-destructive); color: var(--color-destructive-foreground); }
.button--destructive:hover { background: color-mix(in srgb, var(--color-destructive) var(--stock-hover-strong), transparent); }
.button--ghost { color: var(--color-foreground); }
.button--ghost:hover { background: var(--color-accent); color: var(--color-accent-foreground); }
.button--link { min-height: var(--spacing-touch-min); padding-inline: 0; color: var(--color-primary); text-decoration: underline; text-underline-offset: var(--stock-space-0-5); }
.button--icon { min-width: var(--spacing-touch-min); padding-inline: 0; }
.button--icon > .icon { width: var(--spacing-icon-size); height: var(--spacing-icon-size); }
.button--icon-destructive { color: var(--color-destructive); }
.button--icon-destructive:hover { background: var(--color-destructive); color: var(--color-destructive-foreground); }
.button--terminal { width: 100%; min-height: var(--spacing-terminal-touch-min); padding-inline: var(--spacing-terminal-control-padding-x); font-size: var(--typography-terminal-action-font-size); font-weight: var(--typography-terminal-action-font-weight); line-height: var(--typography-terminal-action-line-height); }
.button--primary.button--terminal, .button--destructive.button--terminal { min-height: var(--spacing-terminal-action-height); }
.button--secondary.button--terminal { min-height: var(--spacing-terminal-touch-min); }
.button--icon.button--terminal { width: auto; min-width: var(--spacing-terminal-touch-min); }
.button--icon.button--terminal > .icon { width: var(--spacing-terminal-icon-size); height: var(--spacing-terminal-icon-size); }
/* Tooltip anchor: places the stock .tooltip under an icon Button, as on hover or keyboard focus */
.tooltip-anchor { position: relative; display: inline-flex; flex-direction: column; align-items: center; gap: var(--stock-space-1); }
/* Unavailable: stays focusable (aria-disabled) with a reason line beside it (EXPERIENCE.md, Button) */
.button.is-unavailable, .button[aria-disabled="true"], .button:disabled { background: var(--color-muted); color: var(--color-muted-foreground); border-color: var(--color-input); cursor: not-allowed; }
.button-reason { color: var(--color-muted-foreground); }
.button-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--stock-space-2); }
.button-row--terminal { flex-direction: column; align-items: stretch; gap: var(--spacing-terminal-gap); }

/* ---- Input, Select trigger, Textarea ----
   @component input -> .input
   @component input-terminal -> .input--terminal
   The edge is colors.input. Invalid: destructive edge and a text message below. */
.input { display: block; width: 100%; min-height: var(--spacing-control-height); padding: var(--stock-space-2) var(--spacing-control-padding-x); background: var(--color-card); color: var(--color-foreground); border: var(--spacing-border-width) solid var(--color-input); border-radius: var(--rounded-sm); font: inherit; text-align: start; }
.input::placeholder { color: var(--color-muted-foreground); opacity: 1; }
textarea.input, .input--textarea { min-height: var(--stock-textarea-min-height); resize: vertical; }
.input--select { display: flex; align-items: center; justify-content: space-between; gap: var(--stock-space-2); cursor: pointer; }
.input--select > .icon { color: var(--color-muted-foreground); }
.select { position: relative; display: block; }
.select > select.input { appearance: none; -webkit-appearance: none; padding-inline-end: calc(var(--spacing-control-padding-x) + var(--stock-size-4) + var(--stock-space-2)); }
.select::after { content: ""; position: absolute; top: 50%; inset-inline-end: var(--spacing-control-padding-x); width: var(--stock-size-4); height: var(--stock-size-4); translate: 0 -50%; background: var(--color-muted-foreground); -webkit-mask: var(--icon-chevron-down) center / contain no-repeat; mask: var(--icon-chevron-down) center / contain no-repeat; pointer-events: none; }
.input.is-error, .input[aria-invalid="true"] { border-color: var(--color-destructive); }
.input.is-unavailable, .input:disabled { background: var(--color-muted); color: var(--color-muted-foreground); cursor: not-allowed; }
.input--terminal { min-height: var(--spacing-terminal-touch-min); padding-inline: var(--spacing-terminal-control-padding-x); font-size: var(--typography-terminal-body-font-size); font-weight: var(--typography-terminal-body-font-weight); line-height: var(--typography-terminal-body-line-height); }
/* Field: label always visible above, hint, error below (EXPERIENCE.md, Input). Stock shadcn label style */
.field { display: flex; flex-direction: column; gap: var(--stock-space-2); min-width: 0; }
.field__label { font-weight: var(--stock-font-medium); }
.field__hint { color: var(--color-muted-foreground); }
.field__error { display: flex; align-items: flex-start; gap: var(--stock-space-1-5); color: var(--color-destructive); }
.field--terminal .field__label, .field--terminal .field__hint, .field--terminal .field__error { font-size: var(--typography-terminal-meta-font-size); font-weight: var(--typography-terminal-meta-font-weight); line-height: var(--typography-terminal-meta-line-height); }
.field--terminal .field__label { font-weight: var(--stock-font-medium); }
.form { display: flex; flex-direction: column; gap: var(--stock-space-4); max-width: var(--spacing-form-max-width); }
.form__pair { display: grid; grid-template-columns: 1fr 1fr; gap: var(--stock-space-4); }

/* ---- Panel (shadcn Card): flat, divider-weight border ----
   @component panel -> .panel */
.panel { background: var(--color-card); color: var(--color-card-foreground); border: var(--spacing-border-width) solid var(--color-border); border-radius: var(--rounded-md); box-shadow: none; }
.panel__header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--stock-space-3); padding: var(--stock-space-4) var(--stock-space-6); border-bottom: var(--spacing-border-width) solid var(--color-border); }
.panel__title { font-size: var(--typography-heading-font-size); font-weight: var(--typography-heading-font-weight); line-height: var(--typography-heading-line-height); letter-spacing: var(--typography-heading-letter-spacing); }
.panel__body { display: flex; flex-direction: column; gap: var(--stock-space-4); padding: var(--stock-space-6); }
.panel__footer { padding: var(--stock-space-4) var(--stock-space-6); border-top: var(--spacing-border-width) solid var(--color-border); }

/* ---- Title bar ----
   @component title-bar -> .title-bar
   @component title-bar-terminal -> .title-bar--terminal
   @component title-bar-control -> .title-bar__control
   Parts: wordmark, surface (surface name or Branch name), status (device status group slot, empty on dashboards), account. */
.title-bar { display: flex; align-items: center; gap: var(--stock-space-3); min-height: var(--spacing-title-bar-height); padding: 0 var(--stock-space-4); background: var(--color-primary); color: var(--color-primary-foreground); border-bottom: var(--spacing-rule-accent) solid var(--color-accent); }
.title-bar__wordmark { font-size: var(--typography-wordmark-font-size); font-weight: var(--typography-wordmark-font-weight); letter-spacing: var(--typography-wordmark-letter-spacing); }
.title-bar__surface { min-width: 0; }
.title-bar__status { display: flex; flex-wrap: wrap; align-items: center; gap: var(--stock-space-1) var(--stock-space-4); }
.title-bar__status:empty { display: none; }
.title-bar__status-item { display: inline-flex; align-items: center; gap: var(--stock-space-1-5); }
.title-bar__account { display: flex; align-items: center; gap: var(--stock-space-3); margin-inline-start: auto; }
.title-bar__control { display: inline-flex; align-items: center; justify-content: center; gap: var(--stock-space-2); min-width: var(--spacing-touch-min); min-height: var(--spacing-touch-min); padding: 0 var(--stock-space-3); background: transparent; color: var(--color-primary-foreground); border: var(--spacing-border-width) solid var(--color-primary-foreground); border-radius: var(--rounded-sm); font: inherit; text-decoration: none; cursor: pointer; }
.title-bar--terminal { flex-wrap: wrap; align-content: center; row-gap: var(--stock-space-1); min-height: var(--spacing-terminal-touch-min); padding: var(--stock-space-2) var(--spacing-terminal-margin); font-size: var(--typography-terminal-meta-font-size); font-weight: var(--typography-terminal-meta-font-weight); line-height: var(--typography-terminal-meta-line-height); }
.title-bar--terminal .title-bar__surface { order: 2; flex-basis: 100%; }
.title-bar--terminal .title-bar__status { order: 3; flex-basis: 100%; }
.title-bar--terminal .title-bar__control { min-width: var(--spacing-terminal-touch-min); min-height: var(--spacing-terminal-touch-min); }

/* ---- System banner: full-width strip under the Title bar ----
   @component system-banner-info -> .system-banner--info
   @component system-banner-warning -> .system-banner--warning
   @component system-banner-destructive -> .system-banner--destructive
   @component system-banner-terminal -> .system-banner--terminal */
.system-banner { display: flex; align-items: center; gap: var(--stock-space-3); min-height: var(--spacing-touch-min); padding: var(--stock-space-2) var(--stock-space-4); }
.system-banner--info { background: var(--color-info); color: var(--color-info-foreground); }
.system-banner--warning { background: var(--color-warning); color: var(--color-warning-foreground); }
.system-banner--destructive { background: var(--color-destructive); color: var(--color-destructive-foreground); }
.system-banner__text { flex: 1; min-width: 0; }
.system-banner__action { display: inline-flex; align-items: center; min-height: var(--spacing-touch-min); padding: 0; background: transparent; color: inherit; border: 0; font-size: var(--typography-button-font-size); font-weight: var(--typography-button-font-weight); line-height: var(--typography-button-line-height); text-decoration: underline; text-underline-offset: var(--stock-space-0-5); cursor: pointer; }
.system-banner--terminal { align-items: flex-start; padding-inline: var(--spacing-terminal-margin); font-size: var(--typography-terminal-meta-font-size); font-weight: var(--typography-terminal-meta-font-weight); line-height: var(--typography-terminal-meta-line-height); }
.system-banner--terminal > .icon { margin-top: var(--stock-space-0-5); }
.system-banner--terminal .system-banner__action { min-height: var(--spacing-terminal-touch-min); font-size: var(--typography-terminal-meta-font-size); font-weight: var(--typography-terminal-meta-font-weight); line-height: var(--typography-terminal-meta-line-height); }

/* ---- Sidebar (shadcn Sidebar, reads the sidebar tokens). Dashboards only ----
   @component sidebar -> .sidebar */
.sidebar { display: flex; flex: none; flex-direction: column; gap: var(--stock-space-1); width: var(--stock-sidebar-width); padding: var(--stock-space-2); background: var(--color-sidebar); color: var(--color-sidebar-foreground); border-inline-end: var(--spacing-border-width) solid var(--color-sidebar-border); }
.sidebar__group-label { padding: var(--stock-space-2); font-size: var(--stock-text-xs); font-weight: var(--stock-font-medium); line-height: var(--stock-leading-xs); }
.sidebar__item { position: relative; display: flex; align-items: center; gap: var(--stock-space-2); min-height: var(--spacing-touch-min); padding: var(--stock-space-1) var(--stock-space-2); color: inherit; border-inline-start: var(--spacing-rule-accent) solid transparent; border-radius: var(--rounded-md); text-decoration: none; }
.sidebar__item:hover { background: var(--color-sidebar-accent); color: var(--color-sidebar-accent-foreground); }
.sidebar__item.is-current, .sidebar__item[aria-current="page"] { background: var(--color-sidebar-accent); color: var(--color-sidebar-accent-foreground); border-inline-start-color: var(--color-sidebar-primary); }
.sidebar__label { flex: 1; min-width: 0; }
.sidebar__count { flex: none; min-width: var(--stock-size-6); padding: var(--stock-space-0-5) var(--stock-space-1-5); background: var(--color-sidebar-primary); color: var(--color-sidebar-primary-foreground); border-radius: var(--rounded-sm); font-size: var(--stock-text-xs); font-weight: var(--stock-font-semibold); line-height: var(--stock-leading-xs); font-variant-numeric: tabular-nums; text-align: center; }
.sidebar--collapsed { width: var(--stock-sidebar-width-icon); }
.sidebar--collapsed .sidebar__group-label { display: none; }
.sidebar--collapsed .sidebar__item { flex-direction: column; justify-content: center; gap: var(--stock-space-0-5); padding-inline: 0; }
.sidebar--collapsed .sidebar__label { position: absolute; width: var(--spacing-border-width); height: var(--spacing-border-width); overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.sidebar--collapsed .sidebar__count { padding-block: 0; }

/* ---- Dialog. Default is stock shadcn (stock shadow). Terminal size per DESIGN.md ----
   @component dialog-terminal -> .dialog--terminal */
.dialog-overlay { position: absolute; inset: 0; z-index: 4; display: grid; place-items: center; padding: var(--spacing-terminal-margin); background: var(--stock-overlay); }
.dialog { display: flex; flex-direction: column; gap: var(--stock-space-4); width: 100%; max-width: var(--stock-dialog-max-width); padding: var(--stock-space-6); background: var(--color-card); color: var(--color-card-foreground); border: var(--spacing-border-width) solid var(--color-border); border-radius: var(--rounded-md); box-shadow: var(--stock-shadow-lg); }
.dialog__title { font-size: var(--stock-text-lg); font-weight: var(--stock-font-semibold); line-height: var(--stock-leading-lg); }
.dialog__body { color: var(--color-muted-foreground); }
.dialog__actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: var(--stock-space-2); }
.dialog--terminal { gap: var(--spacing-terminal-gap); padding: var(--spacing-terminal-margin); font-size: var(--typography-terminal-body-font-size); font-weight: var(--typography-terminal-body-font-weight); line-height: var(--typography-terminal-body-line-height); }
.dialog--terminal .dialog__title { font-size: var(--typography-terminal-title-font-size); font-weight: var(--typography-terminal-title-font-weight); line-height: var(--typography-terminal-title-line-height); letter-spacing: var(--typography-terminal-title-letter-spacing); }
.dialog--terminal .dialog__body { color: var(--color-foreground); font-size: var(--typography-terminal-body-font-size); font-weight: var(--typography-terminal-body-font-weight); line-height: var(--typography-terminal-body-line-height); }
.dialog--terminal .dialog__actions { flex-direction: column; align-items: stretch; gap: var(--spacing-terminal-gap); }

/* ---- Side panel (shadcn Sheet, side right). Dashboards only ----
   @component side-panel -> .side-panel
   @component side-panel-wide -> .side-panel--wide
   Slides in over a list or full page, which stays visible and inert behind .side-panel-scrim.
   Header (title, Status badge, icon Buttons, Close last), scrolling body, fixed footer (Cancel, then the primary Button).
   .side-panel--full is the full-width layout the product takes by breakpoint (EXPERIENCE.md, Responsive & Platform).
   .form-footer is the same footer at the bottom of a full-page form. */
.side-panel-scrim { position: absolute; inset: 0; z-index: 2; background: var(--stock-overlay); }
.side-panel { position: absolute; inset-block: 0; inset-inline-end: 0; z-index: 3; display: flex; flex-direction: column; width: var(--spacing-side-panel-width); max-width: 100%; background: var(--color-card); color: var(--color-card-foreground); border-inline-start: var(--spacing-border-width) solid var(--color-border); box-shadow: var(--stock-shadow-lg); }
.side-panel--wide { width: var(--spacing-side-panel-width-wide); }
.side-panel--full { width: 100%; border-inline-start: 0; }
.side-panel--static { position: relative; inset: auto; z-index: auto; }
.side-panel__header { display: flex; flex: none; align-items: center; gap: var(--stock-space-3); min-height: calc(var(--spacing-touch-min) + 2 * var(--stock-space-3)); padding: var(--stock-space-3) var(--stock-space-3) var(--stock-space-3) var(--stock-space-6); border-bottom: var(--spacing-border-width) solid var(--color-border); }
.side-panel__title { flex: 0 1 auto; min-width: 0; font-size: var(--typography-heading-font-size); font-weight: var(--typography-heading-font-weight); line-height: var(--typography-heading-line-height); letter-spacing: var(--typography-heading-letter-spacing); }
.side-panel__actions { display: flex; flex: none; align-items: center; gap: var(--stock-space-1); margin-inline-start: auto; }
.side-panel__body { display: flex; flex: 1 1 auto; flex-direction: column; gap: var(--stock-space-6); min-height: 0; padding: var(--stock-space-6); overflow-y: auto; }
.side-panel__body > * { flex: none; }
.side-panel__footer, .form-footer { display: flex; flex: none; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: var(--stock-space-2); padding: var(--stock-space-3) var(--stock-space-6); background: var(--color-card); border-top: var(--spacing-border-width) solid var(--color-border); }

/* ---- Pagination (shadcn Pagination with a brand override) ----
   @component pagination -> .pagination
   @component pagination-terminal -> .pagination--terminal
   Range text, rows-per-page Select, then Previous, page numbers, Next. Previous and Next are icon Buttons.
   One page: the range text alone. Terminal: range text with Previous and Next only. */
.pagination { display: flex; flex-wrap: wrap; align-items: center; gap: var(--stock-space-2) var(--stock-space-4); color: var(--color-foreground); }
.pagination__summary { margin-inline-end: auto; color: var(--color-muted-foreground); font-variant-numeric: tabular-nums; }
.pagination__size { display: inline-flex; align-items: center; gap: var(--stock-space-2); color: var(--color-muted-foreground); white-space: nowrap; }
.pagination__size .input { width: auto; min-width: 0; }
.pagination__pages { display: flex; flex-wrap: wrap; align-items: center; gap: var(--stock-space-1); }
.pagination__item { display: inline-flex; align-items: center; justify-content: center; min-width: var(--spacing-touch-min); min-height: var(--spacing-touch-min); padding: 0 var(--stock-space-2); background: transparent; color: var(--color-foreground); border: var(--spacing-border-width) solid transparent; border-radius: var(--rounded-sm); font: inherit; font-weight: var(--stock-font-medium); font-variant-numeric: tabular-nums; text-decoration: none; cursor: pointer; }
.pagination__item:hover { background: var(--color-accent); color: var(--color-accent-foreground); }
.pagination__item.is-current, .pagination__item[aria-current="page"] { background: var(--color-card); color: var(--color-foreground); border-color: var(--color-input); font-weight: var(--typography-button-font-weight); }
.pagination__gap { display: inline-grid; place-items: center; min-width: var(--stock-size-6); color: var(--color-muted-foreground); }
.pagination__text { color: var(--color-muted-foreground); font-variant-numeric: tabular-nums; white-space: nowrap; }
.pagination--terminal { gap: var(--spacing-terminal-gap); font-size: var(--typography-terminal-meta-font-size); font-weight: var(--typography-terminal-meta-font-weight); line-height: var(--typography-terminal-meta-line-height); }
.pagination--terminal .pagination__pages { gap: var(--spacing-terminal-gap); }

/* ---- Status badge: solid fill, small round dot, then the PRD status name ----
   @component status-badge-success -> .status-badge--success
   @component status-badge-warning -> .status-badge--warning
   @component status-badge-destructive -> .status-badge--destructive
   @component status-badge-info -> .status-badge--info
   @component status-badge-muted -> .status-badge--muted
   @component status-badge-terminal -> .status-badge--terminal
   The text label carries the status. Put a .visually-hidden "Status: " before it. */
.status-badge { display: inline-flex; align-items: center; gap: var(--stock-space-1-5); padding: var(--stock-space-0-5) var(--stock-space-2); border-radius: var(--rounded-sm); font-size: var(--stock-text-xs); font-weight: var(--stock-font-medium); line-height: var(--stock-leading-xs); }
.status-badge::before { content: ""; flex: none; width: var(--stock-space-1-5); height: var(--stock-space-1-5); border-radius: var(--rounded-full); background: currentColor; }
.status-badge--success { background: var(--color-success); color: var(--color-success-foreground); }
.status-badge--warning { background: var(--color-warning); color: var(--color-warning-foreground); }
.status-badge--destructive { background: var(--color-destructive); color: var(--color-destructive-foreground); }
.status-badge--info { background: var(--color-info); color: var(--color-info-foreground); }
.status-badge--muted { background: var(--color-muted); color: var(--color-muted-foreground); }
.status-badge--terminal { gap: var(--stock-space-2); padding: var(--stock-space-1) var(--stock-space-3); font-size: var(--typography-terminal-meta-font-size); font-weight: var(--typography-terminal-meta-font-weight); line-height: var(--typography-terminal-meta-line-height); }
.status-badge--terminal::before { width: var(--stock-space-2); height: var(--stock-space-2); }

/* ---- Balance figures: one box per figure. Row by default, stack at terminal size ----
   @component balance-figures -> .balance-figures
   @component balance-figures-available -> .balance-figures__box--available
   @component balance-figures-terminal -> .balance-figures--terminal */
.balance-figures { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: var(--stock-space-3); }
.balance-figures__box { display: flex; flex-direction: column; gap: var(--stock-space-1); padding: var(--stock-space-3) var(--stock-space-4); background: var(--color-card); color: var(--color-card-foreground); border: var(--spacing-border-width) solid var(--color-border); border-radius: var(--rounded-md); }
.balance-figures__label { font-size: var(--typography-label-font-size); font-weight: var(--typography-label-font-weight); line-height: var(--typography-label-line-height); letter-spacing: var(--typography-label-letter-spacing); text-transform: uppercase; color: var(--color-muted-foreground); }
.balance-figures__figure { font-size: var(--typography-figure-font-size); font-weight: var(--typography-figure-font-weight); line-height: var(--typography-figure-line-height); letter-spacing: var(--typography-figure-letter-spacing); font-variant-numeric: tabular-nums; }
.balance-figures__sub { color: var(--color-muted-foreground); }
.balance-figures__box--available { background: var(--color-accent); color: var(--color-accent-foreground); border-color: var(--color-accent); }
.balance-figures__box--available .balance-figures__label { color: inherit; }
.balance-figures--terminal { grid-auto-flow: row; gap: var(--spacing-terminal-gap); }
.balance-figures--terminal .balance-figures__label { font-size: var(--typography-terminal-meta-font-size); font-weight: var(--typography-terminal-meta-font-weight); line-height: var(--typography-terminal-meta-line-height); letter-spacing: normal; }
.balance-figures--terminal .balance-figures__figure { font-size: var(--typography-terminal-balance-font-size); font-weight: var(--typography-terminal-balance-font-weight); line-height: var(--typography-terminal-balance-line-height); letter-spacing: var(--typography-terminal-balance-letter-spacing); }
.balance-figures--terminal .balance-figures__sub { font-size: var(--typography-terminal-meta-font-size); font-weight: var(--typography-terminal-meta-font-weight); line-height: var(--typography-terminal-meta-line-height); }

/* ---- Masked Program ID number: inherits the type size of its context ----
   @component masked-id -> .masked-id */
.masked-id { color: var(--color-foreground); font-variant-numeric: tabular-nums; white-space: nowrap; }
.masked-id__mask { color: var(--color-muted-foreground); }

/* ---- Identity panel: rectangular portrait photo, then name, then metadata ----
   @component identity-panel -> .identity-panel
   @component identity-panel-terminal -> .identity-panel--terminal
   Default is the profile size. --list is the list size. */
.identity-panel { display: flex; align-items: flex-start; gap: var(--stock-space-4); }
.identity-panel__photo { flex: none; }
.identity-panel .photo { width: var(--spacing-photo-profile); }
.identity-panel__body { display: flex; flex-direction: column; gap: var(--stock-space-1); min-width: 0; }
.identity-panel__name { font-size: var(--typography-heading-font-size); font-weight: var(--typography-heading-font-weight); line-height: var(--typography-heading-line-height); letter-spacing: var(--typography-heading-letter-spacing); }
.identity-panel__meta { color: var(--color-muted-foreground); }
.identity-panel__meta b, .identity-panel__value { color: var(--color-foreground); font-weight: var(--stock-font-medium); }
.identity-panel--list { align-items: center; gap: var(--stock-space-3); }
.identity-panel--list .photo { width: var(--spacing-photo-list); }
.identity-panel--list .identity-panel__name { font-size: inherit; font-weight: var(--stock-font-medium); line-height: inherit; letter-spacing: normal; }
.identity-panel--terminal { flex-direction: column; align-items: center; gap: var(--spacing-terminal-gap); text-align: center; }
.identity-panel--terminal .identity-panel__photo { display: flex; align-self: stretch; justify-content: center; margin-inline: calc(-1 * var(--spacing-terminal-margin)); }
.identity-panel--terminal .photo { width: var(--spacing-terminal-photo-width); }
.identity-panel--terminal .identity-panel__body { align-items: center; }
.identity-panel--terminal .identity-panel__name { font-size: var(--typography-terminal-name-font-size); font-weight: var(--typography-terminal-name-font-weight); line-height: var(--typography-terminal-name-line-height); letter-spacing: var(--typography-terminal-name-letter-spacing); }
.identity-panel--terminal .identity-panel__meta { font-size: var(--typography-terminal-meta-font-size); font-weight: var(--typography-terminal-meta-font-weight); line-height: var(--typography-terminal-meta-line-height); }
.identity-panel__reps { display: flex; justify-content: center; gap: var(--spacing-terminal-gap); }
.identity-panel__rep { display: flex; flex-direction: column; align-items: center; gap: var(--stock-space-1); font-size: var(--typography-terminal-meta-font-size); font-weight: var(--typography-terminal-meta-font-weight); line-height: var(--typography-terminal-meta-line-height); }
.identity-panel .identity-panel__rep .photo { width: var(--spacing-photo-list); }

/* ---- Reason field: a labeled select, a textarea, or both, with a character count ----
   @component reason-field -> .reason-field
   @component reason-field-terminal -> .reason-field--terminal
   Its select and textarea are .input. At terminal size the list is a .choice-list--terminal. */
.reason-field { display: flex; flex-direction: column; gap: var(--stock-space-2); }
.reason-field .input { background: var(--color-card); border-color: var(--color-input); border-radius: var(--rounded-sm); }
.reason-field .input.is-error, .reason-field .input[aria-invalid="true"] { border-color: var(--color-destructive); }
.reason-field__label { font-weight: var(--stock-font-medium); }
.reason-field__footer { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--stock-space-3); }
.reason-field__error { color: var(--color-destructive); }
.reason-field__count { margin-inline-start: auto; color: var(--color-muted-foreground); font-variant-numeric: tabular-nums; white-space: nowrap; }
.reason-field--terminal { gap: var(--spacing-terminal-gap); font-size: var(--typography-terminal-body-font-size); font-weight: var(--typography-terminal-body-font-weight); line-height: var(--typography-terminal-body-line-height); }
.reason-field--terminal .reason-field__label { font-size: var(--typography-terminal-body-font-size); font-weight: var(--typography-terminal-body-font-weight); line-height: var(--typography-terminal-body-line-height); font-weight: var(--stock-font-medium); }
.reason-field--terminal .reason-field__error, .reason-field--terminal .reason-field__count { font-size: var(--typography-terminal-meta-font-size); font-weight: var(--typography-terminal-meta-font-weight); line-height: var(--typography-terminal-meta-line-height); }
.reason-field--terminal .choice-list__row { min-height: var(--spacing-terminal-touch-min); }

/* ---- State message: empty, no result, failed load, no permission, no camera, no reader ----
   @component state-message -> .state-message
   @component state-message-terminal -> .state-message--terminal */
.state-message { display: flex; flex-direction: column; align-items: center; gap: var(--stock-space-3); padding: var(--stock-space-8) var(--stock-space-6); background: var(--color-card); border: var(--spacing-border-width) solid var(--color-border); border-radius: var(--rounded-md); text-align: center; }
.state-message__icon { color: var(--color-muted-foreground); }
.state-message__title { font-size: var(--typography-heading-font-size); font-weight: var(--typography-heading-font-weight); line-height: var(--typography-heading-line-height); letter-spacing: var(--typography-heading-letter-spacing); }
.state-message__body { max-width: 60ch; color: var(--color-muted-foreground); }
.state-message--terminal { gap: var(--spacing-terminal-gap); padding: var(--spacing-terminal-margin); }
.state-message--terminal .state-message__title { font-size: var(--typography-terminal-title-font-size); font-weight: var(--typography-terminal-title-font-weight); line-height: var(--typography-terminal-title-line-height); letter-spacing: var(--typography-terminal-title-letter-spacing); }
.state-message--terminal .state-message__body { font-size: var(--typography-terminal-body-font-size); font-weight: var(--typography-terminal-body-font-weight); line-height: var(--typography-terminal-body-line-height); }

/* ---- Data table ----
   @component data-table -> .data-table
   @component data-table-terminal -> .data-table--terminal
   Default: a real <table>. Terminal: a list of .data-table__row, no header row.
   Parts of the default size: .data-table__row-detail (row-detail-foreground, row-detail-value-foreground),
   a line of labeled values under the first cell that holds the row's low-priority columns;
   .data-table__total (total-weight), a total row. */
.data-table { width: 100%; border-collapse: collapse; background: var(--color-card); color: var(--color-card-foreground); }
.data-table caption { padding: var(--stock-space-3) var(--stock-space-4); color: var(--color-muted-foreground); text-align: start; }
.data-table thead th { padding: var(--stock-space-2) var(--stock-space-4); background: var(--color-muted); color: var(--color-muted-foreground); font-size: var(--typography-label-font-size); font-weight: var(--typography-label-font-weight); line-height: var(--typography-label-line-height); letter-spacing: var(--typography-label-letter-spacing); text-transform: uppercase; text-align: start; white-space: nowrap; }
.data-table tbody th, .data-table tbody td { height: var(--spacing-table-row-height); padding: var(--stock-space-2) var(--stock-space-4); border-top: var(--spacing-border-width) solid var(--color-border); font-weight: var(--stock-font-normal); text-align: start; vertical-align: middle; }
.data-table .is-amount { font-variant-numeric: tabular-nums; text-align: end; white-space: nowrap; }
.data-table tbody tr:hover { background: color-mix(in srgb, var(--color-muted) var(--stock-hover-row), transparent); }
.data-table tbody tr.is-selected, .data-table tbody tr[aria-selected="true"] { background: var(--color-secondary); }
.data-table__sort { display: inline-flex; align-items: center; gap: var(--stock-space-1); min-height: var(--spacing-touch-min); padding: 0; background: transparent; color: inherit; border: 0; font: inherit; letter-spacing: inherit; text-transform: inherit; cursor: pointer; }
.data-table__row-detail { display: flex; flex-wrap: wrap; gap: 0 var(--stock-space-3); margin-top: var(--stock-space-0-5); color: var(--color-muted-foreground); font-weight: var(--stock-font-normal); font-variant-numeric: tabular-nums; }
.data-table__row-detail b { color: var(--color-foreground); font-weight: var(--stock-font-medium); white-space: nowrap; }
.data-table tbody tr.data-table__total > th, .data-table tbody tr.data-table__total > td { font-weight: var(--typography-label-font-weight); }
.data-table--terminal { display: flex; flex-direction: column; border: var(--spacing-border-width) solid var(--color-border); border-radius: var(--rounded-md); }
.data-table__row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; column-gap: var(--spacing-terminal-gap); min-height: var(--spacing-terminal-touch-min); padding: var(--stock-space-2) var(--spacing-terminal-margin); color: inherit; border-top: var(--spacing-border-width) solid var(--color-border); text-decoration: none; }
.data-table__row:first-child { border-top: 0; }
.data-table__main { font-size: var(--typography-terminal-body-font-size); font-weight: var(--typography-terminal-body-font-weight); line-height: var(--typography-terminal-body-line-height); }
.data-table__details { grid-column: 1; display: flex; flex-wrap: wrap; align-items: center; gap: var(--stock-space-1) var(--stock-space-2); color: var(--color-muted-foreground); font-size: var(--typography-terminal-meta-font-size); font-weight: var(--typography-terminal-meta-font-weight); line-height: var(--typography-terminal-meta-line-height); }
.data-table__amount { grid-column: 2; grid-row: 1 / span 2; font-size: var(--typography-terminal-body-font-size); font-weight: var(--typography-terminal-body-font-weight); line-height: var(--typography-terminal-body-line-height); font-variant-numeric: tabular-nums; text-align: end; white-space: nowrap; }

/* ---- Detail list: read-only label and value pairs for the facts of one record ----
   @component detail-list -> .detail-list
   A <dl>. Each .detail-list__item is a <div> holding one <dt> label and one <dd> value. --wide spans the row. */
.detail-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--stock-field-min-width), 1fr)); gap: var(--stock-space-4) var(--stock-space-6); }
.detail-list__item { display: flex; flex-direction: column; gap: var(--stock-space-1); min-width: 0; }
.detail-list__item--wide { grid-column: 1 / -1; }
.detail-list__label { color: var(--color-muted-foreground); font-weight: var(--stock-font-medium); }
.detail-list__value { color: var(--color-foreground); }

/* ---- Filter bar: a panel above a table or chart group ----
   @component filter-bar -> .filter-bar */
.filter-bar { display: flex; flex-wrap: wrap; align-items: flex-end; gap: var(--stock-space-3); padding: var(--stock-space-4); background: var(--color-card); border: var(--spacing-border-width) solid var(--color-border); border-radius: var(--rounded-md); }
.filter-bar > .field { flex: 1 1 var(--stock-field-min-width); }
.filter-bar__chips { display: flex; flex-basis: 100%; flex-wrap: wrap; align-items: center; gap: var(--stock-space-2); }
.filter-bar__chip { display: inline-flex; align-items: center; min-height: var(--spacing-touch-min); padding-inline-start: var(--stock-space-3); background: var(--color-secondary); color: var(--color-secondary-foreground); border: var(--spacing-border-width) solid var(--color-input); border-radius: var(--rounded-sm); font-weight: var(--stock-font-medium); }
.filter-bar__chip-remove { display: inline-flex; align-items: center; align-self: stretch; justify-content: center; min-width: var(--spacing-touch-min); padding: 0; background: transparent; color: inherit; border: 0; cursor: pointer; }

/* ---- Stat tile: label, figure, comparison line with an arrow glyph. No colour on the comparison ----
   @component stat-tile -> .stat-tile */
.stat-tile { display: flex; flex-direction: column; gap: var(--stock-space-1); padding: var(--stock-space-4); background: var(--color-card); color: var(--color-card-foreground); border: var(--spacing-border-width) solid var(--color-border); border-radius: var(--rounded-md); font: inherit; text-align: start; text-decoration: none; }
button.stat-tile, a.stat-tile { cursor: pointer; }
.stat-tile__label { font-size: var(--typography-label-font-size); font-weight: var(--typography-label-font-weight); line-height: var(--typography-label-line-height); letter-spacing: var(--typography-label-letter-spacing); text-transform: uppercase; color: var(--color-muted-foreground); }
.stat-tile__figure { font-size: var(--typography-figure-font-size); font-weight: var(--typography-figure-font-weight); line-height: var(--typography-figure-line-height); letter-spacing: var(--typography-figure-letter-spacing); font-variant-numeric: tabular-nums; }
.stat-tile__comparison { display: flex; align-items: center; gap: var(--stock-space-1); color: var(--color-muted-foreground); font-variant-numeric: tabular-nums; }

/* ---- Chart panel: classes for the parts of an inline SVG chart ----
   @component chart-panel -> .chart-panel
   Previous period is always dashed (lines) or hatched (bars). Every series has a direct label. */
.chart-panel { display: flex; flex-direction: column; gap: var(--stock-space-3); padding: var(--stock-space-4); background: var(--color-card); border: var(--spacing-border-width) solid var(--color-border); border-radius: var(--rounded-md); }
.chart-panel__header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--stock-space-3); }
.chart-panel__title { font-size: var(--typography-heading-font-size); font-weight: var(--typography-heading-font-weight); line-height: var(--typography-heading-line-height); letter-spacing: var(--typography-heading-letter-spacing); }
.chart-panel__summary { color: var(--color-muted-foreground); }
.chart-panel__chart { display: block; width: 100%; height: auto; }
.chart-panel__grid { fill: none; stroke: var(--color-border); stroke-width: var(--spacing-border-width); }
.chart-panel__axis { fill: var(--color-muted-foreground); font-size: var(--stock-text-xs); font-variant-numeric: tabular-nums; }
.chart-panel__series-current { fill: none; stroke: var(--color-primary); stroke-width: var(--spacing-chart-stroke-width); }
.chart-panel__series-previous { fill: none; stroke: var(--color-input); stroke-width: var(--spacing-chart-stroke-width); stroke-dasharray: var(--spacing-chart-dash); }
.chart-panel__marker-current { fill: var(--color-primary); }
.chart-panel__marker-previous { fill: var(--color-card); stroke: var(--color-input); stroke-width: var(--spacing-chart-stroke-width); }
.chart-panel__bar-current { fill: var(--color-primary); }
.chart-panel__bar-previous { stroke: var(--color-input); stroke-width: var(--spacing-border-width); }
.chart-panel__hatch { stroke: var(--color-input); stroke-width: var(--spacing-chart-stroke-width); }
.chart-panel__label-current { fill: var(--color-primary); font-size: var(--stock-text-xs); font-weight: var(--stock-font-semibold); }
.chart-panel__label-previous { fill: var(--color-muted-foreground); font-size: var(--stock-text-xs); font-weight: var(--stock-font-semibold); }

/* ---- Map panel (local, AD-29): classes for the parts of an inline SVG map ----
   @component map-panel -> .map-panel
   Ramp: five equal steps from colors.secondary to colors.input. Selected area: draw __selected-inner
   then __selected-outer over the area, both clipped to the area's own shape. */
.map-panel { --_step-1: var(--color-secondary); --_step-2: color-mix(in srgb, var(--color-secondary) 75%, var(--color-input)); --_step-3: color-mix(in srgb, var(--color-secondary) 50%, var(--color-input)); --_step-4: color-mix(in srgb, var(--color-secondary) 25%, var(--color-input)); --_step-5: var(--color-input); display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: var(--stock-space-4); padding: var(--stock-space-4); background: var(--color-card); border: var(--spacing-border-width) solid var(--color-border); border-radius: var(--rounded-md); }
.map-panel__header { grid-column: 1 / -1; }
.map-panel__title { font-size: var(--typography-heading-font-size); font-weight: var(--typography-heading-font-weight); line-height: var(--typography-heading-line-height); letter-spacing: var(--typography-heading-letter-spacing); }
.map-panel__summary { color: var(--color-muted-foreground); }
.map-panel__map { display: block; width: 100%; height: auto; }
.map-panel__area { fill: var(--_step-1); stroke: var(--color-foreground); stroke-width: var(--spacing-border-width); }
.map-panel__area--step-2 { fill: var(--_step-2); }
.map-panel__area--step-3 { fill: var(--_step-3); }
.map-panel__area--step-4 { fill: var(--_step-4); }
.map-panel__area--step-5 { fill: var(--_step-5); }
.map-panel__selected-inner { fill: none; stroke: var(--color-card); stroke-width: calc(4 * var(--spacing-focus-ring-width)); }
.map-panel__selected-outer { fill: none; stroke: var(--color-foreground); stroke-width: calc(2 * var(--spacing-focus-ring-width)); }
.map-panel__hatch-halo { stroke: var(--color-card); stroke-width: calc(3 * var(--spacing-border-width)); }
.map-panel__hatch { stroke: var(--color-foreground); stroke-width: var(--spacing-border-width); }
.map-panel__side { display: flex; flex-direction: column; gap: var(--stock-space-3); min-width: 0; }
.map-panel__legend { display: flex; flex-direction: column; gap: var(--stock-space-1); }
.map-panel__legend-row { display: flex; align-items: center; gap: var(--stock-space-2); font-variant-numeric: tabular-nums; }
.map-panel__swatch { flex: none; width: var(--stock-size-6); height: var(--stock-size-4); background: var(--_step-1); border: var(--spacing-border-width) solid var(--color-foreground); }
.map-panel__swatch--step-2 { background: var(--_step-2); }
.map-panel__swatch--step-3 { background: var(--_step-3); }
.map-panel__swatch--step-4 { background: var(--_step-4); }
.map-panel__swatch--step-5 { background: var(--_step-5); }
.map-panel__swatch--hatch { background: repeating-linear-gradient(45deg, var(--color-foreground) 0 var(--spacing-border-width), var(--color-card) var(--spacing-border-width) calc(4 * var(--spacing-border-width))); }

/* ---- Change history: newest first, "Now" and "Was" in words ----
   @component change-history -> .change-history */
.change-history { display: flex; flex-direction: column; }
.change-history__entry { display: flex; flex-direction: column; gap: var(--stock-space-1); padding: var(--stock-space-3) 0; border-top: var(--spacing-border-width) solid var(--color-border); }
.change-history__entry:first-child { border-top: 0; }
.change-history__meta { color: var(--color-muted-foreground); }
.change-history__field { font-weight: var(--stock-font-medium); }
.change-history__now, .change-history__was { display: flex; align-items: center; gap: var(--stock-space-2); }
.change-history__tag { flex: none; min-width: 3em; font-weight: var(--stock-font-semibold); }
.change-history__was { color: var(--color-muted-foreground); }

/* ---- Decision panel: at the foot of an item awaiting approval ----
   @component decision-panel -> .decision-panel
   approve is .button--primary, reject is .button--destructive. */
.decision-panel { display: flex; flex-direction: column; gap: var(--stock-space-4); padding: var(--stock-space-4); background: var(--color-card); border: var(--spacing-border-width) solid var(--color-input); border-radius: var(--rounded-md); }
.decision-panel__actions { display: flex; flex-wrap: wrap; gap: var(--stock-space-2); }

/* ---- Comparison view: two panels side by side, differing fields marked in both ----
   @component comparison-view -> .comparison-view */
.comparison-view { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--stock-space-4); }
.comparison-view__header { grid-column: 1 / -1; font-size: var(--typography-heading-font-size); font-weight: var(--typography-heading-font-weight); line-height: var(--typography-heading-line-height); letter-spacing: var(--typography-heading-letter-spacing); }
.comparison-view__column { display: flex; flex-direction: column; gap: var(--stock-space-2); padding: var(--stock-space-4); background: var(--color-card); border: var(--spacing-border-width) solid var(--color-border); border-radius: var(--rounded-md); }
.comparison-view__title { font-weight: var(--stock-font-semibold); }
.comparison-view__field { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr) 5em; align-items: baseline; gap: var(--stock-space-2); padding: var(--stock-space-2) var(--stock-space-3); border-inline-start: var(--spacing-rule-accent) solid transparent; }
.comparison-view__label { color: var(--color-muted-foreground); }
.comparison-view__field.is-different { background: var(--color-accent); color: var(--color-accent-foreground); border-inline-start-color: var(--color-accent-foreground); }
.comparison-view__field.is-different .comparison-view__label { color: inherit; }
.comparison-view__mark { font-weight: var(--stock-font-semibold); text-align: end; }

/* ---- Photo capture: portrait frame with a face outline guide ----
   @component photo-capture -> .photo-capture */
.photo-capture { display: flex; flex-direction: column; gap: var(--stock-space-3); width: 100%; max-width: calc(2 * var(--spacing-photo-profile)); }
.photo-capture__frame { position: relative; width: 100%; aspect-ratio: var(--spacing-photo-aspect); overflow: hidden; background: var(--color-muted); border: var(--spacing-border-width) solid var(--color-input); border-radius: var(--rounded-md); }
.photo-capture__guide { position: absolute; left: 22%; right: 22%; top: 12%; bottom: 28%; border: var(--spacing-focus-ring-width) solid var(--color-primary-foreground); border-radius: 50%; box-shadow: 0 0 0 var(--spacing-border-width) var(--color-foreground), inset 0 0 0 var(--spacing-border-width) var(--color-foreground); }
.photo-capture__actions { display: flex; flex-wrap: wrap; gap: var(--stock-space-2); }

/* ---- File upload: dashed box, Choose file Button, one line of accepted types ----
   @component file-upload -> .file-upload */
.file-upload { display: flex; flex-direction: column; align-items: flex-start; gap: var(--stock-space-2); padding: var(--stock-space-4); background: var(--color-card); border: var(--spacing-border-width) dashed var(--color-input); border-radius: var(--rounded-md); }
.file-upload__hint, .file-upload__meta { color: var(--color-muted-foreground); }
.file-upload__file { display: flex; flex-wrap: wrap; align-items: center; gap: var(--stock-space-3); }
.file-upload__name { font-weight: var(--stock-font-medium); }
.file-upload__error { color: var(--color-destructive); }

/* ---- Step indicator: numbered boxes with a label under each, "Step n of total" beside ----
   @component step-indicator -> .step-indicator */
.step-indicator { display: flex; flex-wrap: wrap; align-items: flex-start; gap: var(--stock-space-4); }
.step-indicator__steps { display: flex; flex-wrap: wrap; gap: var(--stock-space-6); }
.step-indicator__step { display: flex; flex-direction: column; align-items: center; gap: var(--stock-space-1); min-width: var(--spacing-touch-min); padding: 0; background: transparent; color: inherit; border: 0; font: inherit; text-align: center; text-decoration: none; }
.step-indicator__box { display: grid; place-items: center; width: var(--spacing-touch-min); height: var(--spacing-touch-min); background: var(--color-card); color: var(--color-muted-foreground); border: var(--spacing-border-width) solid var(--color-input); border-radius: var(--rounded-sm); font-weight: var(--stock-font-semibold); font-variant-numeric: tabular-nums; }
.step-indicator__name { font-size: var(--typography-label-font-size); font-weight: var(--typography-label-font-weight); line-height: var(--typography-label-line-height); letter-spacing: var(--typography-label-letter-spacing); text-transform: uppercase; color: var(--color-muted-foreground); }
.step-indicator__step.is-current .step-indicator__box { background: var(--color-primary); color: var(--color-primary-foreground); border-color: var(--color-primary); }
.step-indicator__step.is-done .step-indicator__box { background: var(--color-success); color: var(--color-success-foreground); border-color: var(--color-success); }
.step-indicator__step.is-current .step-indicator__name, .step-indicator__step.is-done .step-indicator__name { color: var(--color-foreground); }
button.step-indicator__step, a.step-indicator__step { cursor: pointer; }
.step-indicator__count { align-self: center; margin-inline-start: auto; }

/* ---- Card preview: front and back at true proportions on a muted ground ----
   @component card-preview -> .card-preview */
.card-preview { display: flex; flex-wrap: wrap; gap: var(--stock-space-4); padding: var(--stock-space-4); background: var(--color-muted); border: var(--spacing-border-width) solid var(--color-border); border-radius: var(--rounded-md); }
.card-preview__item { display: flex; flex-direction: column; gap: var(--stock-space-2); }
.card-preview__label { font-size: var(--typography-label-font-size); font-weight: var(--typography-label-font-weight); line-height: var(--typography-label-line-height); letter-spacing: var(--typography-label-letter-spacing); text-transform: uppercase; color: var(--color-muted-foreground); }
.card-preview__side { display: flex; align-items: flex-start; gap: var(--stock-space-3); width: var(--spacing-card-preview-width); max-width: 100%; aspect-ratio: var(--spacing-card-aspect); padding: var(--stock-space-3); overflow: hidden; background: var(--color-card); color: var(--color-card-foreground); border: var(--spacing-border-width) solid var(--color-border); border-radius: var(--rounded-md); font-size: var(--stock-text-xs); line-height: var(--stock-leading-xs); }
.card-preview__details { display: flex; flex-direction: column; align-items: flex-start; gap: var(--stock-space-1); min-width: 0; }
.card-preview__detail { display: block; padding: 0 var(--stock-space-0-5); }
.card-preview__detail.is-selected { outline: var(--spacing-focus-ring-width) solid var(--color-ring); }

/* ---- Tap prompt: contactless icon, title, one line of instruction ----
   @component tap-prompt -> .tap-prompt
   @component tap-prompt-terminal -> .tap-prompt--terminal */
.tap-prompt { display: flex; flex-direction: column; align-items: center; gap: var(--stock-space-3); padding: var(--stock-space-6); background: var(--color-card); border: var(--spacing-border-width) solid var(--color-input); border-radius: var(--rounded-md); text-align: center; }
.tap-prompt__icon { width: var(--spacing-photo-list); height: var(--spacing-photo-list); color: var(--color-primary); }
.tap-prompt__title { font-size: var(--typography-heading-font-size); font-weight: var(--typography-heading-font-weight); line-height: var(--typography-heading-line-height); letter-spacing: var(--typography-heading-letter-spacing); }
.tap-prompt.is-off { background: var(--color-muted); color: var(--color-muted-foreground); }
.tap-prompt.is-off .tap-prompt__icon { color: inherit; }
.tap-prompt--terminal { gap: var(--spacing-terminal-gap); padding: var(--stock-space-8) var(--spacing-terminal-margin); }
.tap-prompt--terminal .tap-prompt__title { font-size: var(--typography-terminal-title-font-size); font-weight: var(--typography-terminal-title-font-weight); line-height: var(--typography-terminal-title-line-height); letter-spacing: var(--typography-terminal-title-letter-spacing); }
.tap-prompt--terminal .tap-prompt__body { font-size: var(--typography-terminal-body-font-size); font-weight: var(--typography-terminal-body-font-weight); line-height: var(--typography-terminal-body-line-height); }

/* ---- Choice list: single choice, full-width rows ----
   @component choice-list -> .choice-list
   @component choice-list-terminal -> .choice-list--terminal */
.choice-list { display: flex; flex-direction: column; gap: var(--stock-space-2); }
.choice-list__row { display: flex; align-items: center; gap: var(--stock-space-3); width: 100%; min-height: var(--spacing-touch-min); padding: var(--stock-space-2) var(--spacing-control-padding-x); background: var(--color-card); color: var(--color-foreground); border: var(--spacing-border-width) solid var(--color-input); border-radius: var(--rounded-md); font: inherit; text-align: start; cursor: pointer; }
.choice-list__text { display: flex; flex: 1; flex-direction: column; min-width: 0; }
.choice-list__sub { color: var(--color-muted-foreground); }
.choice-list__row.is-selected, .choice-list__row[aria-checked="true"] { border-color: var(--color-primary); --_edge: inset 0 0 0 calc(var(--spacing-focus-ring-width) - var(--spacing-border-width)) var(--color-primary); box-shadow: var(--_edge); }
.choice-list__row.is-selected::after, .choice-list__row[aria-checked="true"]::after { content: ""; flex: none; width: var(--stock-size-6); height: var(--stock-size-6); background: var(--color-primary); -webkit-mask: var(--icon-check) center / contain no-repeat; mask: var(--icon-check) center / contain no-repeat; }
.choice-list--terminal { gap: var(--spacing-terminal-gap); }
.choice-list--terminal .choice-list__row { min-height: var(--spacing-terminal-touch-min); padding-inline: var(--spacing-terminal-control-padding-x); font-size: var(--typography-terminal-body-font-size); font-weight: var(--typography-terminal-body-font-weight); line-height: var(--typography-terminal-body-line-height); }
.choice-list--terminal .choice-list__sub { font-size: var(--typography-terminal-meta-font-size); font-weight: var(--typography-terminal-meta-font-weight); line-height: var(--typography-terminal-meta-line-height); }

/* ---- Suggestion list: rows directly under a text field ----
   @component suggestion-list -> .suggestion-list
   @component suggestion-list-terminal -> .suggestion-list--terminal */
.suggestion-list { overflow: hidden; background: var(--color-popover); color: var(--color-popover-foreground); border: var(--spacing-border-width) solid var(--color-input); border-radius: var(--rounded-md); }
.suggestion-list__row { display: flex; align-items: center; width: 100%; min-height: var(--spacing-touch-min); padding: var(--stock-space-2) var(--spacing-control-padding-x); background: transparent; color: inherit; border: 0; border-top: var(--spacing-border-width) solid var(--color-border); font: inherit; text-align: start; cursor: pointer; }
.suggestion-list__row:first-child { border-top: 0; }
.suggestion-list__row:hover, .suggestion-list__row.is-highlighted { background: var(--color-accent); color: var(--color-accent-foreground); --_edge: inset 0 0 0 var(--spacing-focus-ring-width) var(--color-ring); box-shadow: var(--_edge); }
.suggestion-list--terminal .suggestion-list__row { min-height: var(--spacing-terminal-touch-min); padding-inline: var(--spacing-terminal-control-padding-x); font-size: var(--typography-terminal-body-font-size); font-weight: var(--typography-terminal-body-font-weight); line-height: var(--typography-terminal-body-line-height); }

/* ---- Date field ----
   @component date-field -> .date-field
   @component date-field-terminal -> .date-field--terminal
   Default: one .input plus a Calendar button. Terminal: day, month, year .input--terminal and a Today Button. */
.date-field { display: flex; align-items: flex-end; gap: var(--stock-space-2); }
.date-field > .input { flex: 1; }
.date-field--terminal { flex-wrap: wrap; gap: var(--spacing-terminal-gap); }
.date-field__part { display: flex; flex: 1 1 0; flex-direction: column; gap: var(--stock-space-1); min-width: 0; font-size: var(--typography-terminal-meta-font-size); font-weight: var(--typography-terminal-meta-font-weight); line-height: var(--typography-terminal-meta-line-height); }

/* ---- Line entry (local, CT-03) ----
   @component line-entry -> .line-entry */
.line-entry { overflow: hidden; background: var(--color-card); border: var(--spacing-border-width) solid var(--color-border); border-radius: var(--rounded-md); font-size: var(--typography-terminal-body-font-size); font-weight: var(--typography-terminal-body-font-weight); line-height: var(--typography-terminal-body-line-height); }
.line-entry__row { display: flex; align-items: center; justify-content: space-between; gap: var(--spacing-terminal-gap); width: 100%; min-height: var(--spacing-terminal-touch-min); padding: var(--stock-space-2) var(--spacing-terminal-margin); background: transparent; color: inherit; border: 0; border-top: var(--spacing-border-width) solid var(--color-border); font: inherit; text-align: start; text-decoration: none; cursor: pointer; }
.line-entry__row:first-child { border-top: 0; }
.line-entry__name { display: flex; flex: 1; flex-direction: column; min-width: 0; }
.line-entry__detail { color: var(--color-muted-foreground); font-size: var(--typography-terminal-meta-font-size); font-weight: var(--typography-terminal-meta-font-weight); line-height: var(--typography-terminal-meta-line-height); }
.line-entry__amount { font-variant-numeric: tabular-nums; white-space: nowrap; }
.line-entry__row--add { justify-content: flex-start; color: var(--color-primary); font-size: var(--typography-terminal-action-font-size); font-weight: var(--typography-terminal-action-font-weight); line-height: var(--typography-terminal-action-line-height); }
.line-entry__row--total { font-weight: var(--stock-font-semibold); cursor: default; }

/* ---- Sale summary: label and amount rows in the FR-22 order ----
   @component sale-summary -> .sale-summary */
.sale-summary { padding: var(--stock-space-1) var(--spacing-terminal-margin); background: var(--color-card); border: var(--spacing-border-width) solid var(--color-border); border-radius: var(--rounded-md); font-size: var(--typography-terminal-body-font-size); font-weight: var(--typography-terminal-body-font-weight); line-height: var(--typography-terminal-body-line-height); }
.sale-summary__row { display: flex; align-items: baseline; justify-content: space-between; gap: var(--spacing-terminal-gap); padding: var(--stock-space-2) 0; border-top: var(--spacing-border-width) solid var(--color-border); }
.sale-summary__row:first-child { border-top: 0; }
.sale-summary__amount { font-variant-numeric: tabular-nums; text-align: end; white-space: nowrap; }
.sale-summary__row--deduct .sale-summary__amount { color: var(--color-primary); font-size: var(--typography-terminal-figure-font-size); font-weight: var(--typography-terminal-figure-font-weight); line-height: var(--typography-terminal-figure-line-height); letter-spacing: var(--typography-terminal-figure-letter-spacing); }
/* CT-07: the line marked with colors.accent when cash is due */
.sale-summary__note { padding: var(--stock-space-3) var(--spacing-terminal-margin); background: var(--color-accent); color: var(--color-accent-foreground); border-inline-start: var(--spacing-rule-accent) solid var(--color-accent-foreground); border-radius: var(--rounded-md); font-size: var(--typography-terminal-body-font-size); font-weight: var(--typography-terminal-body-font-weight); line-height: var(--typography-terminal-body-line-height); }

/* ---- Presenting selector (local, CT-08) ----
   @component presenting-selector -> .presenting-selector */
.presenting-selector { display: flex; flex-direction: column; gap: var(--spacing-terminal-gap); font-size: var(--typography-terminal-body-font-size); font-weight: var(--typography-terminal-body-font-weight); line-height: var(--typography-terminal-body-line-height); }
.presenting-selector__row { display: flex; align-items: center; gap: var(--spacing-terminal-gap); width: 100%; min-height: var(--spacing-terminal-touch-min); padding: var(--stock-space-2) var(--stock-space-3); background: var(--color-card); color: var(--color-foreground); border: var(--spacing-border-width) solid var(--color-input); border-radius: var(--rounded-md); font: inherit; text-align: start; cursor: pointer; }
.presenting-selector__text { display: flex; flex: 1; flex-direction: column; min-width: 0; }
.presenting-selector__role { color: var(--color-muted-foreground); font-size: var(--typography-terminal-meta-font-size); font-weight: var(--typography-terminal-meta-font-weight); line-height: var(--typography-terminal-meta-line-height); }
.presenting-selector__selected { display: none; align-items: center; gap: var(--stock-space-1); font-weight: var(--stock-font-semibold); font-size: var(--typography-terminal-meta-font-size); font-weight: var(--typography-terminal-meta-font-weight); line-height: var(--typography-terminal-meta-line-height); font-weight: var(--stock-font-semibold); }
.presenting-selector__row.is-selected, .presenting-selector__row[aria-checked="true"] { background: var(--color-accent); color: var(--color-accent-foreground); border-color: var(--color-accent-foreground); --_edge: inset 0 0 0 calc(var(--spacing-focus-ring-width) - var(--spacing-border-width)) var(--color-accent-foreground); box-shadow: var(--_edge); }
.presenting-selector__row.is-selected .presenting-selector__selected, .presenting-selector__row[aria-checked="true"] .presenting-selector__selected { display: inline-flex; }

/* ---- PIN pad: one size, Beneficiary-facing scale. Keys shrink with the screen, text never does ----
   @component pin-pad -> .pin-pad
   Keys take from key-height-min up to key-height. The row gap runs from key-gap-min up to key-gap. */
.pin-pad { display: flex; flex-direction: column; align-items: center; gap: var(--spacing-pin-block-gap); width: 100%; max-width: var(--spacing-pin-pad-max-width); min-height: 0; margin-inline: auto; background: var(--color-background); color: var(--color-foreground); text-align: center; font-size: var(--typography-pin-body-font-size); font-weight: var(--typography-pin-body-font-weight); line-height: var(--typography-pin-body-line-height); }
.pin-pad__prompt { flex: none; font-size: var(--typography-pin-prompt-font-size); font-weight: var(--typography-pin-prompt-font-weight); line-height: var(--typography-pin-prompt-line-height); }
.pin-pad__prompt.is-error, .pin-pad__error { color: var(--color-destructive); }
.pin-pad__entry { display: flex; flex: none; align-items: center; justify-content: center; gap: var(--spacing-pin-key-gap); }
.pin-pad__dots { display: flex; gap: var(--spacing-pin-key-gap-min); }
.pin-pad__dot { width: var(--spacing-pin-dot-size); height: var(--spacing-pin-dot-size); border: var(--spacing-focus-ring-width) solid var(--color-input); border-radius: var(--rounded-full); }
.pin-pad__dot.is-filled { background: var(--color-foreground); border-color: var(--color-foreground); }
.pin-pad__keys { display: grid; flex: 1 1 auto; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(4, minmax(var(--spacing-pin-key-height-min), var(--spacing-pin-key-height))); align-content: space-between; column-gap: var(--spacing-pin-key-gap); row-gap: var(--spacing-pin-key-gap-min); width: 100%; min-height: calc(4 * var(--spacing-pin-key-height-min) + 3 * var(--spacing-pin-key-gap-min)); max-height: calc(4 * var(--spacing-pin-key-height) + 3 * var(--spacing-pin-key-gap)); }
.pin-pad__key { display: flex; align-items: center; justify-content: center; min-height: 0; padding: 0; background: var(--color-card); color: var(--color-foreground); border: var(--spacing-border-width) solid var(--color-input); border-radius: var(--rounded-md); font-size: var(--typography-pin-key-font-size); font-weight: var(--typography-pin-key-font-weight); line-height: var(--typography-pin-key-line-height); cursor: pointer; }
.pin-pad__key:active, .pin-pad__key.is-pressed { background: var(--color-secondary); }
.pin-pad__key--delete { font-size: var(--typography-pin-action-font-size); font-weight: var(--typography-pin-action-font-weight); line-height: var(--typography-pin-action-line-height); }
.pin-pad.is-locked .pin-pad__key { background: var(--color-muted); color: var(--color-muted-foreground); cursor: not-allowed; }

/* ---- Hand-over frame: full-screen frame of every Beneficiary-facing screen ----
   @component hand-over-frame -> .hand-over-frame
   Layouts: PIN entry (context, .pin-pad, actions) and message (wordmark, message, actions). Never scrolls on the Counter Terminal. */
.hand-over-frame { display: flex; flex-direction: column; align-items: center; gap: var(--spacing-pin-block-gap); height: 100%; padding: var(--spacing-terminal-margin); overflow: hidden; background: var(--color-background); color: var(--color-foreground); text-align: center; font-size: var(--typography-pin-body-font-size); font-weight: var(--typography-pin-body-font-weight); line-height: var(--typography-pin-body-line-height); }
.hand-over-frame > * { flex: none; width: 100%; max-width: var(--spacing-pin-pad-max-width); }
.hand-over-frame > .pin-pad { flex: 1 1 auto; }
.hand-over-frame__context { display: flex; flex-direction: column; }
.hand-over-frame__amount { color: var(--color-primary); font-size: var(--typography-pin-amount-font-size); font-weight: var(--typography-pin-amount-font-weight); line-height: var(--typography-pin-amount-line-height); letter-spacing: var(--typography-pin-amount-letter-spacing); font-variant-numeric: tabular-nums; }
.hand-over-frame__wordmark { color: var(--color-primary); font-size: var(--typography-wordmark-font-size); font-weight: var(--typography-wordmark-font-weight); letter-spacing: var(--typography-wordmark-letter-spacing); }
.hand-over-frame > .hand-over-frame__message { display: flex; flex: 1 1 auto; flex-direction: column; justify-content: center; gap: var(--spacing-pin-block-gap); }
.hand-over-frame__prompt { font-size: var(--typography-pin-prompt-font-size); font-weight: var(--typography-pin-prompt-font-weight); line-height: var(--typography-pin-prompt-line-height); }
.hand-over-frame__actions { display: grid; grid-auto-columns: minmax(0, 1fr); grid-auto-flow: column; gap: var(--spacing-terminal-gap); margin-top: auto; }
.hand-over-frame .button--terminal { font-size: var(--typography-pin-action-font-size); font-weight: var(--typography-pin-action-font-weight); line-height: var(--typography-pin-action-line-height); }
/* @component hand-over-frame-centered -> .hand-over-frame--centered
   For a screen taller than the frame's content: AD-12 on a tablet or desktop. The same parts as one block,
   pin-block-gap apart, centered vertically. Keys take their full size and gap. The base rule fills the
   handheld screen and puts Cancel and Confirm at its bottom edge. */
.hand-over-frame--centered { justify-content: center; }
.hand-over-frame--centered > .pin-pad { flex: none; }
.hand-over-frame--centered .pin-pad__keys { flex: none; height: calc(4 * var(--spacing-pin-key-height) + 3 * var(--spacing-pin-key-gap)); }
.hand-over-frame--centered > .hand-over-frame__actions { margin-top: 0; }

/* ---- Step screen: frame of every staff-facing Counter Terminal screen ----
   @component step-screen -> .step-screen
   Title bar, kicker with the sale number, title, content, primary Button fixed at the bottom.
   .step-screen__footer holds the primary Button only. .step-screen__actions is the last block of the
   content: the secondary Buttons, full width, stacked, at the end of the content area. */
.step-screen { display: flex; flex-direction: column; height: 100%; background: var(--color-background); color: var(--color-foreground); font-size: var(--typography-terminal-body-font-size); font-weight: var(--typography-terminal-body-font-weight); line-height: var(--typography-terminal-body-line-height); }
.step-screen > * { flex: none; }
.step-screen > .step-screen__content { display: flex; flex: 1 1 auto; flex-direction: column; gap: var(--spacing-terminal-gap); min-height: 0; padding: var(--spacing-terminal-gap) var(--spacing-terminal-margin); overflow-y: auto; }
.step-screen__kicker { color: var(--color-muted-foreground); font-size: var(--typography-terminal-meta-font-size); font-weight: var(--typography-terminal-meta-font-weight); line-height: var(--typography-terminal-meta-line-height); }
.step-screen__title { font-size: var(--typography-terminal-title-font-size); font-weight: var(--typography-terminal-title-font-weight); line-height: var(--typography-terminal-title-line-height); letter-spacing: var(--typography-terminal-title-letter-spacing); }
.step-screen__actions { display: flex; flex-direction: column; gap: var(--spacing-terminal-gap); margin-top: auto; }
.step-screen__footer { display: flex; flex-direction: column; gap: var(--spacing-terminal-gap); padding: var(--spacing-terminal-gap) var(--spacing-terminal-margin) var(--spacing-terminal-margin); background: var(--color-background); }

/* ---- Outcome screen: large round mark, title, message panel, note line ----
   @component outcome-screen-success -> .outcome-screen--success
   @component outcome-screen-refusal -> .outcome-screen--refusal
   @component outcome-screen-unresolved -> .outcome-screen--unresolved */
.outcome-screen { display: flex; flex-direction: column; align-items: center; gap: var(--spacing-terminal-gap); text-align: center; font-size: var(--typography-terminal-body-font-size); font-weight: var(--typography-terminal-body-font-weight); line-height: var(--typography-terminal-body-line-height); }
.outcome-screen__mark { display: grid; flex: none; place-items: center; width: calc(2 * var(--spacing-terminal-touch-min)); aspect-ratio: 1; border-radius: var(--rounded-full); }
.outcome-screen__mark .icon { width: 56%; height: 56%; }
.outcome-screen__title { font-size: var(--typography-outcome-title-font-size); font-weight: var(--typography-outcome-title-font-weight); line-height: var(--typography-outcome-title-line-height); letter-spacing: var(--typography-outcome-title-letter-spacing); }
.outcome-screen__message { align-self: stretch; padding: var(--spacing-terminal-margin); background: var(--color-card); color: var(--color-card-foreground); border: var(--spacing-border-width) solid var(--color-border); border-radius: var(--rounded-md); font-size: var(--typography-outcome-message-font-size); font-weight: var(--typography-outcome-message-font-weight); line-height: var(--typography-outcome-message-line-height); }
.outcome-screen__note { font-size: var(--typography-terminal-body-font-size); font-weight: var(--typography-terminal-body-font-weight); line-height: var(--typography-terminal-body-line-height); }
.outcome-screen--success .outcome-screen__mark { background: var(--color-success); color: var(--color-success-foreground); }
.outcome-screen--success .outcome-screen__title { color: var(--color-success); }
.outcome-screen--refusal .outcome-screen__mark { background: var(--color-destructive); color: var(--color-destructive-foreground); }
.outcome-screen--refusal .outcome-screen__title { color: var(--color-destructive); }
.outcome-screen--unresolved .outcome-screen__mark { background: var(--color-warning); color: var(--color-warning-foreground); }
.outcome-screen--unresolved .outcome-screen__title { color: var(--color-foreground); }

/* ---- Authorize panel: pick a name (Choice list), then passcode on the PIN pad keys ----
   @component authorize-panel -> .authorize-panel
   names is .choice-list--terminal. keys are .pin-pad__entry and .pin-pad__keys. */
.authorize-panel { display: flex; flex-direction: column; gap: var(--spacing-terminal-gap); padding: var(--spacing-terminal-margin); background: var(--color-card); border: var(--spacing-border-width) solid var(--color-input); border-radius: var(--rounded-md); font-size: var(--typography-terminal-body-font-size); font-weight: var(--typography-terminal-body-font-weight); line-height: var(--typography-terminal-body-line-height); }
.authorize-panel__title { font-size: var(--typography-terminal-title-font-size); font-weight: var(--typography-terminal-title-font-weight); line-height: var(--typography-terminal-title-line-height); letter-spacing: var(--typography-terminal-title-letter-spacing); }
.authorize-panel__meta { color: var(--color-muted-foreground); font-size: var(--typography-terminal-meta-font-size); font-weight: var(--typography-terminal-meta-font-weight); line-height: var(--typography-terminal-meta-line-height); }
.authorize-panel__error { color: var(--color-destructive); }

/* ---- Printed slip: one layout for Receipt, Receipt copy, Void slip, balance slip ----
   @component printed-slip -> .printed-slip
   Monochrome. The brand tokens do not apply. title = double height bold, strong = bold,
   balance = double height and double width bold on its own line, rules made of dashes. */
.printed-slip { box-sizing: border-box; width: var(--spacing-print-width); padding: var(--mock-print-feed) calc((var(--spacing-print-width) - var(--mock-print-columns) * 1ch) / 2); overflow: hidden; background: var(--color-print-paper); color: var(--color-print-ink); font-family: var(--mock-print-font-family); font-size: var(--mock-print-font-size); font-weight: normal; line-height: var(--mock-print-line-height); text-align: start; overflow-wrap: anywhere; }
.printed-slip :where(p, div, span) { margin: 0; }
.printed-slip__block + .printed-slip__block { margin-top: calc(1em * var(--mock-print-line-height)); }
.printed-slip__rule { display: block; overflow: hidden; white-space: nowrap; }
.printed-slip__rule::before { content: "------------------------------------------------"; }
.printed-slip__row { display: flex; justify-content: space-between; gap: 1ch; }
.printed-slip__row > :last-child { flex: none; text-align: end; }
.printed-slip__row--stack { display: block; }
.printed-slip__row--stack > :last-child { display: block; }
.printed-slip__center { display: block; text-align: center; }
.printed-slip__strong { font-weight: bold; }
.printed-slip__title { display: block; width: calc(100% * var(--mock-print-double)); font-size: calc(var(--mock-print-font-size) * var(--mock-print-double)); font-weight: bold; text-align: center; transform: scaleX(calc(1 / var(--mock-print-double))); transform-origin: left top; }
.printed-slip__balance { display: block; font-size: calc(var(--mock-print-font-size) * var(--mock-print-double)); font-weight: bold; text-align: end; }

/* ---- Stock shadcn/ui components. Stock look through the tokens, with the three library-wide
   exceptions in DESIGN.md, Components: Focus ring, touch-min target size, current-state edge ---- */
/* Tabs: the active tab adds a rule-accent rule in primary below its label */
.tabs__list { display: inline-flex; flex-wrap: wrap; gap: var(--stock-space-0-5); padding: var(--stock-space-0-5); background: var(--color-muted); color: var(--color-muted-foreground); border-radius: var(--rounded-lg); }
.tabs__trigger { display: inline-flex; align-items: center; justify-content: center; min-height: var(--spacing-touch-min); padding: 0 var(--stock-space-3); background: transparent; color: inherit; border: 0; border-radius: var(--rounded-md); font: inherit; font-weight: var(--stock-font-medium); text-decoration: none; cursor: pointer; }
.tabs__trigger.is-active, .tabs__trigger[aria-selected="true"] { background: var(--color-background); color: var(--color-foreground); --_edge: inset 0 calc(-1 * var(--spacing-rule-accent)) 0 var(--color-primary); box-shadow: var(--_edge); }

        overflow-y: auto;
      }
      .frame__viewport .sidebar {

        .frame__viewport .sidebar {
          display: none;

          display: none;

        position: absolute;
        inset-inline-end: 16px;
        inset-block-end: 16px;
        z-index: 6;

        position: absolute;
        inset: 0;
        z-index: 5;
        display: flex;
        justify-content: center;
        overflow-y: auto;

        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));

      .tiles {

        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));

        font-weight: 600;
